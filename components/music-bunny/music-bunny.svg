<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" id="bunny-svg">
  <defs>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb3ba" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffb3ba" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Тень -->
  <ellipse cx="100" cy="185" rx="40" ry="8" fill="rgba(0,0,0,0.08)"/>

  <!-- Хвост -->
  <g id="tail">
    <circle cx="145" cy="140" r="12" fill="white"/>
    <circle cx="143" cy="138" r="8" fill="#f0f0f0"/>
  </g>

  <!-- Левая лапа -->
  <g id="left-arm">
    <ellipse cx="65" cy="150" rx="12" ry="18" fill="white" transform="rotate(-20, 65, 150)"/>
    <ellipse cx="62" cy="155" rx="8" ry="6" fill="#ffb3ba"/>
  </g>

  <!-- Правая лапа -->
  <g id="right-arm">
    <ellipse cx="135" cy="150" rx="12" ry="18" fill="white" transform="rotate(20, 135, 150)"/>
    <ellipse cx="138" cy="155" rx="8" ry="6" fill="#ffb3ba"/>
  </g>

  <!-- Тело -->
  <ellipse cx="100" cy="145" rx="35" ry="45" fill="white" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Живот -->
  <ellipse cx="100" cy="145" rx="20" ry="30" fill="#fafafa"/>

  <!-- Левая нога -->
  <g id="left-foot">
    <ellipse cx="85" cy="180" rx="15" ry="8" fill="white"/>
    <ellipse cx="82" cy="182" rx="6" ry="4" fill="#ffb3ba"/>
  </g>

  <!-- Правая нога -->
  <g id="right-foot">
    <ellipse cx="115" cy="180" rx="15" ry="8" fill="white"/>
    <ellipse cx="118" cy="182" rx="6" ry="4" fill="#ffb3ba"/>
  </g>

  <!-- Голова -->
  <g id="head">
    <!-- Левое ухо -->
    <g id="left-ear">
      <ellipse cx="75" cy="60" rx="15" ry="35" fill="white" transform="rotate(-15, 75, 60)"/>
      <ellipse cx="75" cy="60" rx="8" ry="25" fill="#ffb3ba" transform="rotate(-15, 75, 60)"/>
    </g>

    <!-- Правое ухо -->
    <g id="right-ear">
      <ellipse cx="125" cy="60" rx="15" ry="35" fill="white" transform="rotate(15, 125, 60)"/>
      <ellipse cx="125" cy="60" rx="8" ry="25" fill="#ffb3ba" transform="rotate(15, 125, 60)"/>
    </g>

    <!-- Основание головы -->
    <ellipse cx="100" cy="100" rx="45" ry="40" fill="white" stroke="#f0f0f0" stroke-width="1"/>

    <!-- Щёчки -->
    <ellipse cx="70" cy="110" rx="15" ry="10" fill="url(#blush)"/>
    <ellipse cx="130" cy="110" rx="15" ry="10" fill="url(#blush)"/>

    <!-- Глаза -->
    <g id="eyes">
      <!-- Левый глаз -->
      <g id="left-eye">
        <ellipse cx="83" cy="95" rx="8" ry="10" fill="white"/>
        <ellipse cx="85" cy="95" rx="5" ry="7" fill="#2d3436"/>
        <circle cx="87" cy="93" r="2" fill="white"/>
      </g>

      <!-- Правый глаз -->
      <g id="right-eye">
        <ellipse cx="117" cy="95" rx="8" ry="10" fill="white"/>
        <ellipse cx="115" cy="95" rx="5" ry="7" fill="#2d3436"/>
        <circle cx="113" cy="93" r="2" fill="white"/>
      </g>
    </g>

    <!-- Рот -->
    <g id="mouth">
      <path d="M 92 112 Q 100 122 108 112" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
      <path d="M 94 112 Q 100 118 106 112" fill="#ff7675" stroke="none"/>
    </g>

    <!-- Нос -->
    <circle cx="100" cy="105" r="3" fill="#ffb3ba"/>
  </g>
</svg>
