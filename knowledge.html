<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знаний · Music Club Орёл</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F7F8FA;
            --surface: #ffffff;
            --border: rgba(15,23,42,0.06);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --negative: #dc2626;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03);
            --shadow-lg: 0 12px 24px rgba(0,0,0,0.04);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-sm: 12px;
            --space-4: 16px; --space-6: 24px; --space-8: 32px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 2rem;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .back-link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn {
            padding: 0.6rem 1.4rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }
        .btn:hover { background: #f8fafc; }
        .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-primary:hover { background: #4338ca; }
        .btn-danger { background: var(--negative); color: white; border-color: var(--negative); }
        .btn-danger:hover { background: #b91c1c; }

        .knowledge-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .knowledge-item {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.2rem;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: box-shadow 0.2s;
        }
        .knowledge-item:hover { box-shadow: var(--shadow-lg); }
        .knowledge-question { font-weight: 600; color: var(--text-primary); }
        .knowledge-answer { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4; }
        .knowledge-meta {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            border: 1px solid var(--border);
        }
        .form-card h2 { margin-bottom: 1rem; font-size: 1.2rem; color: var(--text-primary); }
        textarea, input {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 0.8rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-xl);
            padding: 2rem;
            max-width: 400px; width: 90%;
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.5) inset;
            animation: slideUp 0.25s ease-out;
            text-align: center;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); }
        }
        .modal p { margin-bottom: 1.5rem; font-size: 16px; }
        .modal .btn { margin: 0 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="index.html" class="back-link">← На главную</a>
        <h1>База знаний</h1>
    </div>

    <div id="knowledgeList" class="knowledge-list"></div>

    <div class="form-card">
        <h2>Добавить запись</h2>
        <input type="text" id="newQuestion" placeholder="Вопрос (например: Как скачать зарплатную ведомость?)">
        <textarea id="newAnswer" rows="3" placeholder="Ответ..."></textarea>
        <button class="btn btn-primary" id="addBtn">Добавить</button>
    </div>
</div>

<div class="modal-overlay" id="alertModal" style="display:none;">
    <div class="modal">
        <p id="alertMessage"></p>
        <button class="btn btn-primary" id="alertOkBtn">OK</button>
    </div>
</div>

<script>
    (function() {
        const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMIN_EMAIL = 'arturgalkin.ru@mail.ru';

        function customAlert(msg) {
            document.getElementById('alertMessage').textContent = msg;
            document.getElementById('alertModal').style.display = 'flex';
            document.getElementById('alertOkBtn').onclick = () => {
                document.getElementById('alertModal').style.display = 'none';
            };
        }

        async function checkAccess() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return false; }
            if (session.user.email !== ADMIN_EMAIL) {
                customAlert('Доступ только для администратора');
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        async function loadKnowledge() {
            const { data } = await _supabase.from('knowledge_base').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('knowledgeList');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color: var(--text-tertiary);">База знаний пуста. Добавьте первую запись ниже.</p>';
                return;
            }
            container.innerHTML = data.map(item => `
                <div class="knowledge-item">
                    <div class="knowledge-question">${item.question}</div>
                    <div class="knowledge-answer">${item.answer}</div>
                    <div class="knowledge-meta">
                        <span>${new Date(item.created_at).toLocaleDateString('ru')}</span>
                        <button class="btn btn-danger" data-id="${item.id}" style="padding:0.2rem 0.8rem; font-size:0.8rem;">Удалить</button>
                    </div>
                </div>
            `).join('');

            container.querySelectorAll('.btn-danger').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('Удалить запись?')) {
                        const { error } = await _supabase.from('knowledge_base').delete().eq('id', btn.dataset.id);
                        if (error) customAlert('Ошибка: ' + error.message);
                        else loadKnowledge();
                    }
                });
            });
        }

        document.getElementById('addBtn').addEventListener('click', async () => {
            const question = document.getElementById('newQuestion').value.trim();
            const answer = document.getElementById('newAnswer').value.trim();
            if (!question || !answer) {
                customAlert('Заполните вопрос и ответ');
                return;
            }
            const { error } = await _supabase.from('knowledge_base').insert([{ question, answer }]);
            if (error) {
                customAlert('Ошибка: ' + error.message);
                return;
            }
            document.getElementById('newQuestion').value = '';
            document.getElementById('newAnswer').value = '';
            loadKnowledge();
        });

        (async () => {
            if (!await checkAccess()) return;
            await loadKnowledge();
        })();
    })();
</script>
</body>
</html>
