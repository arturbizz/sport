<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Сотрудники — Music Club Орёл</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: rgba(15,23,42,0.06);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --accent: #4f46e5;
      --accent-light: #eef2ff;
      --positive: #059669;
      --negative: #dc2626;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
      --shadow-lg: 0 12px 24px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.02);
      --radius-xl: 24px; --radius-lg: 16px; --radius-sm: 12px;
      --space-4: 16px; --space-6: 24px; --space-8: 32px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      padding: 2rem;
      display: flex; justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 1200px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
    }
    .back-link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    h1 {
      font-size: 2rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn {
      padding: 0.6rem 1.4rem; border-radius: var(--radius-sm);
      font-weight: 600; cursor: pointer; font-size: 0.9rem;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-primary); box-shadow: var(--shadow-sm);
      transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn:hover { background: #f8fafc; transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-primary:hover { background: #4338ca; }
    .btn-danger { background: #dc2626; color: white; border-color: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }

    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem; margin-top: 1rem;
    }
    .emp-card {
      background: var(--surface); border-radius: var(--radius-lg);
      padding: 1.5rem; border: 1px solid var(--border);
      box-shadow: var(--shadow-sm); transition: all 0.2s;
      cursor: pointer; display: flex; flex-direction: column; gap: 0.8rem;
    }
    .emp-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .emp-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--accent-light); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.2rem;
    }
    .emp-name { font-weight: 600; }
    .emp-role { color: var(--text-secondary); font-size: 0.9rem; }
    .emp-perms { font-size: 0.75rem; color: var(--text-tertiary); display: flex; flex-wrap: wrap; gap: 4px; }
    .perm-badge {
      padding: 0.2rem 0.6rem; border-radius: 12px;
      background: var(--accent-light); color: var(--accent);
      font-weight: 500;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      padding: 2rem; max-width: 500px; width: 90%;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.5) inset;
      animation: slideUp 0.25s ease-out; text-align: left;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); }
    }
    .modal h2 { margin-bottom: 1rem; }
    .modal label { font-weight: 500; font-size: 0.85rem; color: var(--text-secondary); display: block; margin-top: 0.5rem; }
    .modal select, .modal input {
      width: 100%; padding: 0.5rem; margin-top: 0.2rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-family: inherit; font-size: 0.9rem;
    }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0; }
    .checkbox-row input[type="checkbox"] { width: auto; accent-color: var(--accent); }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; justify-content: flex-end; }
    .password-field { background: #f1f5f9; padding: 0.3rem 0.6rem; border-radius: 6px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-link">← На главную</a>
      <h1>Сотрудники</h1>
      <button class="btn btn-primary" id="addBtn">+ Добавить сотрудника</button>
    </div>
    <div class="cards-grid" id="employeesGrid"></div>
  </div>

  <!-- Модалка сотрудника -->
  <div class="modal-overlay" id="empModal" style="display:none;">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <div>
        <label>Роль</label>
        <select id="editRole">
          <option>Управляющий</option><option>Менеджер</option><option>Администратор</option>
          <option>Преподаватель</option><option>Бухгалтер</option><option>ИП</option>
        </select>
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="editEmail" placeholder="Email">
      </div>
      <div>
        <label>Специализация</label>
        <input type="text" id="editSpec" placeholder="Специализация">
      </div>
      <div id="passwordBlock" style="display:none;">
        <label>Пароль (доступен только вам)</label>
        <div class="password-field" id="passwordView"></div>
      </div>
      <div>
        <label>Права доступа</label>
        <div class="checkbox-row"><input type="checkbox" id="permDashboard"><label>Дашборд</label></div>
        <div class="checkbox-row"><input type="checkbox" id="permLeads"><label>Лиды</label></div>
        <div class="checkbox-row"><input type="checkbox" id="permBudget"><label>Бюджет</label></div>
        <div class="checkbox-row"><input type="checkbox" id="permAdmin"><label>Мониторинг</label></div>
        <div class="checkbox-row"><input type="checkbox" id="permEmployees"><label>Сотрудники</label></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="saveEmpBtn">Сохранить</button>
        <button class="btn" id="deleteEmpBtn" style="display:none;">Удалить</button>
        <button class="btn" id="impersonateBtn" style="display:none;">Сменить роль</button>
        <button class="btn" id="cancelEmpBtn">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модалка создания сотрудника -->
  <div class="modal-overlay" id="addModal" style="display:none;">
    <div class="modal">
      <h2>Новый сотрудник</h2>
      <input type="text" id="newName" placeholder="Имя">
      <select id="newRole"><option>Управляющий</option><option>Менеджер</option><option>Администратор</option><option>Преподаватель</option><option>Бухгалтер</option><option>ИП</option></select>
      <input type="email" id="newEmail" placeholder="Email">
      <input type="text" id="newSpec" placeholder="Специализация">
      <input type="text" id="newPassword" placeholder="Пароль (для заметки)">
      <div class="modal-actions">
        <button class="btn btn-primary" id="createEmpBtn">Создать</button>
        <button class="btn" id="cancelAddBtn">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
      const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      let currentUserEmail = null, employees = [], permissionsMap = {};
      const ADMIN_EMAIL = 'arturgalkin.ru@mail.ru';
      const ADMINS = [ADMIN_EMAIL, 'evelifetv@gmail.com'];

      function isAdmin() { return ADMINS.includes(currentUserEmail); }
      function isFounder() { return currentUserEmail === ADMIN_EMAIL; }

      async function loadPermissions() {
        const { data } = await _supabase.from('employee_permissions').select('*');
        permissionsMap = {};
        (data || []).forEach(p => {
          if (!permissionsMap[p.employee_id]) permissionsMap[p.employee_id] = [];
          permissionsMap[p.employee_id].push(p.section);
        });
      }

      async function loadEmployees() {
        const { data } = await _supabase.from('employees').select('*').order('name');
        employees = data || [];
        await loadPermissions();
        renderCards();
      }

      function getPermissionLabels(empId) {
        const sections = permissionsMap[empId] || [];
        const labels = { dashboard: 'Дашборд', leads: 'Лиды', budget: 'Бюджет', admin: 'Мониторинг', employees: 'Сотрудники' };
        return sections.map(s => `<span class="perm-badge">${labels[s] || s}</span>`).join('');
      }

      function renderCards() {
        const grid = document.getElementById('employeesGrid');
        grid.innerHTML = employees.map(e => `
          <div class="emp-card" data-id="${e.id}">
            <div class="emp-avatar">${e.name.charAt(0)}</div>
            <div class="emp-name">${e.name}</div>
            <div class="emp-role">${e.role} ${!e.email ? '⚠️ нет email' : ''}</div>
            <div class="emp-perms">${getPermissionLabels(e.id) || 'Нет доступов'}</div>
          </div>
        `).join('');
        document.querySelectorAll('.emp-card').forEach(card => {
          card.addEventListener('click', () => openEmployeeModal(card.dataset.id));
        });
      }

      async function openEmployeeModal(empId) {
        const emp = employees.find(e => e.id === empId);
        if (!emp) return;
        document.getElementById('modalTitle').textContent = emp.name;
        document.getElementById('editRole').value = emp.role;
        document.getElementById('editEmail').value = emp.email || '';
        document.getElementById('editSpec').value = emp.specialization || '';
        document.getElementById('passwordView').textContent = emp.password_hint || 'Не указан';
        document.getElementById('passwordBlock').style.display = isFounder() ? 'block' : 'none';
        document.getElementById('impersonateBtn').style.display = isFounder() ? 'inline-block' : 'none';
        document.getElementById('deleteEmpBtn').style.display = isAdmin() ? 'inline-block' : 'none';

        const sections = permissionsMap[emp.id] || [];
        document.getElementById('permDashboard').checked = sections.includes('dashboard');
        document.getElementById('permLeads').checked = sections.includes('leads');
        document.getElementById('permBudget').checked = sections.includes('budget');
        document.getElementById('permAdmin').checked = sections.includes('admin');
        document.getElementById('permEmployees').checked = sections.includes('employees');

        document.getElementById('empModal').dataset.empId = empId;
        document.getElementById('empModal').style.display = 'flex';
      }

      document.getElementById('saveEmpBtn').addEventListener('click', async () => {
        const empId = document.getElementById('empModal').dataset.empId;
        const role = document.getElementById('editRole').value;
        const email = document.getElementById('editEmail').value.trim();
        const spec = document.getElementById('editSpec').value.trim();
        await _supabase.from('employees').update({ role, email, specialization: spec }).eq('id', empId);

        const sections = [];
        if (document.getElementById('permDashboard').checked) sections.push('dashboard');
        if (document.getElementById('permLeads').checked) sections.push('leads');
        if (document.getElementById('permBudget').checked) sections.push('budget');
        if (document.getElementById('permAdmin').checked) sections.push('admin');
        if (document.getElementById('permEmployees').checked) sections.push('employees');
        await _supabase.from('employee_permissions').delete().eq('employee_id', empId);
        if (sections.length) {
          await _supabase.from('employee_permissions').insert(sections.map(s => ({ employee_id: empId, section: s })));
        }
        document.getElementById('empModal').style.display = 'none';
        await loadEmployees();
      });

      document.getElementById('deleteEmpBtn').addEventListener('click', async () => {
        const empId = document.getElementById('empModal').dataset.empId;
        if (confirm('Удалить сотрудника?')) {
          await _supabase.from('employees').delete().eq('id', empId);
          document.getElementById('empModal').style.display = 'none';
          await loadEmployees();
        }
      });

      document.getElementById('impersonateBtn').addEventListener('click', () => {
        const role = document.getElementById('editRole').value;
        localStorage.setItem('impersonated_role', role);
        alert(`Режим просмотра: ${role}. Осталась кнопка для возврата.`);
        // Кнопка возврата будет на всех страницах (реализуется через localStorage)
      });

      document.getElementById('cancelEmpBtn').addEventListener('click', () => {
        document.getElementById('empModal').style.display = 'none';
      });

      // Создание сотрудника
      document.getElementById('addBtn').addEventListener('click', () => {
        document.getElementById('addModal').style.display = 'flex';
      });
      document.getElementById('cancelAddBtn').addEventListener('click', () => {
        document.getElementById('addModal').style.display = 'none';
      });
      document.getElementById('createEmpBtn').addEventListener('click', async () => {
        const name = document.getElementById('newName').value.trim();
        const role = document.getElementById('newRole').value;
        const email = document.getElementById('newEmail').value.trim();
        const spec = document.getElementById('newSpec').value.trim();
        const password = document.getElementById('newPassword').value.trim();
        if (!name) return alert('Введите имя');
        await _supabase.from('employees').insert([{ name, role, email, specialization: spec, password_hint: password || null }]);
        document.getElementById('addModal').style.display = 'none';
        await loadEmployees();
      });

      (async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUserEmail = session.user.email;
        await loadEmployees();
      })();
    })();
  </script>
</body>
</html>
