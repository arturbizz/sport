<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Дашборд — Music Club Орёл</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --violet: #7c5ce7;
            --teal: #0fb9b1;
            --gold: #f9ca24;
            --rose: #ff8c94;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 2px 12px rgba(148, 163, 184, 0.08);
            --shadow-md: 0 8px 30px rgba(148, 163, 184, 0.12);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --gap: 1.8rem;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(160deg, #fef9f0 0%, #f0f7f5 30%, #f8fafc 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }
        .sidebar {
            width: 72px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.8rem 0;
            border-right: 1px solid var(--border);
            gap: 2rem;
            min-height: 100vh;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        .sidebar svg {
            width: 24px;
            height: 24px;
            color: var(--text-light);
            cursor: pointer;
            transition: 0.25s;
        }
        .sidebar svg:hover {
            color: var(--violet);
            transform: scale(1.1);
        }
        .sidebar .logout { margin-top: auto; color: #ef4444; }
        .sidebar .logout:hover { color: #dc2626; }
        .main {
            flex: 1;
            padding: 2.2rem 2.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            max-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7c5ce7, #f9ca24, #0fb9b1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        .tabs {
            display: flex;
            gap: 0.3rem;
            background: var(--surface);
            border-radius: 18px;
            padding: 0.3rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .tab {
            padding: 0.55rem 1.3rem;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--text-light);
            transition: 0.25s;
            font-size: 0.85rem;
            white-space: nowrap;
            letter-spacing: -0.01em;
        }
        .tab.active {
            background: var(--violet);
            color: #fff;
            box-shadow: 0 4px 14px rgba(124, 92, 231, 0.3);
        }
        .tab:hover:not(.active) {
            background: #f4f0ff;
            color: var(--violet);
        }
        .btn {
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--surface);
            color: var(--violet);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            letter-spacing: -0.01em;
        }
        .btn:hover {
            background: #f4f0ff;
            border-color: var(--violet);
            box-shadow: 0 6px 18px rgba(124, 92, 231, 0.12);
        }
        .btn-primary {
            background: var(--violet);
            color: #fff;
            border: none;
        }
        .btn-primary:hover { background: #6b4dd4; }
        .month-bar {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .month-chip {
            padding: 0.35rem 0.8rem;
            border-radius: 22px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            transition: 0.2s;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }
        .month-chip.active {
            background: var(--violet);
            color: #fff;
            border-color: var(--violet);
            font-weight: 600;
        }
        .month-chip:hover:not(.active) { background: #f4f0ff; border-color: var(--violet); }
        .filters {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            align-items: center;
            padding: 0.3rem 0;
        }
        .filters select, .filters input {
            padding: 0.5rem 0.9rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 0.85rem;
            color: var(--text);
            min-width: 130px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--gap);
        }
        .kpi-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 1.6rem 1.8rem;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(241, 245, 249, 0.8);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            transition: 0.25s;
            cursor: default;
        }
        .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(124, 92, 231, 0.1); }
        .kpi-card .label { font-size: 0.82rem; color: var(--text-light); font-weight: 500; letter-spacing: 0.01em; }
        .kpi-card .value { font-size: 2rem; font-weight: 700; color: var(--text); }
        .widget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--gap);
        }
        .widget-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.8rem;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(241, 245, 249, 0.8);
            cursor: default;
        }
        .widget-card h3 {
            font-size: 0.82rem;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .widget-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .widget-list li {
            display: flex; justify-content: space-between; font-size: 0.85rem;
            padding: 0.35rem 0; border-bottom: 1px solid #f9fafb;
        }
        .widget-list li span:last-child { font-weight: 600; color: var(--text); }
        .table-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.8rem;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(241, 245, 249, 0.8);
            overflow-x: auto;
            display: none;
            margin-top: 0.5rem;
            cursor: default;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border); }
        th { color: var(--text-light); font-weight: 600; background: #fafbfc; position: sticky; top: 0; }
        .rating-card {
            background: linear-gradient(135deg, #fef9f0, #fff7ed);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.8rem;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(249, 202, 36, 0.3);
        }
        .rating-row {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.6rem 0; border-bottom: 1px solid #fef3c7;
        }
        .rating-pos {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
        }
        .rating-pos.gold { background: #f9ca24; color: #7c5c00; }
        .rating-pos.silver { background: #e2e8f0; color: #475569; }
        .rating-pos.bronze { background: #fed7aa; color: #9a3412; }
        .rating-pos.default { background: #f1f5f9; color: #64748b; }
        .progress-container { width: 100%; background: #f0f0f0; border-radius: 10px; height: 14px; margin: 0.5rem 0; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 0.4s; background: linear-gradient(135deg, #0fb9b1, #7c5ce7); }
        .payout-status {
            display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
        }
        .payout-status.paid { background: #dcfce7; color: #15803d; }
        .payout-status.partial { background: #ffedd5; color: #c2410c; }
        .payout-status.unpaid { background: #ffe0e0; color: #991b1b; }
        @media (max-width: 900px) {
            .main { padding: 1.2rem; }
            .sidebar { display: none; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .widget-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="homeBtn">
            <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /><rect x="14" y="14" width="7" height="7" />
        </svg>
        <svg class="logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="logoutBtn">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
        </svg>
    </div>
    <div class="main">
        <div class="header">
            <h1>Дашборд</h1>
            <div class="tabs" id="tabBar">
                <button class="tab active" data-tab="finance">Финансы</button>
                <button class="tab" data-tab="salary">ЗП педагоги</button>
                <button class="tab" data-tab="staff">ЗП сотрудники</button>
                <button class="tab" data-tab="compare">Сравнение</button>
            </div>
        </div>
        <div id="tabContent"></div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
            const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const ADMIN_EMAIL = 'arturgalkin.ru@mail.ru';
            let currentUserEmail = null;
            let financeData = [], salaryData = [], employees = [], worklog = {}, salaryParams = {};
            let activeTab = 'finance';
            const MONTHS = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

            const filterState = {
                finance: { dateFrom: '', dateTo: '', type: '', cat: '', man: '', showRaw: false, quickMonth: null },
                salary: { name: '', subj: '', showSkipped: false, quickMonth: null },
                staff: { quickMonth: null },
                compare: { period1From: '', period1To: '', period2From: '', period2To: '' }
            };
            let currentQuickMonth = null;

            function toISODate(d) { const p = d.split('.'); return p.length === 3 ? `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}` : d; }

            async function init() {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session || session.user.email !== ADMIN_EMAIL) { window.location.href = 'login.html'; return; }
                currentUserEmail = session.user.email;
                await Promise.all([loadFinance(), loadSalary(), loadEmployees(), loadWorklog(), loadSalaryParams()]);
                const now = new Date();
                currentQuickMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
                filterState.finance.quickMonth = currentQuickMonth;
                filterState.salary.quickMonth = currentQuickMonth;
                filterState.staff.quickMonth = currentQuickMonth;
                applyQuickMonth('finance');
                applyQuickMonth('salary');
                applyQuickMonth('staff');
                renderTab();
            }

            async function loadFinance() { const { data } = await _supabase.from('crm_finance').select('*'); financeData = data || []; }
            async function loadSalary() { const { data } = await _supabase.from('teacher_salary').select('*'); salaryData = data || []; }
            async function loadEmployees() { const { data } = await _supabase.from('employees').select('*'); employees = data || []; }
            async function loadWorklog() {
                const now = new Date(); const y = now.getFullYear(), m = now.getMonth()+1;
                const startDate = `${y}-${String(m).padStart(2,'0')}-01`;
                const nextM = m === 12 ? 1 : m+1; const nextY = m === 12 ? y+1 : y;
                const endDate = `${nextY}-${String(nextM).padStart(2,'0')}-01`;
                const { data } = await _supabase.from('worklog').select('*').gte('date', startDate).lt('date', endDate);
                worklog = {}; (data || []).forEach(r => { worklog[`${r.emp_id}_${r.date}`] = r; });
            }
            async function loadSalaryParams() {
                const now = new Date(); const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
                const { data } = await _supabase.from('salary_params').select('*').eq('month', monthStr);
                salaryParams = {}; (data || []).forEach(r => { salaryParams[r.emp_id] = r; });
            }

            function applyQuickMonth(tab) {
                const qm = filterState[tab].quickMonth;
                if (!qm) return;
                const [y, m] = qm.split('-').map(Number);
                const lastDay = new Date(y, m, 0).getDate();
                filterState[tab].dateFrom = `${qm}-01`;
                filterState[tab].dateTo = `${qm}-${String(lastDay).padStart(2,'0')}`;
            }

            function getFinanceFiltered() {
                let d = financeData;
                const fs = filterState.finance;
                if (fs.dateFrom) d = d.filter(r => r.operation_date >= fs.dateFrom);
                if (fs.dateTo) d = d.filter(r => r.operation_date <= fs.dateTo);
                if (fs.type) d = d.filter(r => r.operation_type === fs.type);
                if (fs.cat) d = d.filter(r => r.category === fs.cat);
                if (fs.man) d = d.filter(r => r.manager === fs.man);
                return d;
            }
            function getSalaryFiltered() {
                let d = salaryData;
                const fs = filterState.salary;
                if (!fs.showSkipped) d = d.filter(r => !r.skipped);
                if (fs.name) d = d.filter(r => r.teacher_name === fs.name);
                if (fs.subj) d = d.filter(r => r.subject === fs.subj);
                return d;
            }

            function renderTab() {
                const content = document.getElementById('tabContent');
                switch (activeTab) {
                    case 'finance': content.innerHTML = financeHTML(); setupFinanceListeners(); renderFinance(); break;
                    case 'salary': content.innerHTML = salaryHTML(); setupSalaryListeners(); renderSalary(); break;
                    case 'staff': content.innerHTML = staffHTML(); setupStaffListeners(); renderStaff(); break;
                    case 'compare': content.innerHTML = compareHTML(); setupCompareListeners(); renderCompare(); break;
                }
                document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
            }

            function financeHTML() {
                const fs = filterState.finance;
                const types = [...new Set(financeData.map(d=>d.operation_type).filter(Boolean))].sort();
                const cats = [...new Set(financeData.map(d=>d.category).filter(Boolean))].sort();
                const mans = [...new Set(financeData.map(d=>d.manager).filter(Boolean))].sort();
                const monthChips = MONTHS.map((nm,i) => {
                    const ym = `${new Date().getFullYear()}-${String(i+1).padStart(2,'0')}`;
                    return `<span class="month-chip${fs.quickMonth===ym?' active':''}" data-ym="${ym}">${nm}</span>`;
                }).join('');
                return `
                <div class="month-bar">${monthChips}<span class="month-chip" data-ym="" style="border-style:dashed;">Весь год</span></div>
                <div class="filters">
                    <input type="date" id="finDateFrom" value="${fs.dateFrom||''}">
                    <input type="date" id="finDateTo" value="${fs.dateTo||''}">
                    <select id="finType"><option value="">Все типы</option>${types.map(t=>`<option value="${t}" ${fs.type===t?'selected':''}>${t}</option>`).join('')}</select>
                    <select id="finCat"><option value="">Все статьи</option>${cats.map(c=>`<option value="${c}" ${fs.cat===c?'selected':''}>${c}</option>`).join('')}</select>
                    <select id="finMan"><option value="">Все менеджеры</option>${mans.map(m=>`<option value="${m}" ${fs.man===m?'selected':''}>${m}</option>`).join('')}</select>
                    <button class="btn" id="uploadFinanceBtn">Загрузить отчёт</button>
                    <button class="btn" id="toggleRawFinBtn">${fs.showRaw?'Скрыть':'Показать'} исходные данные</button>
                </div>
                <div class="kpi-grid" id="finKPI"></div>
                <div class="widget-grid" id="finWidgets"></div>
                <div class="table-card" id="finRawTable" style="display:${fs.showRaw?'block':'none'};">
                    <table><thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Статья</th><th>Менеджер</th></tr></thead><tbody id="finTableBody"></tbody></table>
                </div>`;
            }

            function setupFinanceListeners() {
                document.getElementById('uploadFinanceBtn').addEventListener('click', uploadFinance);
                document.getElementById('toggleRawFinBtn').addEventListener('click', ()=>{
                    filterState.finance.showRaw = !filterState.finance.showRaw;
                    document.getElementById('finRawTable').style.display = filterState.finance.showRaw?'block':'none';
                    document.getElementById('toggleRawFinBtn').textContent = (filterState.finance.showRaw?'Скрыть':'Показать')+' исходные данные';
                });
                ['finDateFrom','finDateTo','finType','finCat','finMan'].forEach(id=>{
                    const el = document.getElementById(id);
                    if(el) el.addEventListener('change', ()=>{
                        filterState.finance.dateFrom = document.getElementById('finDateFrom')?.value||'';
                        filterState.finance.dateTo = document.getElementById('finDateTo')?.value||'';
                        filterState.finance.type = document.getElementById('finType')?.value||'';
                        filterState.finance.cat = document.getElementById('finCat')?.value||'';
                        filterState.finance.man = document.getElementById('finMan')?.value||'';
                        filterState.finance.quickMonth = null;
                        document.querySelectorAll('#tabContent .month-chip').forEach(c=>c.classList.remove('active'));
                        renderFinance();
                    });
                });
                document.querySelectorAll('#tabContent .month-chip').forEach(chip=>{
                    chip.addEventListener('click', function(){
                        const ym = this.dataset.ym;
                        document.querySelectorAll('#tabContent .month-chip').forEach(c=>c.classList.remove('active'));
                        this.classList.add('active');
                        filterState.finance.quickMonth = ym || null;
                        if(ym){
                            const [y,m]=ym.split('-').map(Number);
                            const lastDay=new Date(y,m,0).getDate();
                            filterState.finance.dateFrom=`${ym}-01`;
                            filterState.finance.dateTo=`${ym}-${String(lastDay).padStart(2,'0')}`;
                            document.getElementById('finDateFrom').value=filterState.finance.dateFrom;
                            document.getElementById('finDateTo').value=filterState.finance.dateTo;
                        }else{
                            filterState.finance.dateFrom='';
                            filterState.finance.dateTo='';
                            document.getElementById('finDateFrom').value='';
                            document.getElementById('finDateTo').value='';
                        }
                        renderFinance();
                    });
                });
            }

            function uploadFinance(){ /* тот же код загрузки Excel */ }

            function renderFinance() {
                const data = getFinanceFiltered();
                const income = data.filter(r=>['доход','продажа'].some(t=>(r.operation_type||'').toLowerCase().includes(t)));
                const expense = data.filter(r=>['расход','выплата','инкассация','возврат'].some(t=>(r.operation_type||'').toLowerCase().includes(t)));
                const ti = income.reduce((s,r)=>s+parseFloat(r.amount||0),0);
                const te = expense.reduce((s,r)=>s+parseFloat(r.amount||0),0);
                document.getElementById('finKPI').innerHTML = `
                    <div class="kpi-card"><span class="label">Доходы</span><span class="value">${ti.toLocaleString()} ₽</span></div>
                    <div class="kpi-card"><span class="label">Расходы</span><span class="value">${te.toLocaleString()} ₽</span></div>
                    <div class="kpi-card"><span class="label">Прибыль</span><span class="value">${(ti-te).toLocaleString()} ₽</span></div>
                    <div class="kpi-card"><span class="label">Маржинальность</span><span class="value">${ti?((ti-te)/ti*100).toFixed(1):0}%</span></div>`;
                const group = (arr,key)=>{
                    const m={}; arr.forEach(r=>{const k=r[key]||'—'; m[k]=(m[k]||0)+parseFloat(r.amount||0);});
                    return Object.entries(m).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a);
                };
                document.getElementById('finWidgets').innerHTML = `
                    <div class="widget-card"><h3>Расходы по статьям</h3><ul class="widget-list">${group(expense,'category').slice(0,12).map(([k,v])=>`<li><span>${k}</span><span>${v.toLocaleString()} ₽</span></li>`).join('')||'<li>Нет данных</li>'}</ul></div>
                    <div class="widget-card"><h3>Доходы по статьям</h3><ul class="widget-list">${group(income,'category').slice(0,12).map(([k,v])=>`<li><span>${k}</span><span>${v.toLocaleString()} ₽</span></li>`).join('')||'<li>Нет данных</li>'}</ul></div>

                    <div class="widget-card"><h3>Доходы по менеджерам</h3><ul class="widget-list">${group(income,'manager').slice(0,8).map(([k,v])=>`<li><span>${k}</span><span>${v.toLocaleString()} ₽</span></li>`).join('')||'<li>Нет данных</li>'}</ul></div>`;

            function setupSalaryListeners(){
                document.getElementById('uploadSalaryBtn').addEventListener('click', uploadSalary);
                document.getElementById('toggleSkippedBtn').addEventListener('click',()=>{
                    filterState.salary.showSkipped=!filterState.salary.showSkipped;

            function uploadSalary(){ /* тот же код */ }

            function getTeacherPayouts(){
                const payouts={};
                const salaryRelated = financeData.filter(r=>{
                    const cat=(r.category||'').toLowerCase();
                    const type=(r.operation_type||'').toLowerCase();
                    return cat.includes('зп')||cat.includes('зарплат')||cat.includes('педагог')||type.includes('выплата');
                });
                const teachers=[...new Set(salaryData.map(d=>d.teacher_name))];
                salaryRelated.forEach(r=>{
                    const amount=parseFloat(r.amount||0);
                    const cat=(r.category||'').toLowerCase();
                    let matched=null;
                    for(const t of teachers) if(cat.includes(t.toLowerCase())){ matched=t; break; }
                    if(!matched && teachers.length && cat.includes('педагог')) matched='общая';
                    if(matched && amount>0){
                        if(!payouts[matched]) payouts[matched]={total:0,items:[]};
                        payouts[matched].total+=amount;
                        payouts[matched].items.push({date:r.operation_date, amount, category:r.category});
                    }
                });
                return payouts;
            }

            function renderSalary(){
                const data=getSalaryFiltered();
                const total=data.reduce((s,r)=>s+parseFloat(r.amount||0),0);
                const teachers=[...new Set(data.map(r=>r.teacher_name))];
                const totalLessons=data.reduce((s,r)=>s+(r.quantity||0),0);
                const indivLessons=data.filter(r=>(r.lesson_type||'').toLowerCase().includes('индив')).reduce((s,r)=>s+(r.quantity||0),0);
                const groupLessons=data.filter(r=>(r.lesson_type||'').toLowerCase().includes('групп')).reduce((s,r)=>s+(r.quantity||0),0);
                document.getElementById('salKPI').innerHTML=`
                    <div class="kpi-card"><span class="label">Фонд оплаты</span><span class="value">${total.toLocaleString()} ₽</span></div>
                    <div class="kpi-card"><span class="label">Педагогов</span><span class="value">${teachers.length}</span></div>
                    <div class="kpi-card"><span class="label">Всего уроков</span><span class="value">${totalLessons}</span></div>
                    <div class="kpi-card"><span class="label">Инд. / Групп.</span><span class="value">${indivLessons} / ${groupLessons}</span></div>`;
                const byTeacher={}, byTeacherIndiv={}, byTeacherGroup={};
                data.forEach(r=>{
                    byTeacher[r.teacher_name]=(byTeacher[r.teacher_name]||0)+parseFloat(r.amount||0);
                    if((r.lesson_type||'').toLowerCase().includes('индив')) byTeacherIndiv[r.teacher_name]=(byTeacherIndiv[r.teacher_name]||0)+parseFloat(r.amount||0);
                    if((r.lesson_type||'').toLowerCase().includes('групп')) byTeacherGroup[r.teacher_name]=(byTeacherGroup[r.teacher_name]||0)+parseFloat(r.amount||0);
                });
                const bySubject={};
                data.forEach(r=>{ bySubject[r.subject]=(bySubject[r.subject]||0)+parseFloat(r.amount||0); });
                document.getElementById('salWidgets').innerHTML=`
                    <div class="widget-card"><h3>По педагогам (всего)</h3><ul class="widget-list">${Object.entries(byTeacher).sort(([,a],[,b])=>b-a).slice(0,10).map(([k,v])=>`<li><span>${k}</span><span>${v.toLocaleString()} ₽</span></li>`).join('')||'<li>Нет данных</li>'}</ul></div>
                    <div class="widget-card"><h3>Индивидуальные</h3><ul class="widget-list">${Object.entries(byTeacherIndiv).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).slice(0,8).map(([k,v])=>`<li><span>${k}</span><span>${v.toLocaleString()} ₽</span></li>`).join('')||'<li>Нет данных</li>'}</ul></div>
                    <div class="widget-card"><h3>Групповые</h3><ul class="widget-list">${Object.entries(byTeacherGroup).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).slice(0,8).map(([k,v])=>`<li><span>${k}</span><span>${v.toLocaleString()} ₽</span></li>`).join('')||'<li>Нет данных</li>'}</ul></div>
                    <div class="widget-card"><h3>По предметам</h3><ul class="widget-list">${Object.entries(bySubject).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).map(([k,v])=>`<li><span>${k}</span><span>${v.toLocaleString()} ₽</span></li>`).join('')||'<li>Нет данных</li>'}</ul></div>`;

                const ratingData = teachers.map(name=>{
                    const indivQty=data.filter(r=>r.teacher_name===name&&(r.lesson_type||'').toLowerCase().includes('индив')).reduce((s,r)=>s+(r.quantity||0),0);
                    const groupQty=data.filter(r=>r.teacher_name===name&&(r.lesson_type||'').toLowerCase().includes('групп')).reduce((s,r)=>s+(r.quantity||0),0);
                    return {name, indivQty, groupQty, score: indivQty+groupQty*2, totalEarned: byTeacher[name]||0};
                }).sort((a,b)=>b.score-a.score);
                document.getElementById('salRating').innerHTML=`<h3 style="margin-bottom:1rem;">Рейтинг преподавателей <small style="color:var(--text-light); font-weight:400;">(групповые ×2)</small></h3>${ratingData.map((r,i)=>{
                    let cls='default', medal=i+1;
                    if(i===0){ cls='gold'; medal='1'; }else if(i===1){ cls='silver'; medal='2'; }else if(i===2){ cls='bronze'; medal='3'; }
                    return `<div class="rating-row"><div class="rating-pos ${cls}">${medal}</div><div style="flex:1;"><strong>${r.name}</strong><br><small style="color:var(--text-light);">Инд: ${r.indivQty} | Групп: ${r.groupQty} | Баллы: ${r.score}</small></div><div style="font-weight:700;">${r.totalEarned.toLocaleString()} ₽</div></div>`;
                }).join('')}`;

                const payouts = getTeacherPayouts();
                document.getElementById('salPayoutWidgets').innerHTML = teachers.map(name=>{
                    const accrued = byTeacher[name]||0;
                    const paid = payouts[name]?.total||0;
                    const remaining = accrued - paid;
                    let statusClass='unpaid', statusText='Не выплачено';
                    if(paid>=accrued && accrued>0){ statusClass='paid'; statusText='Выплачено'; }
                    else if(paid>0 && paid<accrued){ statusClass='partial'; statusText='Частично'; }
                    return `<div class="widget-card"><h3>${name}</h3>
                        <div style="display:flex;justify-content:space-between;margin:0.3rem 0;"><span>Начислено:</span><strong>${accrued.toLocaleString()} ₽</strong></div>
                        <div style="display:flex;justify-content:space-between;margin:0.3rem 0;"><span>Выплачено:</span><strong>${paid.toLocaleString()} ₽</strong></div>
                        <div style="display:flex;justify-content:space-between;margin:0.3rem 0;"><span>Остаток:</span><strong style="color:${remaining>0?'#c2410c':'#15803d'};">${remaining.toLocaleString()} ₽</strong></div>
                        <span class="payout-status ${statusClass}">${statusText}</span>
                        ${paid>0?`<div class="progress-container"><div class="progress-fill" style="width:${Math.min(100,(paid/accrued*100))}%;"></div></div>`:''}
                    </div>`;
                }).join('');
                document.getElementById('salPayoutWidgets').style.display='grid';
                document.getElementById('salPayoutWidgets').style.gridTemplateColumns='repeat(auto-fit, minmax(260px, 1fr))';
                document.getElementById('salPayoutWidgets').style.gap='var(--gap)';

                document.getElementById('salTableBody').innerHTML = data.slice(0,60).map(r=>`<tr><td>${r.teacher_name}</td><td>${r.subject}</td><td>${r.lesson_type}</td><td>${r.rate}</td><td>${r.quantity}</td><td>${parseFloat(r.amount||0).toLocaleString()} ₽</td></tr>`).join('');
                document.getElementById('salRawTable').style.display='block';
            }

            function staffHTML(){

                </div>`;

            function setupStaffListeners(){
                document.querySelectorAll('#tabContent .month-chip').forEach(chip=>{

            function getStaffSalary(emp){
                const qm=filterState.staff.quickMonth||currentQuickMonth;
                const [y,m]=(qm||`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`).split('-').map(Number);
                const daysInMonth=new Date(y,m,0).getDate();
                let worked=0,sales=0;
                for(let d=1;d<=daysInMonth;d++){
                    const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const rec=worklog[`${emp.id}_${dateStr}`];
                    if(!rec||rec.status!=='working') continue;
                    worked++;
                    if(emp.role==='Менеджер') sales+=rec.daily_sales||0;
                }
                const params=salaryParams[emp.id]||{};
                const rates={'Менеджер':20000,'Администратор':25000,'Управляющий':50000};
                const normDays=emp.role==='Менеджер'?(new Date(y,m,0).getDate()*0.5):(params.norm_days||22);
                const dailyRate=(rates[emp.role]||0)/Math.max(normDays,1);
                let base=dailyRate*worked, bonus=0;
                if(emp.role==='Менеджер'){
                    const plan=params.plan_amount||0;
                    bonus=sales*((plan>0&&sales>=plan)?7:5)/100;
                }else if(emp.role==='Администратор'){
                    const ms=employees.filter(e=>e.role==='Менеджер').reduce((sum,man)=>{
                        for(let d=1;d<=daysInMonth;d++){ const key=`${man.id}_${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const rec=worklog[key]; if(rec&&rec.status==='working') sum+=rec.daily_sales||0; }
                        return sum;
                    },0);
                    bonus=ms*0.01;
                }else if(emp.role==='Управляющий'){
                    const ms=employees.filter(e=>e.role==='Менеджер').reduce((sum,man)=>{
                        for(let d=1;d<=daysInMonth;d++){ const key=`${man.id}_${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const rec=worklog[key]; if(rec&&rec.status==='working') sum+=rec.daily_sales||0; }
                        return sum;
                    },0);
                    bonus=(params.plan_amount>0&&ms>=params.plan_amount)?ms*0.01:0;
                }
                return {worked,base,bonus,total:base+bonus,sales};
            }

            function renderStaff(){
                const staffRoles=['Управляющий','Менеджер','Администратор'];
                const staffEmps=employees.filter(e=>staffRoles.includes(e.role));
                const results=staffEmps.map(emp=>({emp,...getStaffSalary(emp)}));
                document.getElementById('staffKPI').innerHTML=`
                    <div class="kpi-card"><span class="label">Фонд оплаты (staff)</span><span class="value">${results.reduce((s,r)=>s+r.total,0).toLocaleString()} ₽</span></div>

                    <div class="kpi-card"><span class="label">Всего смен</span><span class="value">${results.reduce((s,r)=>s+r.worked,0)}</span></div>`;
                document.getElementById('staffWidgets').innerHTML=results.map(r=>`
                    <div class="widget-card"><h3>${r.emp.name} (${r.emp.role})</h3>
                        <div style="display:flex;justify-content:space-between;"><span>Смен:</span><strong>${r.worked}</strong></div>
                        <div style="display:flex;justify-content:space-between;"><span>Базовая:</span><strong>${r.base.toFixed(0)} ₽</strong></div>
                        <div style="display:flex;justify-content:space-between;"><span>Бонус:</span><strong>${r.bonus.toFixed(0)} ₽</strong></div>
                        <div style="display:flex;justify-content:space-between;font-size:1.1rem;margin-top:0.5rem;"><span>Итого:</span><strong style="color:var(--violet);">${r.total.toFixed(0)} ₽</strong></div>
                        ${r.emp.role==='Менеджер'?`<div style="display:flex;justify-content:space-between;"><span>Продажи:</span><strong>${r.sales.toLocaleString()} ₽</strong></div>`:''}
                    </div>`).join('');
                document.getElementById('staffTableBody').innerHTML=results.map(r=>`<tr><td>${r.emp.name}</td><td>${r.emp.role}</td><td>${r.worked}</td><td>${r.base.toFixed(0)} ₽</td><td>${r.bonus.toFixed(0)} ₽</td><td><strong>${r.total.toFixed(0)} ₽</strong></td></tr>`).join('');
                document.getElementById('staffRawTable').style.display='block';
            }
