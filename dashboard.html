<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Дашборд · Music Club Орёл</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --border: rgba(15,23,42,0.06);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --positive: #059669;
            --negative: #dc2626;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
            --shadow-lg: 0 12px 24px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.02);
            --radius-2xl: 24px;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
            --sidebar-width: 72px;
            --transition-base: 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
            cursor: default;
            caret-color: transparent;
            position: relative;
            overflow-x: hidden;
        }
        input, select, textarea { cursor: default; caret-color: transparent; }
        .ambient-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
        }
        .ambient-blob.top-right { width: 500px; height: 500px; background: var(--accent); top: -100px; right: -100px; }
        .ambient-blob.bottom-left { width: 400px; height: 400px; background: #2563eb; bottom: -100px; left: -100px; }
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--space-8) 0;
            gap: var(--space-10);
            position: fixed;
            top: 0; bottom: 0;
            z-index: 20;
            box-shadow: var(--shadow-sm);
        }
        .sidebar-icon {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-md);
            color: var(--text-tertiary);
            transition: all var(--transition-base);
            cursor: pointer;
            position: relative;
        }
        .sidebar-icon.active {
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
        }
        .sidebar-icon:hover { background: rgba(0,0,0,0.02); color: var(--text-primary); }
        .sidebar-icon.active:hover { background: var(--accent-light); color: var(--accent); }
        .sidebar-icon.logout { margin-top: auto; color: #ef4444; }
        .sidebar-icon.logout:hover { background: rgba(239,68,68,0.06); }
        .main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: var(--space-10);
            display: flex;
            flex-direction: column;
            gap: var(--space-8);
            max-width: 1440px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-6);
        }
        .topbar-left h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .topbar-right { display: flex; gap: var(--space-3); align-items: center; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-weight: 550;
            font-size: 14px;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: all var(--transition-base);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        .btn:hover {
            background: #f8fafc;
            border-color: rgba(0,0,0,0.08);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(79,70,229,0.2);
        }
        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
            box-shadow: 0 8px 20px rgba(79,70,229,0.3);
        }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .tabs {
            display: flex;
            gap: var(--space-2);
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 4px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            align-self: flex-start;
            backdrop-filter: blur(8px);
        }
        .tab {
            padding: 8px 20px;
            border-radius: var(--radius-lg);
            font-weight: 550;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-base);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .tab.active {
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
        }
        .tab:hover:not(.active) { background: rgba(0,0,0,0.02); color: var(--text-primary); }
        .filters-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-3);
        }
        .filter-select, .filter-input {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 14px;
            color: var(--text-primary);
            min-width: 130px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
            cursor: default;
            backdrop-filter: blur(8px);
        }
        .filter-select:hover, .filter-input:hover { border-color: rgba(0,0,0,0.1); }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: var(--space-6);
        }
        .kpi-card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            backdrop-filter: blur(12px);
        }
        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .kpi-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .kpi-value {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1;
        }
        .widget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: var(--space-6);
            align-items: start;
        }
        .widget-card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
            height: fit-content;
            backdrop-filter: blur(12px);
        }
        .widget-card:hover {
            box-shadow: var(--shadow-lg);
        }
        .widget-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: var(--space-5);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .widget-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }
        .widget-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            padding: var(--space-2) 0;
            border-bottom: 1px solid rgba(0,0,0,0.02);
            transition: background 0.2s;
        }
        .widget-list li:hover { background: rgba(0,0,0,0.01); border-radius: var(--radius-sm); }
        .widget-list li span:last-child { font-weight: 550; }
        .empty-message {
            color: var(--text-tertiary);
            font-size: 14px;
            padding: var(--space-4) 0;
            text-align: center;
        }
        .table-container {
            background: var(--surface);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            backdrop-filter: blur(12px);
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th {
            text-align: left;
            padding: var(--space-4) var(--space-6);
            font-weight: 550;
            color: var(--text-tertiary);
            background: rgba(248,250,252,0.5);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        td { padding: var(--space-4) var(--space-6); border-bottom: 1px solid rgba(0,0,0,0.02); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(0,0,0,0.005); }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 550;
            background: #fef3c7;
            color: #b45309;
        }
        .badge.red { background: #fee2e2; color: #b91c1c; }
        .month-nav { display: flex; align-items: center; gap: var(--space-2); }
        .month-nav .month-title {
            font-size: 15px; font-weight: 550; color: var(--text-primary); min-width: 120px; text-align: center;
            background: var(--surface); padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
        }
        .progress-container {
            width: 100%; background: #f1f5f9; border-radius: 10px; height: 6px; margin: var(--space-3) 0; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 10px; transition: width 0.3s;
            background: linear-gradient(90deg, var(--accent), #6366f1);
        }
        /* Модальное окно */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            max-width: 400px; width: 90%;
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.5) inset;
            animation: slideUp 0.25s ease-out;
            text-align: center;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); }
        }
        .modal p { margin-bottom: var(--space-6); color: var(--text-primary); font-size: 16px; line-height: 1.5; }
        .modal .btn { margin: 0 4px; }
        .hidden { display: none !important; }
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: var(--space-4); }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .widget-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="ambient-blob top-right"></div>
<div class="ambient-blob bottom-left"></div>
<aside class="sidebar">
    <div class="sidebar-icon active" id="homeSidebarBtn" title="Главная">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="sidebar-icon logout" id="logoutSidebarBtn" title="Выйти">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div class="topbar-left"><h1>Аналитика</h1></div>
        <div class="topbar-right">
            <button class="btn" id="showAllWidgetsBtn">Показать всё</button>
            <button class="btn" id="resetFiltersGlobalBtn">Сбросить</button>
        </div>
    </div>
    <div class="tabs" id="tabBar">
        <button class="tab active" data-tab="finance">Финансы</button>
        <button class="tab" data-tab="salary">ЗП педагоги</button>
        <button class="tab" data-tab="staff">ЗП сотрудники</button>
        <button class="tab" data-tab="compare">Сравнение</button>
    </div>
    <div id="tabContent" style="display:flex;flex-direction:column;gap:var(--space-8);"></div>
</main>

<!-- Модальное окно уведомлений -->
<div class="modal-overlay" id="alertModal" style="display:none;">
    <div class="modal">
        <p id="alertMessage"></p>
        <button class="btn btn-primary" id="alertOkBtn">OK</button>
    </div>
</div>

<script>
(function() {
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_EMAIL = 'arturgalkin.ru@mail.ru';

    let currentUserEmail, financeData=[], salaryData=[], employees=[], worklog={}, salaryParams={}, expensesData=[];
    let activeTab = localStorage.getItem('dash_activeTab') || 'finance';
    let staffYear = new Date().getFullYear();
    let staffMonth = new Date().getMonth() + 1;
    let salaryYear = new Date().getFullYear();
    let salaryMonth = new Date().getMonth() + 1;
    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    let salaryUploadInProgress = false;
    let staffResults = []; // храним результаты расчёта для экспорта

    const DEFAULT_FILTER_STATE = {
        finance: { dateFrom:'', dateTo:'', type:'', cat:'', man:'', acc:'', payType:'', showRaw:false },
        salary: { name:'', subj:'', showSkipped:false, period:'full' },
        staff: { period:'full' },
        compare: { period1From:'', period1To:'', period2From:'', period2To:'' }
    };
    let filterState;
    try {
        const saved = JSON.parse(localStorage.getItem('dash_filterState'));
        filterState = saved ? { ...DEFAULT_FILTER_STATE, ...saved,
            finance: { ...DEFAULT_FILTER_STATE.finance, ...(saved.finance||{}) },
            salary: { ...DEFAULT_FILTER_STATE.salary, ...(saved.salary||{}) },
            staff: { ...DEFAULT_FILTER_STATE.staff, ...(saved.staff||{}) },
            compare: { ...DEFAULT_FILTER_STATE.compare, ...(saved.compare||{}) }
        } : JSON.parse(JSON.stringify(DEFAULT_FILTER_STATE));
    } catch(e) { filterState = JSON.parse(JSON.stringify(DEFAULT_FILTER_STATE)); }

    function persistState() {
        localStorage.setItem('dash_activeTab', activeTab);
        localStorage.setItem('dash_filterState', JSON.stringify(filterState));
    }

    function toISODate(d) { const p=d.split('.'); return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:d; }

    function customAlert(msg) {
        document.getElementById('alertMessage').textContent = msg;
        document.getElementById('alertModal').style.display = 'flex';
        document.getElementById('alertOkBtn').onclick = () => {
            document.getElementById('alertModal').style.display = 'none';
        };
    }

    function applyGradientColors(listElement, values) {
        if (!listElement || !values || values.length === 0) return;
        const maxVal = Math.max(...values);
        const minVal = Math.min(...values);
        const items = listElement.querySelectorAll('li');
        items.forEach((li, index) => {
            const val = values[index] || 0;
            let ratio = maxVal === minVal ? 0.5 : (val - minVal) / (maxVal - minVal);
            const hue = ratio * 120;
            li.style.backgroundColor = `hsla(${hue}, 40%, 88%, 0.25)`;
        });
    }

    async function init() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session || (session.user.email||'').trim().toLowerCase() !== ADMIN_EMAIL.trim().toLowerCase()) { window.location.href='login.html'; return; }
        currentUserEmail = session.user.email;
        await Promise.all([loadFinance(), loadSalary(), loadEmployees(), loadWorklog(staffYear, staffMonth), loadSalaryParams(), loadExpenses()]);
        const now = new Date();
        if (!filterState.finance.dateFrom) {
            filterState.finance.dateFrom = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
            const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
            filterState.finance.dateTo = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
        }
        renderTab();
    }

    async function loadFinance() { const { data } = await _supabase.from('crm_finance').select('*'); financeData = data || []; }
    async function loadSalary() { const { data } = await _supabase.from('teacher_salary').select('*'); salaryData = data || []; }
    async function loadEmployees() { const { data } = await _supabase.from('employees').select('*'); employees = data || []; }
    async function loadWorklog(year, month) {
        const start = `${year}-${String(month).padStart(2,'0')}-01`;
        const nextM = month===12?1:month+1; const nextY = month===12?year+1:year;
        const end = `${nextY}-${String(nextM).padStart(2,'0')}-01`;
        const { data } = await _supabase.from('worklog').select('*').gte('date',start).lt('date',end);
        worklog = {}; (data||[]).forEach(r=>{ worklog[`${r.emp_id}_${r.date}`] = r; });
    }
    async function loadSalaryParams() {
        const monthStr = `${staffYear}-${String(staffMonth).padStart(2,'0')}`;
        const { data } = await _supabase.from('salary_params').select('*').eq('month', monthStr);
        salaryParams = {}; (data||[]).forEach(r=>{ salaryParams[r.emp_id] = r; });
    }
    async function loadExpenses() { const { data } = await _supabase.from('expenses').select('*').eq('paid', false); expensesData = data || []; }

    function renderTab() {
        const content = document.getElementById('tabContent');
        switch (activeTab) {
            case 'finance': content.innerHTML = financeHTML(); setupFinanceListeners(); renderFinance(); break;
            case 'salary': content.innerHTML = salaryHTML(); setupSalaryListeners(); renderSalary(); break;
            case 'staff': content.innerHTML = staffHTML(); setupStaffListeners(); renderStaff(); break;
            case 'compare': content.innerHTML = compareHTML(); setupCompareListeners(); renderCompare(); break;
        }
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
    }

    function financeHTML() {
        const f = filterState.finance;
        const types = [...new Set(financeData.map(d=>d.operation_type).filter(Boolean))].sort();
        const cats = [...new Set(financeData.map(d=>d.category).filter(Boolean))].sort();
        const mans = [...new Set(financeData.map(d=>d.manager).filter(Boolean))].sort();
        const accs = [...new Set(financeData.map(d=>d.account).filter(Boolean))].sort();
        const payTypes = [...new Set(financeData.map(d=>d.payment_type).filter(Boolean))].sort();
        return `
        <div class="filters-row">
            <button class="btn" id="currentMonthBtn">Текущий месяц</button>
            <input type="date" class="filter-input" id="finDateFrom" value="${f.dateFrom||''}">
            <input type="date" class="filter-input" id="finDateTo" value="${f.dateTo||''}">
            <select class="filter-select" id="finType"><option value="">Все типы</option>${types.map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select>
            <select class="filter-select" id="finCat"><option value="">Все статьи</option>${cats.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
            <select class="filter-select" id="finAcc"><option value="">Все счета</option>${accs.map(a=>`<option ${f.acc===a?'selected':''}>${a}</option>`).join('')}</select>
            <select class="filter-select" id="finPayType"><option value="">Тип платежа</option>${payTypes.map(p=>`<option ${f.payType===p?'selected':''}>${p}</option>`).join('')}</select>
            <select class="filter-select" id="finMan"><option value="">Менеджер</option>${mans.map(m=>`<option ${f.man===m?'selected':''}>${m}</option>`).join('')}</select>
            <button class="btn" id="uploadFinanceBtn">Загрузить Excel</button>
            <button class="btn" id="toggleRawFinBtn">${f.showRaw?'Скрыть':'Показать'} таблицу</button>
        </div>
        <div class="kpi-grid" id="finKPI"></div>
        <div id="finPaymentsWidget" style="margin-bottom: var(--space-6);"></div>

    function uploadFinance() {
        const input = document.createElement('input'); input.type='file'; input.accept='.xlsx';
        input.onchange = async (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                const headerIdx = rows.findIndex(r => r && r.join('').includes('Дата'));
                if(headerIdx===-1) { customAlert('Не найден заголовок'); return; }
                const headers = rows[headerIdx].map(h=>String(h).trim().toLowerCase());
                const dateIdx = headers.findIndex(h=>h.startsWith('дата'));
                const typeIdx = headers.findIndex(h=>h.startsWith('тип'));
                const amountIdx = headers.findIndex(h=>h.startsWith('сумма'));
                const catIdx = headers.findIndex(h=>h.startsWith('статья'));
                const accIdx = headers.findIndex(h=>h.includes('счет')||h.includes('касса'));
                const payTypeIdx = headers.findIndex(h=>h.includes('тип платежа'));
                let manIdx = headers.findIndex(h=>h.includes('менеджер (фамилия имя)') || h.includes('менеджер(фамилия имя)'));
                if (manIdx === -1) manIdx = headers.findIndex(h=>h.includes('менеджер') && !h.includes('ответственный'));
                let clientIdx = headers.findIndex(h=>h === 'клиент' || h.startsWith('клиент') || h.startsWith('фио клиента') || h === 'плательщик');
                if (clientIdx === -1) clientIdx = headers.findIndex(h=>h.includes('клиент') || h.includes('плательщик'));
                const teacherIdx = headers.findIndex(h=>h.includes('педагог'));
                const periodIdx = headers.findIndex(h=>h.includes('период'));
                const parsed = [];
                for(let i=headerIdx+1; i<rows.length; i++){
                    const cols=rows[i]; if(!cols) continue;
                    const amt = parseFloat(String(cols[amountIdx]||'0').replace(/\s/g,'').replace(',','.'));
                    if(isNaN(amt)) continue;
                    const row = {
                        operation_date: toISODate(String(cols[dateIdx]||'').trim()),
                        operation_type: String(cols[typeIdx]||'').trim(),
                        amount: amt,
                        category: String(cols[catIdx]||'').trim(),
                        account: accIdx!==-1 ? String(cols[accIdx]||'').trim() : '',
                        payment_type: payTypeIdx!==-1 ? String(cols[payTypeIdx]||'').trim() : '',
                        manager: manIdx!==-1 ? String(cols[manIdx]||'').trim() : '',
                        client: clientIdx!==-1 ? String(cols[clientIdx]||'').trim() : ''
                    };
                    if (teacherIdx !== -1) row.teacher_name = String(cols[teacherIdx]||'').trim() || null;
                    if (periodIdx !== -1) row.period = String(cols[periodIdx]||'').trim() || null;
                    parsed.push(row);
                }
                if (clientIdx === -1) customAlert('⚠️ Столбец с клиентом не найден. Продажи по лидам не будут рассчитаны.');
                const { error: delErr } = await _supabase.from('crm_finance').delete().neq('id',0);
                if (delErr) { customAlert('Ошибка удаления старых данных: ' + delErr.message); return; }
                let { error: insErr } = await _supabase.from('crm_finance').insert(parsed);
                if (insErr && (teacherIdx !== -1 || periodIdx !== -1)) {
                    const fallbackParsed = parsed.map(r => { const { teacher_name, period, ...rest } = r; return rest; });
                    const retry = await _supabase.from('crm_finance').insert(fallbackParsed);
                    if (!retry.error) { insErr = null; }
                }
                if (insErr) { customAlert('ОШИБКА ЗАГРУЗКИ: ' + insErr.message); await loadFinance(); renderFinance(); return; }
                await loadFinance();
                renderFinance();
                customAlert('Финансовый отчёт загружен (' + parsed.length + ' записей)');
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }

        if (f.dateFrom) d = d.filter(r => r.operation_date >= f.dateFrom);

        if (f.type) d = d.filter(r => r.operation_type === f.type);
        if (f.cat) d = d.filter(r => r.category === f.cat);
        if (f.man) d = d.filter(r => r.manager === f.man);
        if (f.acc) d = d.filter(r => r.account === f.acc);
        if (f.payType) d = d.filter(r => r.payment_type === f.payType);
        return d;
    }

            <div class="kpi-card"><span class="kpi-label">Маржинальность</span><span class="kpi-value">${ti?((ti-te)/ti*100).toFixed(1):0}%</span></div>`;

        // Виджет ближайших платежей (наверх)
        let paymentsHtml = '';
        if (expensesData.length) {
            const todayISO = new Date().toISOString().slice(0,10);
            const upcoming = [...expensesData]
                .filter(e => !e.paid)
                .sort((a, b) => {
                    if (!a.next_payment_date && !b.next_payment_date) return 0;
                    if (!a.next_payment_date) return 1;
                    if (!b.next_payment_date) return -1;
                    return a.next_payment_date.localeCompare(b.next_payment_date);
                })
                .slice(0, 8);
            paymentsHtml = `
            <div class="widget-card">
                <div class="widget-title">Ближайшие обязательные платежи</div>
                <ul class="widget-list">
                    ${upcoming.length ? upcoming.map(e => {
                        const overdue = e.next_payment_date && e.next_payment_date < todayISO;
                        const dateStr = e.next_payment_date ? new Date(e.next_payment_date).toLocaleDateString('ru', {day:'numeric', month:'short'}) : '—';
                        return `<li style="${overdue ? 'background: rgba(220,38,38,0.04); border-radius: var(--radius-sm);' : ''}">
                            <span style="flex:1; white-space:normal;">${e.name}</span>

                        </li>`;
                    }).join('') : '<li class="empty-message">Все платежи оплачены</li>'}
                </ul>
            </div>`;
        }
        document.getElementById('finPaymentsWidget').innerHTML = paymentsHtml;

        const group = (arr,key, excludeList=[])=>{
            const m={}; arr.forEach(r=>{ let k=r[key]||'—'; if(excludeList.includes(k)) return; if(key==='manager' && k==='кто менеджер?') k='Репетиции'; m[k]=(m[k]||0)+parseFloat(r.amount||0);});
            return Object.entries(m).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a);
        };
        const excludeManagers = ['Ресепшен Орёл', '—', ''];
        let widgetsHtml = '';
        function generateWidget(title, entries) {
            if (entries.length === 0) return `<div class="widget-card"><div class="widget-title">${title}</div><ul class="widget-list"><li class="empty-message">Нет данных</li></ul></div>`;
            const values = entries.map(e => e[1]);

            entries.forEach(([key, val]) => {
                html += `<li><span>${key}</span><span>${val.toLocaleString()} ₽</span></li>`;
            });
            html += '</ul></div>';
            setTimeout(() => {
                const ul = document.getElementById(`list-${title.replace(/\s/g,'')}`);
                if (ul) applyGradientColors(ul, values);
            }, 0);
            return html;
        }

        widgetsHtml += generateWidget('Расходы по статьям', group(expense,'category').slice(0,10));
        widgetsHtml += generateWidget('Доходы по статьям', group(income,'category').slice(0,10));
        widgetsHtml += generateWidget('Доходы по менеджерам', group(income,'manager', excludeManagers).slice(0,8));
        widgetsHtml += generateWidget('Расходы по счетам', group(expense,'account').slice(0,8));
        widgetsHtml += generateWidget('Доходы по счетам', group(income,'account').slice(0,8));

    }

    async function uploadSalary(period) {
        const monthStr = `${salaryYear}-${String(salaryMonth).padStart(2,'0')}`;
        const input = document.createElement('input'); input.type='file'; input.accept='.xlsx';
        return new Promise((resolve) => {
            input.onchange = async (e) => {
                const file = e.target.files[0]; if(!file) { resolve(); return; }
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const data = new Uint8Array(ev.target.result);
                    const wb = XLSX.read(data, {type:'array'});
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                    const parsed = [];
                    let currentTeacher = '';
                    for(let i=0; i<rows.length; i++){
                        const row = rows[i]; if(!row || row.length<2) continue;
                        const line = row.join(' ').trim();
                        if(line.startsWith('Выписка по зарплате -')){
                            currentTeacher = line.replace('Выписка по зарплате -','').split('За период')[0].trim();
                        } else if(row.length>=5 && !line.startsWith('Итого') && !line.startsWith('Пропущенные') && !line.startsWith('Общая сумма')){
                            if (row[0] === 'Предмет' || line.includes('Сумма по филиалу') || row[0] === 'Орел') continue;
                            const subject = String(row[0]||'').trim();
                            const lessonType = String(row[1]||'').trim();
                            const rate = parseFloat(String(row[2]||'0').replace(',','.'))||0;
                            const qty = parseInt(String(row[3]||'0').replace(' шт.',''))||0;
                            const amount = parseFloat(String(row[4]||'0').replace(',','.').replace(/\s/g,''))||0;
                            if(qty>0||amount>0) parsed.push({ teacher_name: currentTeacher, subject, lesson_type: lessonType, rate, quantity: qty, amount, skipped: false, period, month: monthStr });
                        } else if(line.startsWith('Пропущенные записи')){
                            const qty = parseInt(String(row[4]||'0').replace(' шт.',''))||0;
                            parsed.push({ teacher_name: currentTeacher, subject: 'Пропущенные', lesson_type: '', rate: 0, quantity: qty, amount: 0, skipped: true, period, month: monthStr });
                        }
                    }
                    if (parsed.length === 0) {
                        customAlert('Не удалось разобрать файл. Убедитесь, что файл содержит строки уроков после заголовков "Предмет Тип Ставка Кол-во Сумма".');
                        resolve();
                        return;
                    }
                    const { error: delErr } = await _supabase.from('teacher_salary').delete().eq('period', period).eq('month', monthStr);
                    if (delErr) { customAlert('Ошибка очистки данных: ' + delErr.message); resolve(); return; }
                    const { error: insErr } = await _supabase.from('teacher_salary').insert(parsed);
                    if (insErr) {
                        customAlert('ОШИБКА ЗАГРУЗКИ: ' + insErr.message);
                        await loadSalary(); renderSalary();
                        resolve();
                        return;
                    }
                    await loadSalary();
                    renderSalary();
                    customAlert(`Загружено строк: ${parsed.length} (период: ${period}, месяц: ${monthNames[salaryMonth-1]} ${salaryYear})`);
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            };
            input.click();
        });
    }

    function getTeacherPayouts() {
        const monthStr = `${salaryYear}-${String(salaryMonth).padStart(2,'0')}`;
        const startDate = `${monthStr}-01`;
        const lastDay = new Date(salaryYear, salaryMonth, 0).getDate();
        const endDate = `${monthStr}-${String(lastDay).padStart(2,'0')}`;
        const salaryRelated = financeData.filter(r=>{
            const type = (r.operation_type||'').toLowerCase();
            const cat = (r.category||'').toLowerCase();
            return (type.includes('расход') || type.includes('выплата')) &&
                   (cat.includes('зп') || cat.includes('зарплат') || cat.includes('педагог')) &&
                   r.operation_date >= startDate && r.operation_date <= endDate;
        });
        const teachers = [...new Set(salaryData.filter(r=>r.month===monthStr).map(d=>d.teacher_name))];
        const payouts = {};
        salaryRelated.forEach(r=>{
            const amount = parseFloat(r.amount||0);
            const cat = (r.category||'').toLowerCase();
            let matched = null;
            if (r.teacher_name && teachers.includes(r.teacher_name)) {
                matched = r.teacher_name;
            } else {
                for (const t of teachers) {
                    if (t && cat.includes(t.toLowerCase())) {
                        matched = t;
                        break;
                    }
                }
            }
            if (matched && amount > 0) {
                if (!payouts[matched]) payouts[matched] = { total:0, items:[] };
                payouts[matched].total += amount;
                payouts[matched].items.push({ date: r.operation_date, amount, category: r.category });
            }
        });
        return payouts;
    }

    function renderStaff() {
        persistState();
        updateStaffPeriodButtons(
            filterState.staff.period === 'full' ? 'staffPeriodFull' :
            filterState.staff.period === '1-15' ? 'staffPeriod1' : 'staffPeriod2'
        );
        const period = filterState.staff.period;
        const y = staffYear, m = staffMonth;
        const daysInMonth = new Date(y, m, 0).getDate();
        const dayRange = period==='1-15'?[1,15]: period==='16-31'?[16,daysInMonth]:[1,daysInMonth];
        const staffEmps = employees.filter(e=>['Управляющий','Менеджер','Администратор'].includes(e.role));
        const results = staffEmps.map(emp=>{
            let worked=0, sales=0;
            for(let d=dayRange[0]; d<=dayRange[1]; d++){
                const key = `${emp.id}_${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const rec = worklog[key];
                if(!rec||rec.status!=='working') continue;
                worked++;
                if(emp.role==='Менеджер') sales += rec.daily_sales||0;
            }
            const params = salaryParams[emp.id]||{};
            const rates = {'Менеджер':20000,'Администратор':25000,'Управляющий':50000};
            const normDays = emp.role==='Менеджер'?Math.round(daysInMonth*0.5):(params.norm_days||22);
            const dailyRate = (rates[emp.role]||0)/Math.max(normDays,1);
            let base = dailyRate*worked, bonus=0;
            if(emp.role==='Менеджер'){
                const plan = params.plan_amount||0;
                bonus = sales*((plan>0&&sales>=plan)?7:5)/100;
            } else if(emp.role==='Администратор'){
                const ms = employees.filter(e=>e.role==='Менеджер').reduce((sum,man)=>{
                    for(let d=dayRange[0]; d<=dayRange[1]; d++){ const key=`${man.id}_${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const rec=worklog[key]; if(rec&&rec.status==='working') sum+=rec.daily_sales||0; }
                    return sum;
                },0);
                bonus = ms*0.01;
            } else if(emp.role==='Управляющий'){
                const ms = employees.filter(e=>e.role==='Менеджер').reduce((sum,man)=>{
                    for(let d=dayRange[0]; d<=dayRange[1]; d++){ const key=`${man.id}_${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const rec=worklog[key]; if(rec&&rec.status==='working') sum+=rec.daily_sales||0; }
                    return sum;
                },0);
                bonus = (params.plan_amount>0&&ms>=params.plan_amount)?ms*0.01:0;
            }
            return { emp, worked, base, bonus, total:base+bonus, sales };
        });
        staffResults = results; // сохраняем для экспорта
        document.getElementById('staffKPI').innerHTML = `
            <div class="kpi-card"><span class="kpi-label">Фонд оплаты</span><span class="kpi-value">${results.reduce((s,r)=>s+r.total,0).toLocaleString()} ₽</span></div>
            <div class="kpi-card"><span class="kpi-label">Сотрудников</span><span class="kpi-value">${results.length}</span></div>
            <div class="kpi-card"><span class="kpi-label">Смен</span><span class="kpi-value">${results.reduce((s,r)=>s+r.worked,0)}</span></div>`;
        document.getElementById('staffWidgets').innerHTML = results.map(r=>`
            <div class="widget-card">
                <div class="widget-title">${r.emp.name} (${r.emp.role})</div>
                <div style="display:flex;justify-content:space-between;"><span>Смен:</span><strong>${r.worked}</strong></div>
                <div style="display:flex;justify-content:space-between;"><span>Базовая:</span><strong>${r.base.toFixed(0)} ₽</strong></div>
                <div style="display:flex;justify-content:space-between;"><span>Бонус:</span><strong>${r.bonus.toFixed(0)} ₽</strong></div>
                <div style="display:flex;justify-content:space-between;font-size:1.1rem;margin-top:0.5rem;"><span>Итого:</span><strong style="color:var(--accent);">${r.total.toFixed(0)} ₽</strong></div>
                ${r.emp.role==='Менеджер'?`<div style="display:flex;justify-content:space-between;"><span>Продажи:</span><strong>${r.sales.toLocaleString()} ₽</strong></div>`:''}
            </div>`).join('');
        document.getElementById('staffTableBody').innerHTML = results.map(r=>`<tr><td>${r.emp.name}</td><td>${r.emp.role}</td><td>${r.worked}</td><td>${r.base.toFixed(0)} ₽</td><td>${r.bonus.toFixed(0)} ₽</td><td><strong>${r.total.toFixed(0)} ₽</strong></td></tr>`).join('');
    }

    async function getStaffFundForRange(fromISO, toISO) {
        if (!fromISO || !toISO) return { total: 0, worked: 0 };
        const from = new Date(fromISO), to = new Date(toISO);
        const months = [];
        let cursor = new Date(from.getFullYear(), from.getMonth(), 1);
        while (cursor <= to) { months.push({ year: cursor.getFullYear(), month: cursor.getMonth()+1 }); cursor.setMonth(cursor.getMonth()+1); }
        const staffEmps = employees.filter(e=>['Управляющий','Менеджер','Администратор'].includes(e.role));
        let total = 0, worked = 0;
        for (const {year, month} of months) {
            const start = `${year}-${String(month).padStart(2,'0')}-01`;
            const nextM = month===12?1:month+1, nextY = month===12?year+1:year;
            const end = `${nextY}-${String(nextM).padStart(2,'0')}-01`;
            const [{data: wlData}, {data: spData}] = await Promise.all([
                _supabase.from('worklog').select('*').gte('date', start).lt('date', end),
                _supabase.from('salary_params').select('*').eq('month', `${year}-${String(month).padStart(2,'0')}`)
            ]);
            const wl = {}; (wlData||[]).forEach(r=>{ wl[`${r.emp_id}_${r.date}`] = r; });
            const sp = {}; (spData||[]).forEach(r=>{ sp[r.emp_id] = r; });
            const daysInMonth = new Date(year, month, 0).getDate();
            staffEmps.forEach(emp => {
                let empWorked = 0, sales = 0;
                for (let d=1; d<=daysInMonth; d++) {
                    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    if (dateStr < fromISO || dateStr > toISO) continue;
                    const rec = wl[`${emp.id}_${dateStr}`];
                    if (!rec || rec.status !== 'working') continue;
                    empWorked++; worked++;
                    if (emp.role === 'Менеджер') sales += rec.daily_sales || 0;
                }
                const params = sp[emp.id] || {};
                const rates = {'Менеджер':20000,'Администратор':25000,'Управляющий':50000};
                const normDays = emp.role==='Менеджер' ? Math.round(daysInMonth*0.5) : (params.norm_days || 22);
                const dailyRate = (rates[emp.role]||0) / Math.max(normDays,1);
                let bonus = 0;
                if (emp.role === 'Менеджер') { const plan = params.plan_amount||0; bonus = sales*((plan>0&&sales>=plan)?7:5)/100; }
                total += dailyRate*empWorked + bonus;
            });
        }
        return { total, worked };
    }

    async function renderCompare() {
        persistState();
        const f = filterState.compare;
        if(!f.period1From||!f.period1To||!f.period2From||!f.period2To) {
            document.getElementById('cmpKPI').innerHTML = '<p>Выберите оба периода</p>';
            return;
        }
        const p1 = financeData.filter(r=>r.operation_date>=f.period1From && r.operation_date<=f.period1To);
        const p2 = financeData.filter(r=>r.operation_date>=f.period2From && r.operation_date<=f.period2To);
        const inc1 = p1.filter(r=>['доход','продажа'].some(t=>(r.operation_type||'').toLowerCase().includes(t))).reduce((s,r)=>s+parseFloat(r.amount||0),0);
        const exp1 = p1.filter(r=>['расход','выплата','инкассация','возврат'].some(t=>(r.operation_type||'').toLowerCase().includes(t))).reduce((s,r)=>s+parseFloat(r.amount||0),0);
        const inc2 = p2.filter(r=>['доход','продажа'].some(t=>(r.operation_type||'').toLowerCase().includes(t))).reduce((s,r)=>s+parseFloat(r.amount||0),0);
        const exp2 = p2.filter(r=>['расход','выплата','инкассация','возврат'].some(t=>(r.operation_type||'').toLowerCase().includes(t))).reduce((s,r)=>s+parseFloat(r.amount||0),0);
        const prof1=inc1-exp1, prof2=inc2-exp2;
        const delta = (v1,v2)=>v1===0?(v2>0?'+∞':'0%'):(((v2-v1)/Math.abs(v1)*100).toFixed(1)>0?'+':'')+((v2-v1)/Math.abs(v1)*100).toFixed(1)+'%';
        document.getElementById('cmpKPI').innerHTML = `
            <div class="kpi-card"><span class="kpi-label">Доходы П1 / П2</span><span class="kpi-value">${inc1.toLocaleString()} / ${inc2.toLocaleString()} ₽</span><span>${delta(inc1,inc2)}</span></div>
            <div class="kpi-card"><span class="kpi-label">Расходы П1 / П2</span><span class="kpi-value">${exp1.toLocaleString()} / ${exp2.toLocaleString()} ₽</span><span>${delta(exp1,exp2)}</span></div>
            <div class="kpi-card"><span class="kpi-label">Прибыль П1 / П2</span><span class="kpi-value">${prof1.toLocaleString()} / ${prof2.toLocaleString()} ₽</span><span>${delta(prof1,prof2)}</span></div>
            <div class="kpi-card"><span class="kpi-label">Маржинальность</span><span class="kpi-value">${inc1?((prof1)/inc1*100).toFixed(1):0}% / ${inc2?((prof2)/inc2*100).toFixed(1):0}%</span></div>`;
        const salByPeriod = (per) => salaryData.filter(r=>!r.skipped && r.period===per);
        const s1data = salByPeriod('1-15'), s2data = salByPeriod('16-31');
        const teacherFund1 = s1data.reduce((s,r)=>s+parseFloat(r.amount||0),0);
        const teacherFund2 = s2data.reduce((s,r)=>s+parseFloat(r.amount||0),0);
        const lessons1 = s1data.reduce((s,r)=>s+(r.quantity||0),0), lessons2 = s2data.reduce((s,r)=>s+(r.quantity||0),0);
        const tNames = [...new Set(salaryData.map(d=>d.teacher_name))];
        const teachComp = tNames.map(name=>{
            const s1 = salaryData.filter(r=>r.teacher_name===name).reduce((s,r)=>s+parseFloat(r.amount||0),0);
            return {name, amount:s1};
        }).sort((a,b)=>b.amount-a.amount).slice(0,8);

        const [staffFund1, staffFund2] = await Promise.all([
            getStaffFundForRange(f.period1From, f.period1To),
            getStaffFundForRange(f.period2From, f.period2To)
        ]);

        document.getElementById('cmpWidgets').innerHTML = `
            <div class="widget-card"><div class="widget-title">Топ педагогов (за всё время)</div><ul class="widget-list">${teachComp.map(t=>`<li><span>${t.name}</span><span>${t.amount.toLocaleString()} ₽</span></li>`).join('') || '<li class="empty-message">Нет данных</li>'}</ul></div>
            <div class="widget-card"><div class="widget-title">Педагоги: 1–15 vs 16–31</div><ul class="widget-list">
                <li><span>Фонд ЗП</span><span>${teacherFund1.toLocaleString()} / ${teacherFund2.toLocaleString()} ₽</span></li>
                <li><span>Уроков</span><span>${lessons1} / ${lessons2}</span></li>
                <li><span>Δ фонда</span><span>${delta(teacherFund1,teacherFund2)}</span></li>
            </ul><p style="font-size:12px;color:var(--text-tertiary);margin-top:8px;">Сравнение по половинам месяца, не по датам П1/П2 — в данных педагогов пока нет календарных дат.</p></div>
            <div class="widget-card"><div class="widget-title">Менеджмент: П1 vs П2</div><ul class="widget-list">
                <li><span>Фонд ЗП</span><span>${staffFund1.total.toLocaleString(undefined,{maximumFractionDigits:0})} / ${staffFund2.total.toLocaleString(undefined,{maximumFractionDigits:0})} ₽</span></li>
                <li><span>Отработано смен</span><span>${staffFund1.worked} / ${staffFund2.worked}</span></li>
                <li><span>Δ фонда</span><span>${delta(staffFund1.total,staffFund2.total)}</span></li>
            </ul></div>
            <div class="widget-card"><div class="widget-title">Сводка</div><ul class="widget-list">
                <li><span>Период 1:</span><span>${f.period1From} – ${f.period1To}</span></li>
                <li><span>Период 2:</span><span>${f.period2From} – ${f.period2To}</span></li>
                <li><span>Доходы Δ:</span><span>${delta(inc1,inc2)}</span></li>
                <li><span>Расходы Δ:</span><span>${delta(exp1,exp2)}</span></li>
                <li><span>Прибыль Δ:</span><span>${delta(prof1,prof2)}</span></li>
            </ul></div>`;
    }

    document.getElementById('homeSidebarBtn').addEventListener('click', ()=>{ window.location.href='index.html'; });
    document.getElementById('logoutSidebarBtn').addEventListener('click', async ()=>{
        try { await _supabase.auth.signOut(); } catch(e) {}
        window.location.href='login.html';
    });
    document.getElementById('showAllWidgetsBtn').addEventListener('click', ()=>{
        document.querySelectorAll('.widget-card').forEach(w=>w.classList.remove('hidden'));
    });
    document.getElementById('resetFiltersGlobalBtn').addEventListener('click', ()=>{
        if (activeTab === 'finance') {
            filterState.finance = { dateFrom:'', dateTo:'', type:'', cat:'', man:'', acc:'', payType:'', showRaw:false };
            const now = new Date();
            filterState.finance.dateFrom = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
            const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
            filterState.finance.dateTo = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
            renderFinance();
        } else if (activeTab === 'salary') {
            filterState.salary = { name:'', subj:'', showSkipped:false, period:'full' };
            renderSalary();
        } else if (activeTab === 'staff') {
            filterState.staff = { period:'full' };
            renderStaff();
        }
    });

    init();
})();
</script>
</body>
</html>
