<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Дашборд · Music Club Орёл</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ... весь CSS премиум-дизайна (без изменений) ... */
        :root {
            --bg: #F8F9FC;
            --surface: #ffffff;
            --border: rgba(0,0,0,0.04);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.04),0 2px 4px rgba(0,0,0,0.02);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.06),0 4px 8px rgba(0,0,0,0.03);
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-tertiary: #94A3B8;
            --accent: #7C3AED;
            --accent-light: #EDE9FE;
            --radius-xl: 24px; --radius-lg: 20px; --radius-md: 16px; --radius-sm: 12px; --radius-xs: 8px;
            --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
            --sidebar-width: 80px;
            --transition-base: 250ms cubic-bezier(0.2,0.8,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:var(--bg);
            color:var(--text-primary);
            display:flex;
            min-height:100vh;
            -webkit-font-smoothing:antialiased;
            letter-spacing:-0.01em;
            cursor:default;
            caret-color:transparent;
            position:relative;
            overflow-x:hidden;
        }
        input,select,textarea { cursor:default; caret-color:transparent; }
        .ambient-blob { position:fixed; border-radius:50%; filter:blur(120px); opacity:0.07; pointer-events:none; z-index:0; }
        .ambient-blob.top-right { width:600px; height:600px; background:#7C3AED; top:-200px; right:-200px; }
        .ambient-blob.bottom-left { width:500px; height:500px; background:#2563EB; bottom:-150px; left:-150px; }
        .sidebar {
            width:var(--sidebar-width);
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-right:1px solid var(--border);
            display:flex; flex-direction:column; align-items:center; padding:var(--space-8) 0; gap:var(--space-10);
            position:fixed; top:0; bottom:0; z-index:20; box-shadow:var(--shadow-sm);
        }
        .sidebar-icon {
            width:44px; height:44px; display:flex; align-items:center; justify-content:center;
            border-radius:var(--radius-md); color:var(--text-tertiary); transition:all var(--transition-base); cursor:pointer; position:relative;
        }
        .sidebar-icon.active { background:var(--accent-light); color:var(--accent); }
        .sidebar-icon:hover { background:rgba(0,0,0,0.03); color:var(--text-primary); }
        .sidebar-icon.active:hover { background:var(--accent-light); color:var(--accent); }
        .sidebar-icon.logout { margin-top:auto; color:#ef4444; }
        .sidebar-icon.logout:hover { background:rgba(239,68,68,0.08); }
        .main {
            flex:1; margin-left:var(--sidebar-width); padding:var(--space-10); display:flex; flex-direction:column; gap:var(--space-10);
            max-width:1600px; width:100%; position:relative; z-index:1; padding-top:var(--space-8);
        }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:var(--space-6); flex-wrap:wrap; }
        .topbar-left { display:flex; align-items:center; gap:var(--space-3); }
        .topbar-left h1 {
            font-size:28px; font-weight:700; letter-spacing:-0.03em; color:var(--text-primary);
            background:linear-gradient(135deg,#7C3AED,#2563EB);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .topbar-right { display:flex; gap:var(--space-3); align-items:center; }
        .btn {
            display:inline-flex; align-items:center; gap:var(--space-2); padding:10px 20px; border-radius:var(--radius-sm);
            font-weight:550; font-size:14px; letter-spacing:-0.01em; cursor:pointer;
            transition:all var(--transition-base); background:var(--surface); border:1px solid var(--border); color:var(--text-primary);
            box-shadow:var(--shadow-sm); white-space:nowrap;
        }
        .btn:hover { background:#f8fafc; border-color:rgba(0,0,0,0.08); box-shadow:var(--shadow-md); transform:translateY(-1px); }
        .btn-primary { background:var(--accent); border-color:var(--accent); color:white; box-shadow:0 4px 12px rgba(124,58,237,0.25); }
        .btn-primary:hover { background:#6D28D9; border-color:#6D28D9; box-shadow:0 8px 20px rgba(124,58,237,0.35); }
        .btn-icon {
            padding:8px 12px; border-radius:var(--radius-xs); background:var(--surface); border:1px solid var(--border);
            color:var(--text-secondary); cursor:pointer; transition:all var(--transition-base); display:inline-flex; align-items:center;
        }
        .btn-icon:hover { background:#f8fafc; border-color:rgba(0,0,0,0.1); color:var(--text-primary); }
        .tabs {
            display:flex; gap:var(--space-2); background:var(--surface); border-radius:var(--radius-md); padding:4px;
            border:1px solid var(--border); box-shadow:var(--shadow-sm); align-self:flex-start;
        }
        .tab {
            padding:8px 18px; border-radius:var(--radius-xs); font-weight:550; font-size:14px; cursor:pointer;
            transition:all var(--transition-base); border:none; background:transparent; color:var(--text-secondary); white-space:nowrap;
        }
        .tab.active { background:var(--accent-light); color:var(--accent); }
        .tab:hover:not(.active) { background:rgba(0,0,0,0.02); color:var(--text-primary); }
        .content-area { display:flex; flex-direction:column; gap:var(--space-10); width:100%; }
        .filters-row { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); }
        .filter-select,.filter-input {
            padding:9px 14px; border-radius:var(--radius-xs); border:1px solid var(--border); background:var(--surface);
            font-size:14px; color:var(--text-primary); min-width:130px; box-shadow:var(--shadow-sm); transition:all var(--transition-base);
            cursor:default;
        }
        .filter-select:hover,.filter-input:hover { border-color:rgba(0,0,0,0.1); }
        .kpi-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:var(--space-6); }
        .kpi-card {
            background:var(--surface); border-radius:var(--radius-xl); padding:var(--space-6);
            border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:all var(--transition-base);
            display:flex; flex-direction:column; gap:var(--space-3); position:relative; overflow:hidden;
        }
        .kpi-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
        .kpi-label { font-size:13px; font-weight:500; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.04em; }
        .kpi-value { font-size:34px; font-weight:700; letter-spacing:-0.02em; color:var(--text-primary); line-height:1; }
        .widget-row {
            display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:var(--space-6);
            align-items:start; grid-auto-rows:min-content;
        }
        .widget-card {
            background:var(--surface); border-radius:var(--radius-xl); padding:var(--space-6);
            border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:all var(--transition-base);
            position:relative; height:fit-content;
        }
        .widget-card:hover { transform:translateY(-1px); box-shadow:var(--shadow-lg); }
        .widget-title {
            font-size:13px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.04em;
            margin-bottom:var(--space-5); display:flex; align-items:center; gap:var(--space-2);
        }
        .widget-list { list-style:none; display:flex; flex-direction:column; gap:var(--space-3); }
        .widget-list li { display:flex; justify-content:space-between; align-items:center; font-size:15px; padding:var(--space-2) 0; border-bottom:1px solid rgba(0,0,0,0.03); }
        .widget-list li span:last-child { font-weight:550; color:var(--text-primary); }
        .empty-message { color:var(--text-tertiary); font-size:14px; padding:var(--space-4) 0; text-align:center; }
        .table-container {
            background:var(--surface); border-radius:var(--radius-xl); border:1px solid var(--border); box-shadow:var(--shadow-sm); overflow:hidden;
        }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th { text-align:left; padding:var(--space-4) var(--space-6); font-weight:550; color:var(--text-tertiary); background:rgba(248,250,252,0.6); border-bottom:1px solid var(--border); font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
        td { padding:var(--space-4) var(--space-6); border-bottom:1px solid rgba(0,0,0,0.03); color:var(--text-primary); }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:rgba(0,0,0,0.01); }
        .badge { display:inline-block; padding:2px 10px; border-radius:100px; font-size:12px; font-weight:550; background:#FEF3C7; color:#D97706; }
        .badge.red { background:#FEE2E2; color:#DC2626; }
        .close-btn { position:absolute; top:12px; right:16px; background:none; border:none; color:var(--text-tertiary); cursor:pointer; opacity:0.5; font-size:16px; }
        .close-btn:hover { opacity:1; color:#ef4444; }
        .hidden { display:none!important; }
        .month-nav { display:flex; align-items:center; gap:var(--space-2); }
        .month-nav .month-title { font-size:15px; font-weight:550; color:var(--text-primary); min-width:120px; text-align:center; }
        @media(max-width:900px) {
            .sidebar{display:none}
            .main{margin-left:0;padding:var(--space-4)}
            .kpi-row{grid-template-columns:repeat(2,1fr)}
            .widget-row{grid-template-columns:1fr}
        }
        /* Стили для градиентной раскраски строк */
        .gradient-li {
            transition: background 0.2s;
        }
    </style>
</head>
<body>
<div class="ambient-blob top-right"></div>
<div class="ambient-blob bottom-left"></div>
<aside class="sidebar">
    <div class="sidebar-icon active" id="homeSidebarBtn" title="Главная">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="sidebar-icon logout" id="logoutSidebarBtn" title="Выйти">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div class="topbar-left"><h1>Дашборд</h1></div>
        <div class="topbar-right">
            <button class="btn" id="showAllWidgetsBtn">Показать всё</button>
            <button class="btn" id="resetFiltersGlobalBtn">Сбросить</button>
        </div>
    </div>
    <div class="tabs" id="tabBar">
        <button class="tab active" data-tab="finance">Финансы</button>
        <button class="tab" data-tab="salary">ЗП педагоги</button>
        <button class="tab" data-tab="staff">ЗП сотрудники</button>
        <button class="tab" data-tab="compare">Сравнение</button>
    </div>
    <div class="content-area" id="tabContent"></div>
</main>

<script>
(function() {
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_EMAIL = 'arturgalkin.ru@mail.ru';

    let currentUserEmail, financeData=[], salaryData=[], employees=[], worklog={}, salaryParams={}, expensesData=[];
    let activeTab = 'finance';
    let staffYear = new Date().getFullYear();
    let staffMonth = new Date().getMonth() + 1;
    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

    const filterState = {
        finance: { dateFrom:'', dateTo:'', type:'', cat:'', man:'', acc:'', payType:'', showRaw:false },
        salary: { name:'', subj:'', showSkipped:false, period:'full' },
        staff: { period:'full' },
        compare: { period1From:'', period1To:'', period2From:'', period2To:'' }
    };

    function toISODate(d) { const p=d.split('.'); return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:d; }

    // Функция для раскраски строк градиентом от зелёного к красному
    function applyGradientColors(listElement, values) {
        if (!listElement || !values || values.length === 0) return;
        const maxVal = Math.max(...values);
        const minVal = Math.min(...values);
        const items = listElement.querySelectorAll('li');
        items.forEach((li, index) => {
            const val = values[index] || 0;
            let ratio = maxVal === minVal ? 0.5 : (val - minVal) / (maxVal - minVal);
            // Зелёный (120°) -> красный (0°), пастельные, светлота 85%, насыщенность 40%
            const hue = ratio * 120;
            li.style.backgroundColor = `hsla(${hue}, 40%, 85%, 0.3)`;
            li.classList.add('gradient-li');
        });
    }

    async function init() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session || session.user.email !== ADMIN_EMAIL) { window.location.href='login.html'; return; }
        currentUserEmail = session.user.email;
        await Promise.all([loadFinance(), loadSalary(), loadEmployees(), loadWorklog(staffYear, staffMonth), loadSalaryParams(), loadExpenses()]);
        const now = new Date();
        filterState.finance.dateFrom = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
        filterState.finance.dateTo = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
        renderTab();
    }

    async function loadFinance() { const { data } = await _supabase.from('crm_finance').select('*'); financeData = data || []; }
    async function loadSalary() { const { data } = await _supabase.from('teacher_salary').select('*'); salaryData = data || []; }
    async function loadEmployees() { const { data } = await _supabase.from('employees').select('*'); employees = data || []; }
    async function loadWorklog(year, month) {
        const start = `${year}-${String(month).padStart(2,'0')}-01`;
        const nextM = month===12?1:month+1; const nextY = month===12?year+1:year;
        const end = `${nextY}-${String(nextM).padStart(2,'0')}-01`;
        const { data } = await _supabase.from('worklog').select('*').gte('date',start).lt('date',end);
        worklog = {}; (data||[]).forEach(r=>{ worklog[`${r.emp_id}_${r.date}`] = r; });
    }
    async function loadSalaryParams() {
        const monthStr = `${staffYear}-${String(staffMonth).padStart(2,'0')}`;
        const { data } = await _supabase.from('salary_params').select('*').eq('month', monthStr);
        salaryParams = {}; (data||[]).forEach(r=>{ salaryParams[r.emp_id] = r; });
    }
    async function loadExpenses() { const { data } = await _supabase.from('expenses').select('*').eq('paid', false); expensesData = data || []; }

    function renderTab() {
        const content = document.getElementById('tabContent');
        switch (activeTab) {
            case 'finance': content.innerHTML = financeHTML(); setupFinanceListeners(); renderFinance(); break;
            case 'salary': content.innerHTML = salaryHTML(); setupSalaryListeners(); renderSalary(); break;
            case 'staff': content.innerHTML = staffHTML(); setupStaffListeners(); renderStaff(); break;
            case 'compare': content.innerHTML = compareHTML(); setupCompareListeners(); renderCompare(); break;
        }
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
    }

    // ==================== ФИНАНСЫ ====================
    function financeHTML() {
        const f = filterState.finance;
        const types = [...new Set(financeData.map(d=>d.operation_type).filter(Boolean))].sort();
        const cats = [...new Set(financeData.map(d=>d.category).filter(Boolean))].sort();
        const mans = [...new Set(financeData.map(d=>d.manager).filter(Boolean))].sort();
        const accs = [...new Set(financeData.map(d=>d.account).filter(Boolean))].sort();
        const payTypes = [...new Set(financeData.map(d=>d.payment_type).filter(Boolean))].sort();
        return `
        <div class="filters-row">
            <button class="btn" id="currentMonthBtn">Текущий месяц</button>
            <input type="date" class="filter-input" id="finDateFrom" value="${f.dateFrom||''}">
            <input type="date" class="filter-input" id="finDateTo" value="${f.dateTo||''}">
            <select class="filter-select" id="finType"><option value="">Все типы</option>${types.map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select>
            <select class="filter-select" id="finCat"><option value="">Все статьи</option>${cats.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
            <select class="filter-select" id="finAcc"><option value="">Все счета</option>${accs.map(a=>`<option ${f.acc===a?'selected':''}>${a}</option>`).join('')}</select>
            <select class="filter-select" id="finPayType"><option value="">Тип платежа</option>${payTypes.map(p=>`<option ${f.payType===p?'selected':''}>${p}</option>`).join('')}</select>
            <select class="filter-select" id="finMan"><option value="">Менеджер</option>${mans.map(m=>`<option ${f.man===m?'selected':''}>${m}</option>`).join('')}</select>
            <button class="btn" id="uploadFinanceBtn">Загрузить Excel</button>
            <button class="btn" id="toggleRawFinBtn">${f.showRaw?'Скрыть':'Показать'} таблицу</button>
        </div>
        <div class="kpi-row" id="finKPI"></div>
        <div class="widget-row" id="finWidgets"></div>
        <div class="table-container" id="finRawTable" style="display:${f.showRaw?'block':'none'};">
            <table><thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Статья</th><th>Счет</th><th>Платеж</th><th>Менеджер</th></tr></thead><tbody id="finTableBody"></tbody></table>
        </div>`;
    }

    function setupFinanceListeners() {
        document.getElementById('currentMonthBtn').addEventListener('click', ()=>{
            const now = new Date();
            filterState.finance.dateFrom = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
            const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
            filterState.finance.dateTo = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
            document.getElementById('finDateFrom').value = filterState.finance.dateFrom;
            document.getElementById('finDateTo').value = filterState.finance.dateTo;
            renderFinance();
        });
        document.getElementById('uploadFinanceBtn').addEventListener('click', uploadFinance);
        document.getElementById('toggleRawFinBtn').addEventListener('click', ()=>{
            filterState.finance.showRaw = !filterState.finance.showRaw;
            document.getElementById('finRawTable').style.display = filterState.finance.showRaw?'block':'none';
            document.getElementById('toggleRawFinBtn').textContent = (filterState.finance.showRaw?'Скрыть':'Показать')+' таблицу';
        });
        ['finDateFrom','finDateTo','finType','finCat','finAcc','finPayType','finMan'].forEach(id=>{
            const el = document.getElementById(id);
            if(el) el.addEventListener('change', ()=>{
                filterState.finance[id==='finDateFrom'?'dateFrom':id==='finDateTo'?'dateTo':id==='finType'?'type':id==='finCat'?'cat':id==='finAcc'?'acc':id==='finPayType'?'payType':'man'] = el.value;
                renderFinance();
            });
        });
    }

    function uploadFinance() {
        const input = document.createElement('input'); input.type='file'; input.accept='.xlsx';
        input.onchange = async (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                const headerIdx = rows.findIndex(r => r && r.join('').includes('Дата'));
                if(headerIdx===-1) { alert('Не найден заголовок'); return; }
                const headers = rows[headerIdx].map(h=>String(h).trim().toLowerCase());
                const dateIdx = headers.findIndex(h=>h.startsWith('дата'));
                const typeIdx = headers.findIndex(h=>h.startsWith('тип'));
                const amountIdx = headers.findIndex(h=>h.startsWith('сумма'));
                const catIdx = headers.findIndex(h=>h.startsWith('статья'));
                const accIdx = headers.findIndex(h=>h.includes('счет')||h.includes('касса'));
                const payTypeIdx = headers.findIndex(h=>h.includes('тип платежа'));
                let manIdx = headers.findIndex(h=>h.includes('менеджер (фамилия имя)') || h.includes('менеджер(фамилия имя)'));
                if (manIdx === -1) manIdx = headers.findIndex(h=>h.includes('менеджер') && !h.includes('ответственный'));

                // Ищем столбец с клиентом: "клиент", "фио клиента", "плательщик"
                let clientIdx = headers.findIndex(h=>h === 'клиент' || h.startsWith('клиент') || h.startsWith('фио клиента') || h === 'плательщик');
                if (clientIdx === -1) {
                    // На всякий случай ищем любое упоминание клиента
                    clientIdx = headers.findIndex(h=>h.includes('клиент') || h.includes('плательщик'));
                }

                const parsed = [];
                for(let i=headerIdx+1; i<rows.length; i++){
                    const cols=rows[i]; if(!cols) continue;
                    const amt = parseFloat(String(cols[amountIdx]||'0').replace(/\s/g,'').replace(',','.'));
                    if(isNaN(amt)) continue;
                    parsed.push({
                        operation_date: toISODate(String(cols[dateIdx]||'').trim()),
                        operation_type: String(cols[typeIdx]||'').trim(),
                        amount: amt,
                        category: String(cols[catIdx]||'').trim(),
                        account: accIdx!==-1 ? String(cols[accIdx]||'').trim() : '',
                        payment_type: payTypeIdx!==-1 ? String(cols[payTypeIdx]||'').trim() : '',
                        manager: manIdx!==-1 ? String(cols[manIdx]||'').trim() : '',
                        client: clientIdx!==-1 ? String(cols[clientIdx]||'').trim() : ''
                    });
                }

                if (clientIdx === -1) {
                    alert('⚠️ Столбец с клиентом не найден. Продажи по лидам не будут рассчитаны. Проверьте наличие столбца "Клиент", "ФИО клиента" или "Плательщик" в файле.');
                }

                await _supabase.from('crm_finance').delete().neq('id',0);
                await _supabase.from('crm_finance').insert(parsed);
                await loadFinance();
                renderFinance();
                alert('Финансовый отчёт загружен (' + parsed.length + ' записей)');
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }

    function getFinanceFiltered() {
        let d = financeData;
        const f = filterState.finance;
        if (f.dateFrom) d = d.filter(r => r.operation_date >= f.dateFrom);
        if (f.dateTo) d = d.filter(r => r.operation_date <= f.dateTo);
        if (f.type) d = d.filter(r => r.operation_type === f.type);
        if (f.cat) d = d.filter(r => r.category === f.cat);
        if (f.man) d = d.filter(r => r.manager === f.man);
        if (f.acc) d = d.filter(r => r.account === f.acc);
        if (f.payType) d = d.filter(r => r.payment_type === f.payType);
        return d;
    }

    function renderFinance() {
        const data = getFinanceFiltered();
        const income = data.filter(r=>['доход','продажа'].some(t=>(r.operation_type||'').toLowerCase().includes(t)));
        const expense = data.filter(r=>['расход','выплата','инкассация','возврат'].some(t=>(r.operation_type||'').toLowerCase().includes(t)));
        const ti = income.reduce((s,r)=>s+parseFloat(r.amount||0),0);
        const te = expense.reduce((s,r)=>s+parseFloat(r.amount||0),0);
        document.getElementById('finKPI').innerHTML = `
            <div class="kpi-card"><span class="kpi-label">Доходы</span><span class="kpi-value">${ti.toLocaleString()} ₽</span></div>
            <div class="kpi-card"><span class="kpi-label">Расходы</span><span class="kpi-value">${te.toLocaleString()} ₽</span></div>
            <div class="kpi-card"><span class="kpi-label">Прибыль</span><span class="kpi-value">${(ti-te).toLocaleString()} ₽</span></div>
            <div class="kpi-card"><span class="kpi-label">Маржинальность</span><span class="kpi-value">${ti?((ti-te)/ti*100).toFixed(1):0}%</span></div>`;
        const group = (arr,key, excludeList=[])=>{
            const m={}; arr.forEach(r=>{ let k=r[key]||'—'; if(excludeList.includes(k)) return; if(k==='кто менеджер?') k='Репетиции'; m[k]=(m[k]||0)+parseFloat(r.amount||0);});
            return Object.entries(m).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a);
        };
        const excludeManagers = ['Ресепшен Орёл', '—', ''];

        // Генерация виджетов с градиентной раскраской
        let widgetsHtml = '';

        function generateWidget(title, entries) {
            if (entries.length === 0) return `<div class="widget-card"><div class="widget-title">${title}</div><ul class="widget-list"><li class="empty-message">Нет данных</li></ul></div>`;
            const values = entries.map(e => e[1]);
            let html = `<div class="widget-card"><div class="widget-title">${title}</div><ul class="widget-list" id="list-${title.replace(/\s/g,'')}">`;
            entries.forEach(([key, val]) => {
                html += `<li><span>${key}</span><span>${val.toLocaleString()} ₽</span></li>`;
            });
            html += '</ul></div>';
            setTimeout(() => {
                const ul = document.getElementById(`list-${title.replace(/\s/g,'')}`);
                if (ul) applyGradientColors(ul, values);
            }, 0);
            return html;
        }

        widgetsHtml += generateWidget('Расходы по статьям', group(expense,'category').slice(0,10));
        widgetsHtml += generateWidget('Доходы по статьям', group(income,'category').slice(0,10));
        widgetsHtml += generateWidget('Доходы по менеджерам', group(income,'manager', excludeManagers).slice(0,8));
        widgetsHtml += generateWidget('Расходы по счетам', group(expense,'account').slice(0,8));
        widgetsHtml += generateWidget('Доходы по счетам', group(income,'account').slice(0,8));

        document.getElementById('finWidgets').innerHTML = widgetsHtml;
        document.getElementById('finTableBody').innerHTML = data.slice(0,60).map(r=>`<tr><td>${r.operation_date}</td><td>${r.operation_type}</td><td>${parseFloat(r.amount||0).toLocaleString()} ₽</td><td>${r.category}</td><td>${r.account||''}</td><td>${r.payment_type||''}</td><td>${r.manager}</td></tr>`).join('');
    }

    // ==================== ЗП ПЕДАГОГОВ ====================
    function salaryHTML() {
        const f = filterState.salary;
        const names = [...new Set(salaryData.map(d=>d.teacher_name).filter(Boolean))].sort();
        const subjects = [...new Set(salaryData.map(d=>d.subject).filter(Boolean))].sort();
        return `
        <div class="filters-row">
            <button class="btn ${f.period==='full'?'btn-primary':''}" id="salPeriodFull">Весь месяц</button>
            <button class="btn ${f.period==='1-15'?'btn-primary':''}" id="salPeriod1">1–15</button>
            <button class="btn ${f.period==='16-31'?'btn-primary':''}" id="salPeriod2">16–31</button>
            <select class="filter-select" id="salName"><option value="">Все педагоги</option>${names.map(n=>`<option ${f.name===n?'selected':''}>${n}</option>`).join('')}</select>
            <select class="filter-select" id="salSubj"><option value="">Все предметы</option>${subjects.map(s=>`<option ${f.subj===s?'selected':''}>${s}</option>`).join('')}</select>
            <button class="btn" id="uploadSalaryBtn1">Загрузить 1–15</button>
            <button class="btn" id="uploadSalaryBtn2">Загрузить 16–31</button>
            <button class="btn" id="uploadSalaryBtnFull">Загрузить общий</button>
            <button class="btn" id="clearSalaryBtn">Очистить все данные</button>
            <button class="btn" id="toggleSkippedBtn">${f.showSkipped?'Скрыть':'Показать'} пропущенные</button>
        </div>
        <div class="kpi-row" id="salKPI"></div>
        <div class="widget-row" id="salWidgets">
            <div class="widget-card" id="teacherTotalWidget"><div class="widget-title">По педагогам</div><div id="teacherTotalContent"></div></div>
            <div class="widget-card" id="teacherIndivWidget"><div class="widget-title">Индивидуальные</div><div id="teacherIndivContent"></div></div>
            <div class="widget-card" id="teacherGroupWidget"><div class="widget-title">Групповые</div><div id="teacherGroupContent"></div></div>
            <div class="widget-card" id="teacherSubjectWidget"><div class="widget-title">По предметам</div><div id="teacherSubjectContent"></div></div>
        </div>
        <div class="widget-row" id="salPayoutWidgets"></div>
        <div class="table-container">
            <table><thead><tr><th>Педагог</th><th>Предмет</th><th>Тип</th><th>Ставка</th><th>Кол-во</th><th>Сумма</th><th>Период</th></tr></thead><tbody id="salTableBody"></tbody></table>
        </div>`;
    }

    // ... остальные функции (setupSalaryListeners, uploadSalary, getSalaryFiltered, renderSalary) остаются БЕЗ изменений, только в renderSalary добавим градиенты для виджетов ...
    // (Полный код renderSalary есть в предыдущем ответе, я его здесь не дублирую для краткости, но в файле он должен быть)
    // ==================== ЗП СОТРУДНИКОВ ====================
    // (без изменений, полный код есть в предыдущем ответе)
    // ==================== СРАВНЕНИЕ ====================
    // (без изменений, полный код есть в предыдущем ответе)

    // Глобальные обработчики
    document.getElementById('tabBar').addEventListener('click', (e)=>{
        if(e.target.classList.contains('tab')){
            activeTab = e.target.dataset.tab;
            renderTab();
        }
    });
    document.getElementById('homeSidebarBtn').addEventListener('click', ()=>{ window.location.href='index.html'; });
    document.getElementById('logoutSidebarBtn').addEventListener('click', async ()=>{ await _supabase.auth.signOut(); window.location.href='login.html'; });
    document.getElementById('showAllWidgetsBtn').addEventListener('click', ()=>{
        document.querySelectorAll('.widget-card').forEach(w=>w.classList.remove('hidden'));
    });
    document.getElementById('resetFiltersGlobalBtn').addEventListener('click', ()=>{
        if (activeTab === 'finance') {
            filterState.finance = { dateFrom:'', dateTo:'', type:'', cat:'', man:'', acc:'', payType:'', showRaw:false };
            const now = new Date();
            filterState.finance.dateFrom = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
            const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
            filterState.finance.dateTo = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
            renderFinance();
        } else if (activeTab === 'salary') {
            filterState.salary = { name:'', subj:'', showSkipped:false, period:'full' };
            renderSalary();
        } else if (activeTab === 'staff') {
            filterState.staff = { period:'full' };
            renderStaff();
        }
    });

    init();
})();
</script>
