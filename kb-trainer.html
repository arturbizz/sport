<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Схема скрипта — База Знаний</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --ink: #0f172a;
      --ink-2: #475569;
      
      --primary: #10b981; /* Изумрудный */
      --primary-soft: #ecfdf5;
      --primary-border: #34d399;
      
      --accent: #f59e0b; /* Желтый */
      --accent-soft: #fffbeb;
      --accent-border: #fbbf24;
      
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --danger-border: #f87171;
      
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #60a5fa;

      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
      
      --font: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg-main);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ===== ШАПКА ===== */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; color: var(--ink); }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; }
    .logo-icon svg { width: 20px; height: 20px; }
    
    .btn-back {
      background: var(--bg-main);
      color: var(--ink-2);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-back:hover { background: #e2e8f0; color: var(--ink); }

    /* ===== КОНТЕЙНЕР СХЕМЫ ===== */
    .schema-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 100px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .schema-title {
      text-align: center;
      margin-bottom: 40px;
    }
    .schema-title h1 { font-size: 32px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.02em; }
    .schema-title p { color: var(--ink-2); font-size: 16px; }

    /* ===== БЛОКИ СХЕМЫ ===== */
    .flow-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: relative;
      animation: fadeIn 0.5s ease backwards;
    }

    /* Линия соединитель */
    .flow-line {
      width: 3px;
      height: 32px;
      background: var(--border);
      position: relative;
    }
    .flow-line::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: -4px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 6px solid var(--border);
    }

    /* Карточка шага */
    .flow-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 700px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
      position: relative;
    }
    
    /* Типы карточек */
    .flow-card.start { border-color: var(--primary); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.1); }
    .flow-card.action { border-color: var(--blue); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.1); }
    .flow-card.erp { border-color: var(--accent); background: var(--accent-soft); border-style: dashed; }
    .flow-card.stop { border-color: var(--danger); background: var(--danger-soft); }
    .flow-card.end { border-color: var(--primary); background: var(--primary-soft); }

    /* Шапка карточки */
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-badge.start { background: var(--primary); color: white; }
    .card-badge.action { background: var(--blue); color: white; }
    .card-badge.erp { background: var(--accent); color: white; }
    .card-badge.stop { background: var(--danger); color: white; }
    .card-badge.end { background: var(--primary); color: white; }
    
    .card-step-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 15px;
      color: var(--ink-2);
      line-height: 1.6;
    }
    .card-desc strong { color: var(--ink); }

    /* Ветвления (Опции) */
    .branches {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .branch-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--bg-main);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--ink-2);
    }
    .branch-icon {
      color: var(--blue);
      font-weight: 900;
      flex-shrink: 0;
    }
    .branch-text strong { color: var(--ink); }
    
    /* Специфичные цвета для веток */
    .branch-item.good { background: rgba(16, 185, 129, 0.05); }
    .branch-item.good .branch-icon { color: var(--primary); }
    .branch-item.bad { background: rgba(239, 68, 68, 0.05); }
    .branch-item.bad .branch-icon { color: var(--danger); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Адаптив */
    @media (max-width: 600px) {
      .flow-card { padding: 16px; }
      .header { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      Скрипт-Схема
    </div>
    <a href="knowledge-base.html" class="btn-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      В Базу Знаний
    </a>
  </header>

  <div class="schema-container">
    <div class="schema-title">
      <h1>Универсальный скрипт приема звонка</h1>
      <p>Визуальная схема алгоритма работы оператора от приветствия до завершения</p>
    </div>

    <!-- Сюда будет рендериться схема -->
    <div id="flowchart" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>

  </div>

  <script>
    // =====================================================================
    // ДАННЫЕ СХЕМЫ (ЛЕГКО РЕДАКТИРОВАТЬ И ДОПОЛНЯТЬ)
    // =====================================================================
    // type: 'start' | 'action' | 'erp' | 'stop' | 'end'
    
    const scriptData = [
      {
        type: 'start',
        step: 'Шаг 1',
        title: 'Приветствие',
        desc: 'Жестких рамок нет. Главное — сразу захватить инициативу. Пример: <strong>«Здравствуйте, что починить?»</strong>'
      },
      {
        type: 'action',
        step: 'Шаг 2',
        title: 'Уточнение имени',
        desc: 'Обязательно узнаем имя, чтобы обращаться к клиенту в течение всего диалога. Пример: <strong>«Как я могу к вам обращаться?»</strong>'
      },
      {
        type: 'action',
        step: 'Шаг 3',
        title: 'Выявление проблемы',
        desc: 'Если проблема ясна — не задаем лишних вопросов. Если непонятно — уточняем детали.',
        branches: [
          { icon: '✓', class: 'good', text: '<strong>Понятно:</strong> «Нет изображения» → Переходим к ТО.' },
          { icon: '?', class: '', text: '<strong>Непонятно:</strong> «Включается, но не показывает» → Уточняем: «Есть ли звук?»' }
        ]
      },
      {
        type: 'action',
        step: 'Шаг 4',
        title: 'Определение ТО (Тип Оборудования)',
        desc: 'Для ТВ нужна диагональ и тип (ЖК, плазма). Для принтеров — строго марка и модель.',
        branches: [
          { icon: '✓', class: 'good', text: '<strong>ЖК 43 дюйма:</strong> ТО 25. Идем дальше.' },
          { icon: '✗', class: 'bad', text: '<strong>Кинескоп (ЭЛТ):</strong> Стоп-фактор. Переходим к продаже нового.' }
        ]
      },
      {
        type: 'action',
        step: 'Шаг 5',
        title: 'Город и локация',
        desc: 'Уточняем ДО озвучки цен. Вопрос должен звучать прямо: <strong>«Вы в Москве в пределах МКАД или за МКАД?»</strong>'
      },
      {
        type: 'erp',
        step: 'Шаг 6',
        title: 'Внесение ТО в ERP',
        desc: 'Выбираем правильный код ТО в поле <strong>«Тип оборуд.»</strong>. Это критически важно для корректной работы ЛК.'
      },
      {
        type: 'action',
        step: 'Шаг 7',
        title: 'Проверка на Стоп-факторы',
        desc: 'Сверяемся с ЛК. Если есть стоп (дальность, разбитая матрица) — отрабатываем возражение или закрываем в стоп.',
        branches: [
          { icon: '✓', class: 'good', text: '<strong>Стопов нет:</strong> Согласовываем адрес и время.' },
          { icon: '✗', class: 'bad', text: '<strong>Есть стоп:</strong> Закрываем подтипом «Стоп-фактор».' }
        ]
      },
      {
        type: 'action',
        step: 'Шаг 8',
        title: 'Адрес и время',
        desc: 'Записываем полный адрес в ERP. Согласовываем дату и интервал выезда мастера.'
      },
      {
        type: 'end',
        step: 'Шаг 9',
        title: 'Завершение диалога',
        desc: 'Обязательная озвучка: <strong>«Не трогайте технику до приезда мастера. Хорошего дня, до свидания!»</strong>'
      }
    ];

    // =====================================================================
    // ЛОГИКА ОТРИСОВКИ СХЕМЫ
    // =====================================================================
    
    const container = document.getElementById('flowchart');

    function renderFlowchart(data) {
      container.innerHTML = '';
      
      data.forEach((item, index) => {
        // Создаем обертку шага
        const stepEl = document.createElement('div');
        stepEl.className = 'flow-step';
        
        // Добавляем анимацию с задержкой
        stepEl.style.animationDelay = `${index * 0.1}s`;

        // Отрисовываем соединительную линию (если это не первый элемент)
        if (index > 0) {
          const line = document.createElement('div');
          line.className = 'flow-line';
          stepEl.appendChild(line);
        }

        // Создаем карточку
        const card = document.createElement('div');
        card.className = `flow-card ${item.type}`;

        // Шапка карточки (номер шага и бейдж)
        let badgeText = 'Действие';
        if (item.type === 'start') badgeText = 'Начало';
        if (item.type === 'erp') badgeText = 'ERP';
        if (item.type === 'stop') badgeText = 'Стоп-фактор';
        if (item.type === 'end') badgeText = 'Финал';

        let html = `
          <div class="card-header">
            <span class="card-step-num">${item.step}</span>
            <span class="card-badge ${item.type}">${badgeText}</span>
          </div>
          <div class="card-title">${item.title}</div>
          <div class="card-desc">${item.desc}</div>
        `;

        // Если есть ветвления — отрисовываем их
        if (item.branches && item.branches.length > 0) {
          html += `<div class="branches">`;
          item.branches.forEach(b => {
            html += `
              <div class="branch-item ${b.class}">
                <span class="branch-icon">${b.icon}</span>
              </div>
            `;
            // Вставляем текст ветки, обрабатывая HTML
            const branchTextEl = html.lastIndexOf('</div>');
            html = html.slice(0, branchTextEl) + `<span class="branch-text">${b.text}</span>` + html.slice(branchTextEl);
          });
          html += `</div>`;
        }

        card.innerHTML = html;
        stepEl.appendChild(card);
        container.appendChild(stepEl);
      });
    }

    // Запуск отрисовки
    renderFlowchart(scriptData);

  </script>
</body>
</html>
