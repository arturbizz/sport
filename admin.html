<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Мониторинг — Music Club Орёл</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: rgba(15,23,42,0.06);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --accent: #4f46e5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03);
      --radius-xl: 24px;
      --radius-md: 16px;
      --space-6: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .back-link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
    .section {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }
    .section h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.6rem;
      text-align: left;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      font-size: 0.85rem;
    }
    th {
      background: rgba(248,250,252,0.5);
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.75rem;
    }
    tr:hover td { background: rgba(0,0,0,0.01); }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge.insert { background: #d1fae5; color: #065f46; }
    .badge.update { background: #fef3c7; color: #92400e; }
    .badge.delete { background: #fee2e2; color: #991b1b; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-xl);
      padding: 2rem;
      max-width: 400px; width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(255,255,255,0.5) inset;
      animation: slideUp 0.25s ease-out;
      text-align: center;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); }
    }
    .modal p { margin-bottom: 1.5rem; font-size: 16px; }
    .modal .btn { margin: 0 4px; }
    .btn {
      padding: 0.45rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
    .btn:hover { background: #f8fafc; }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-primary:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-link">← На главную</a>
      <h1>Мониторинг</h1>
    </div>

    <div class="section">
      <h2>Зарегистрированные пользователи</h2>
      <table>
        <thead><tr><th>Email</th><th>Зарегистрирован</th><th>Последний вход</th></tr></thead>
        <tbody id="usersBody"><tr><td colspan="3">Загрузка...</td></tr></tbody>
      </table>
    </div>

    <div class="section">
      <h2>Последние действия</h2>
      <table>
        <thead><tr><th>Время</th><th>Пользователь</th><th>Таблица</th><th>Действие</th><th>Детали</th></tr></thead>
        <tbody id="logsBody"><tr><td colspan="5">Загрузка...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="alertModal" style="display:none;">
    <div class="modal">
      <p id="alertMessage"></p>
      <button class="btn btn-primary" id="alertOkBtn">OK</button>
    </div>
  </div>

  <script>
    (function() {
      const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
      const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      function customAlert(msg) {
        document.getElementById('alertMessage').textContent = msg;
        document.getElementById('alertModal').style.display = 'flex';
        document.getElementById('alertOkBtn').onclick = () => {
          document.getElementById('alertModal').style.display = 'none';
        };
      }

      async function checkAccess(requiredSection) {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return false; }
        const userEmail = session.user.email;
        if (userEmail === 'arturgalkin.ru@mail.ru') return true;
        const { data: emp } = await _supabase.from('employees').select('id').eq('email', userEmail).single();
        if (!emp) { window.location.href = 'index.html'; return false; }
        const { data: perm } = await _supabase.from('employee_permissions').select('*').eq('employee_id', emp.id).eq('section', requiredSection).single();
        if (!perm) { window.location.href = 'index.html'; return false; }
        return true;
      }

      async function init() {
        if (!await checkAccess('admin')) return;
        await loadUsers();
        await loadLogs();
      }

      async function loadUsers() {
        const { data } = await _supabase.from('audit_log').select('changed_by').order('changed_at', { ascending: false }).limit(100);
        const emails = [...new Set(data.map(d => d.changed_by).filter(Boolean))];
        document.getElementById('usersBody').innerHTML = emails.map(email => `
          <tr><td>${email}</td><td>—</td><td>—</td></tr>
        `).join('') || '<tr><td colspan="3">Нет данных</td></tr>';
      }

      async function loadLogs() {
        const { data } = await _supabase.from('audit_log').select('*').order('changed_at', { ascending: false }).limit(50);
        if (!data || data.length === 0) {
          document.getElementById('logsBody').innerHTML = '<tr><td colspan="5">Нет записей</td></tr>';
          return;
        }
        const actionLabels = { INSERT: 'Создание', UPDATE: 'Изменение', DELETE: 'Удаление' };
        document.getElementById('logsBody').innerHTML = data.map(log => {
          const date = new Date(log.changed_at).toLocaleString('ru-RU');
          const action = actionLabels[log.action] || log.action;
          let details = '';
          if (log.action === 'INSERT') details = JSON.stringify(log.new_data).substring(0, 80);
          else if (log.action === 'UPDATE') details = `изм. ${log.record_id}`;
          else if (log.action === 'DELETE') details = `удал. ${log.record_id}`;
          return `<tr>
            <td>${date}</td>
            <td>${log.changed_by || '—'}</td>
            <td>${log.table_name}</td>
            <td><span class="badge ${log.action.toLowerCase()}">${action}</span></td>
            <td>${details}</td>
          </tr>`;
        }).join('');
      }

      init();
    })();
  </script>
</body>
</html>
