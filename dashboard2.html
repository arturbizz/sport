<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Лиды · Music Club Орёл</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8F9FC;
            --surface: #ffffff;
            --border: rgba(0,0,0,0.04);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.04),0 2px 4px rgba(0,0,0,0.02);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.06),0 4px 8px rgba(0,0,0,0.03);
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-tertiary: #94A3B8;
            --accent: #7C3AED;
            --accent-light: #EDE9FE;
            --radius-xl: 24px; --radius-lg: 20px; --radius-md: 16px; --radius-sm: 12px; --radius-xs: 8px;
            --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
            --sidebar-width: 80px;
            --transition-base: 250ms cubic-bezier(0.2,0.8,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:var(--bg);
            color:var(--text-primary);
            display:flex;
            min-height:100vh;
            -webkit-font-smoothing:antialiased;
            letter-spacing:-0.01em;
            cursor:default;
            caret-color:transparent;
            position:relative;
            overflow-x:hidden;
        }
        input,select,textarea { cursor:default; caret-color:transparent; }
        .ambient-blob { position:fixed; border-radius:50%; filter:blur(120px); opacity:0.07; pointer-events:none; z-index:0; }
        .ambient-blob.top-right { width:600px; height:600px; background:#7C3AED; top:-200px; right:-200px; }
        .ambient-blob.bottom-left { width:500px; height:500px; background:#2563EB; bottom:-150px; left:-150px; }
        .sidebar {
            width:var(--sidebar-width);
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-right:1px solid var(--border);
            display:flex; flex-direction:column; align-items:center; padding:var(--space-8) 0; gap:var(--space-10);
            position:fixed; top:0; bottom:0; z-index:20; box-shadow:var(--shadow-sm);
        }
        .sidebar-icon {
            width:44px; height:44px; display:flex; align-items:center; justify-content:center;
            border-radius:var(--radius-md); color:var(--text-tertiary); transition:all var(--transition-base); cursor:pointer; position:relative;
        }
        .sidebar-icon.active { background:var(--accent-light); color:var(--accent); }
        .sidebar-icon:hover { background:rgba(0,0,0,0.03); color:var(--text-primary); }
        .sidebar-icon.active:hover { background:var(--accent-light); color:var(--accent); }
        .sidebar-icon.logout { margin-top:auto; color:#ef4444; }
        .sidebar-icon.logout:hover { background:rgba(239,68,68,0.08); }
        .main {
            flex:1; margin-left:var(--sidebar-width); padding:var(--space-10); display:flex; flex-direction:column; gap:var(--space-10);
            max-width:1600px; width:100%; position:relative; z-index:1; padding-top:var(--space-8);
        }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:var(--space-6); flex-wrap:wrap; }
        .topbar-left { display:flex; align-items:center; gap:var(--space-3); }
        .topbar-left h1 {
            font-size:28px; font-weight:700; letter-spacing:-0.03em; color:var(--text-primary);
            background:linear-gradient(135deg,#7C3AED,#2563EB);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .topbar-right { display:flex; gap:var(--space-3); align-items:center; }
        .btn {
            display:inline-flex; align-items:center; gap:var(--space-2); padding:10px 20px; border-radius:var(--radius-sm);
            font-weight:550; font-size:14px; letter-spacing:-0.01em; cursor:pointer;
            transition:all var(--transition-base); background:var(--surface); border:1px solid var(--border); color:var(--text-primary);
            box-shadow:var(--shadow-sm); white-space:nowrap;
        }
        .btn:hover { background:#f8fafc; border-color:rgba(0,0,0,0.08); box-shadow:var(--shadow-md); transform:translateY(-1px); }
        .btn-primary { background:var(--accent); border-color:var(--accent); color:white; box-shadow:0 4px 12px rgba(124,58,237,0.25); }
        .btn-primary:hover { background:#6D28D9; border-color:#6D28D9; box-shadow:0 8px 20px rgba(124,58,237,0.35); }
        .filters-row { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); }
        .filter-select,.filter-input {
            padding:9px 14px; border-radius:var(--radius-xs); border:1px solid var(--border); background:var(--surface);
            font-size:14px; color:var(--text-primary); min-width:130px; box-shadow:var(--shadow-sm); transition:all var(--transition-base);
            cursor:default;
        }
        .filter-select:hover,.filter-input:hover { border-color:rgba(0,0,0,0.1); }
        .kpi-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:var(--space-6); }
        .kpi-card {
            background:var(--surface); border-radius:var(--radius-xl); padding:var(--space-6);
            border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:all var(--transition-base);
            display:flex; flex-direction:column; gap:var(--space-3); position:relative; overflow:hidden;
        }
        .kpi-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
        .kpi-label { font-size:13px; font-weight:500; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.04em; }
        .kpi-value { font-size:34px; font-weight:700; letter-spacing:-0.02em; color:var(--text-primary); line-height:1; }
        .widget-row {
            display:grid; grid-template-columns:repeat(auto-fit, minmax(400px,1fr)); gap:var(--space-6);
        }
        .widget-card {
            background:var(--surface); border-radius:var(--radius-xl); padding:var(--space-6);
            border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:all var(--transition-base);
            position:relative; height:fit-content;
        }
        .widget-card:hover { transform:translateY(-1px); box-shadow:var(--shadow-lg); }
        .widget-title {
            font-size:13px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.04em;
            margin-bottom:var(--space-5); display:flex; align-items:center; gap:var(--space-2);
        }
        .widget-list { list-style:none; display:flex; flex-direction:column; gap:var(--space-3); }
        .widget-list li { display:flex; justify-content:space-between; align-items:center; font-size:15px; padding:var(--space-2) 0; border-bottom:1px solid rgba(0,0,0,0.03); }
        .widget-list li span:last-child { font-weight:550; color:var(--text-primary); }
        .table-container {
            background:var(--surface); border-radius:var(--radius-xl); border:1px solid var(--border); box-shadow:var(--shadow-sm); overflow:hidden;
        }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th { text-align:left; padding:var(--space-4) var(--space-6); font-weight:550; color:var(--text-tertiary); background:rgba(248,250,252,0.6); border-bottom:1px solid var(--border); font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
        td { padding:var(--space-4) var(--space-6); border-bottom:1px solid rgba(0,0,0,0.03); color:var(--text-primary); }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:rgba(0,0,0,0.01); }
        @media(max-width:900px) {
            .sidebar{display:none}
            .main{margin-left:0;padding:var(--space-4)}
            .kpi-row{grid-template-columns:repeat(2,1fr)}
            .widget-row{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
<div class="ambient-blob top-right"></div>
<div class="ambient-blob bottom-left"></div>
<aside class="sidebar">
    <div class="sidebar-icon active" id="homeSidebarBtn" title="Главная">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="sidebar-icon logout" id="logoutSidebarBtn" title="Выйти">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div class="topbar-left"><h1>Лиды</h1></div>
    </div>
    <div class="filters-row">
        <button class="btn" id="uploadLeadsBtn">Загрузить лиды</button>
    </div>
    <div class="kpi-row" id="leadsKPI"></div>
    <div class="widget-row">
        <div class="widget-card" id="stageWidget"><div class="widget-title">По этапам</div><div id="stageContent"></div></div>
        <div class="widget-card" id="sourceWidget"><div class="widget-title">По источникам</div><div id="sourceContent"></div></div>
    </div>
    <div class="table-container">
        <table><thead><tr><th>Дата</th><th>Имя</th><th>Этап</th><th>Источник</th><th>Статус</th></tr></thead><tbody id="leadsTableBody"></tbody></table>
    </div>
</main>

<script>
(function() {
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_EMAIL = 'arturgalkin.ru@mail.ru';

    let leadsData = [], financeData = [];

    async function init() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session || session.user.email !== ADMIN_EMAIL) { window.location.href='login.html'; return; }
        await Promise.all([loadLeads(), loadFinance()]);
        renderAll();
    }

    async function loadLeads() { const { data } = await _supabase.from('leads').select('*').order('date_added', { ascending: false }); leadsData = data || []; }
    async function loadFinance() { const { data } = await _supabase.from('crm_finance').select('*'); financeData = data || []; }

    function setupLeadsListeners() { document.getElementById('uploadLeadsBtn').addEventListener('click', uploadLeads); }

    async function uploadLeads() {
        const input = document.createElement('input'); input.type='file'; input.accept='.xlsx';
        input.onchange = async (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                const parsed = [];
                const firstRow = rows[0] ? rows[0].join(' ') : '';
                if (firstRow.toLowerCase().includes('новые лиды')) {
                    let dataStartIdx = 0;
                    for (let i = 0; i < rows.length; i++) {
                        const rowStr = rows[i] ? rows[i].join(' ') : '';
                        if (rowStr.toLowerCase().includes('новые лиды')) continue;
                        if (rowStr.toLowerCase().includes('за период')) { dataStartIdx = i + 1; break; }
                    }
                    for (let i = dataStartIdx; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length < 4) continue;
                        const dateStr = String(row[1] || '').trim();
                        const name = String(row[2] || '').trim();
                        const stage = String(row[3] || '').trim();
                        const source = String(row[4] || '').trim();
                        if (!dateStr) continue;
                        const parts = dateStr.split(' ');
                        const datePart = parts[0];
                        const timePart = parts[1] || '00:00';
                        const [day, month, year] = datePart.split('.').map(Number);
                        const [hours, minutes] = timePart.split(':').map(Number);
                        const validDate = new Date(year, month - 1, day, hours || 0, minutes || 0);
                        const isDuplicate = /8\.\s*Дубль/.test(name);
                        const isBadContact = /13\.\s*Некорректные\s*контакты/.test(name);
                        parsed.push({ date_added: validDate.toISOString(), name, stage, source, is_duplicate: isDuplicate, is_bad_contact: isBadContact });
                    }
                } else {
                    const headerIdx = rows.findIndex(r => r && r.some(cell => String(cell).toLowerCase().includes('дата добавления')));
                    if (headerIdx === -1) { alert('Не удалось определить формат файла.'); return; }
                    const headers = rows[headerIdx].map(h => String(h).trim().toLowerCase());
                    const dateIdx = headers.findIndex(h => h.includes('дата добавления'));
                    const nameIdx = headers.findIndex(h => h.includes('наименование'));
                    const stageIdx = headers.findIndex(h => h.includes('этап'));
                    const sourceIdx = headers.findIndex(h => h.includes('источник'));
                    for (let i = headerIdx + 1; i < rows.length; i++) {
                        const row = rows[i]; if (!row || row.length < 2) continue;
                        const name = String(row[nameIdx] || '').trim();
                        const isDuplicate = /8\.\s*Дубль/.test(name);
                        const isBadContact = /13\.\s*Некорректные\s*контакты/.test(name);
                        parsed.push({
                            date_added: row[dateIdx] ? new Date(row[dateIdx]).toISOString() : null,
                            name,
                            stage: String(row[stageIdx] || '').trim(),
                            source: String(row[sourceIdx] || '').trim(),
                            is_duplicate: isDuplicate,
                            is_bad_contact: isBadContact
                        });
                    }
                }
                if (parsed.length === 0) {
                    alert('Файл прочитан, но не найдено ни одной записи. Проверьте столбцы.');
                    return;
                }
                await _supabase.from('leads').delete().neq('id', 0);
                const { error } = await _supabase.from('leads').insert(parsed);
                if (error) {
                    alert('Ошибка при сохранении лидов: ' + error.message);
                    return;
                }
                await loadLeads();
                renderAll();
                alert('Лиды загружены (' + parsed.length + ' записей)');
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }

    function renderAll() {
        const all = leadsData.filter(l => !l.is_duplicate && !l.is_bad_contact); // чистые лиды
        const total = all.length;
        const successStage = all.filter(l => l.stage.includes('ПУ состоялся'));
        const successCount = successStage.length;
        const conversion = total > 0 ? (successCount / total * 100).toFixed(1) : 0;
        const notProcessed = all.filter(l => l.stage === 'Не разобрано').length;
        const rejectBefore = all.filter(l => l.stage.includes('Отказ до ПУ')).length;

        // Связь с финансами: ищем доходы, где клиент совпадает с именем лида (для успешных)
        const clientMap = new Map();
        financeData.forEach(f => {
            const clientName = (f.client || '').trim();
            if (clientName) clientMap.set(clientName.toLowerCase(), (clientMap.get(clientName.toLowerCase()) || 0) + parseFloat(f.amount||0));
        });
        let revenue = 0;
        let salesCount = 0;
        successStage.forEach(l => {
            const key = l.name.trim().toLowerCase();
            if (clientMap.has(key)) {
                revenue += clientMap.get(key);
                salesCount++;
            }
        });
        const avgCheck = salesCount > 0 ? (revenue / salesCount).toFixed(0) : 0;
        const salesConversion = total > 0 ? (salesCount / total * 100).toFixed(1) : 0;

        document.getElementById('leadsKPI').innerHTML = `
            <div class="kpi-card"><span class="kpi-label">Всего лидов</span><span class="kpi-value">${total}</span></div>
            <div class="kpi-card"><span class="kpi-label">Успешных (ПУ)</span><span class="kpi-value">${successCount}</span></div>
            <div class="kpi-card"><span class="kpi-label">Конверсия в ПУ</span><span class="kpi-value">${conversion}%</span></div>
            <div class="kpi-card"><span class="kpi-label">Не разобрано</span><span class="kpi-value">${notProcessed}</span></div>
            <div class="kpi-card"><span class="kpi-label">Отказы до ПУ</span><span class="kpi-value">${rejectBefore}</span></div>
            <div class="kpi-card"><span class="kpi-label">Выручка по лидам</span><span class="kpi-value">${revenue.toLocaleString()} ₽</span></div>
            <div class="kpi-card"><span class="kpi-label">Продаж</span><span class="kpi-value">${salesCount}</span></div>
            <div class="kpi-card"><span class="kpi-label">Средний чек</span><span class="kpi-value">${avgCheck} ₽</span></div>
            <div class="kpi-card"><span class="kpi-label">Конв. в продажу</span><span class="kpi-value">${salesConversion}%</span></div>
        `;

        // По этапам
        const stageGroups = {};
        all.forEach(l => {
            const s = l.stage || '—';
            stageGroups[s] = (stageGroups[s] || 0) + 1;
        });
        const stageSorted = Object.entries(stageGroups).sort((a,b) => b[1] - a[1]);
        document.getElementById('stageContent').innerHTML = `<table>${stageSorted.map(([s,c]) => `<tr><td>${s}</td><td>${c}</td></tr>`).join('')}</table>`;

        // По источникам
        const sourceGroups = {};
        all.forEach(l => {
            const src = l.source || 'Не указан';
            if (!sourceGroups[src]) sourceGroups[src] = { total: 0, success: 0 };
            sourceGroups[src].total++;
            if (l.stage.includes('ПУ состоялся')) sourceGroups[src].success++;
        });
        const sourceSorted = Object.entries(sourceGroups).sort((a,b) => b[1].total - a[1].total);
        document.getElementById('sourceContent').innerHTML = `<table><thead><tr><th>Источник</th><th>Всего</th><th>Успешных</th><th>Конв.</th></tr></thead><tbody>
            ${sourceSorted.map(([src, data]) => `<tr><td>${src}</td><td>${data.total}</td><td>${data.success}</td><td>${data.total>0?(data.success/data.total*100).toFixed(1):0}%</td></tr>`).join('')}
        </tbody></table>`;

        // Таблица лидов
        document.getElementById('leadsTableBody').innerHTML = all.map(l=>`<tr><td>${l.date_added?new Date(l.date_added).toLocaleDateString('ru'):''}</td><td>${l.name}</td><td>${l.stage}</td><td>${l.source}</td><td>${l.is_duplicate?'<span class="badge">Дубль</span>':l.is_bad_contact?'<span class="badge red">Некорр.</span>':''}</td></tr>`).join('');
    }

    document.getElementById('homeSidebarBtn').addEventListener('click', ()=>{ window.location.href='index.html'; });
    document.getElementById('logoutSidebarBtn').addEventListener('click', async ()=>{ await _supabase.auth.signOut(); window.location.href='login.html'; });

    setupLeadsListeners();
    init();
})();
</script>
</body>
</html>
