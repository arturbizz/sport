<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Лиды · Music Club Орёл</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F7F8FA;
            --surface: #ffffff;
            --border: rgba(15,23,42,0.06);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --positive: #059669;
            --negative: #dc2626;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03);
            --shadow-lg: 0 12px 24px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.02);
            --radius-xl: 24px;
            --radius-lg: 20px;
            --radius-sm: 12px;
            --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
            --sidebar-width: 72px;
            --transition-base: 280ms cubic-bezier(0.2,0.8,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:var(--bg);
            color:var(--text-primary);
            display:flex;
            min-height:100vh;
            -webkit-font-smoothing:antialiased;
            letter-spacing:-0.01em;
            cursor:default;
            caret-color:transparent;
            overflow-x:hidden;
        }
        .ambient-blob { position:fixed; border-radius:50%; filter:blur(100px); opacity:0.04; pointer-events:none; z-index:0; }
        .ambient-blob.top-right { width:500px; height:500px; background:var(--accent); top:-100px; right:-100px; }
        .ambient-blob.bottom-left { width:400px; height:400px; background:#2563eb; bottom:-100px; left:-100px; }
        .sidebar {
            width:var(--sidebar-width);
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            border-right:1px solid var(--border);
            display:flex; flex-direction:column; align-items:center; padding:var(--space-8) 0; gap:var(--space-10);
            position:fixed; top:0; bottom:0; z-index:20; box-shadow:var(--shadow-sm);
        }
        .sidebar-icon {
            width:40px; height:40px; display:flex; align-items:center; justify-content:center;
            border-radius:var(--radius-sm); color:var(--text-tertiary); transition:all var(--transition-base); cursor:pointer;
        }
        .sidebar-icon.active { background:var(--accent-light); color:var(--accent); }
        .sidebar-icon:hover { background:rgba(0,0,0,0.02); color:var(--text-primary); }
        .sidebar-icon.logout { margin-top:auto; color:#ef4444; }
        .sidebar-icon.logout:hover { background:rgba(239,68,68,0.06); }
        .main {
            flex:1; margin-left:var(--sidebar-width); padding:var(--space-10); display:flex; flex-direction:column; gap:var(--space-8);
            max-width:1440px; width:100%; z-index:1;
        }
        .topbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--space-4); }
        .topbar-left h1 { font-size:32px; font-weight:700; letter-spacing:-0.02em; }
        .btn {
            display:inline-flex; align-items:center; gap:var(--space-2); padding:10px 18px; border-radius:var(--radius-sm);
            font-weight:550; font-size:14px; cursor:pointer; transition:all var(--transition-base);
            background:var(--surface); border:1px solid var(--border); color:var(--text-primary); box-shadow:var(--shadow-sm);
        }
        .btn:hover { background:#f8fafc; border-color:rgba(0,0,0,0.08); transform:translateY(-1px); }
        .btn-primary { background:var(--accent); border-color:var(--accent); color:white; }
        .btn-primary:hover { background:#4338ca; }
        .btn-group { display:flex; gap:0; }
        .btn-group .btn { border-radius:0; }
        .btn-group .btn:first-child { border-radius:var(--radius-sm) 0 0 var(--radius-sm); }
        .btn-group .btn:last-child { border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
        .btn-group .btn.active { background:var(--accent-light); color:var(--accent); border-color:var(--accent); }
        .filters-row { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); }
        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:var(--space-6); }
        .kpi-card {
            background:var(--surface); border-radius:var(--radius-xl); padding:var(--space-6);
            border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:all var(--transition-base);
            display:flex; flex-direction:column; gap:var(--space-3);
        }
        .kpi-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
        .kpi-label { font-size:13px; font-weight:500; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.03em; }
        .kpi-value { font-size:34px; font-weight:700; letter-spacing:-0.02em; }
        .widget-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(380px,1fr)); gap:var(--space-6); }
        .widget-card {
            background:var(--surface); border-radius:var(--radius-xl); padding:var(--space-6);
            border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:all var(--transition-base);
        }
        .widget-card:hover { box-shadow:var(--shadow-lg); }
        .widget-title { font-size:13px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:var(--space-5); }
        .table-container { background:var(--surface); border-radius:var(--radius-xl); border:1px solid var(--border); box-shadow:var(--shadow-sm); overflow:hidden; }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th { text-align:left; padding:var(--space-4) var(--space-6); font-weight:550; color:var(--text-tertiary); background:rgba(248,250,252,0.5); border-bottom:1px solid var(--border); font-size:12px; text-transform:uppercase; }
        td { padding:var(--space-4) var(--space-6); border-bottom:1px solid rgba(0,0,0,0.02); }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:rgba(0,0,0,0.005); }
        .badge { display:inline-block; padding:2px 10px; border-radius:100px; font-size:12px; font-weight:550; background:#fef3c7; color:#b45309; }
        .badge.red { background:#fee2e2; color:#b91c1c; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            max-width: 400px; width: 90%;
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.5) inset;
            animation: slideUp 0.25s ease-out;
            text-align: center;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); }
        }
        .modal p { margin-bottom: var(--space-6); color: var(--text-primary); font-size: 16px; line-height: 1.5; }
        .modal .btn { margin: 0 4px; }
        @media(max-width:900px) { .sidebar{display:none} .main{margin-left:0;padding:var(--space-4)} .kpi-grid{grid-template-columns:repeat(2,1fr)} .widget-grid{grid-template-columns:1fr} }
    </style>
</head>
<body>
<div class="ambient-blob top-right"></div>
<div class="ambient-blob bottom-left"></div>
<aside class="sidebar">
    <div class="sidebar-icon active" id="homeSidebarBtn" title="Главная">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="sidebar-icon logout" id="logoutSidebarBtn" title="Выйти">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div class="topbar-left"><h1>Лиды</h1></div>
        <div class="btn-group" id="leadModeGroup">
            <button class="btn active" data-mode="new">Новые (месяц)</button>
            <button class="btn" data-mode="all">Все лиды</button>
        </div>
    </div>
    <div class="filters-row">
        <input type="month" id="monthFilter" style="padding:10px 14px; border-radius:12px; border:1px solid var(--border); font-family:inherit;"/>
        <button class="btn" id="uploadLeadsBtn">Загрузить лиды</button>
        <button class="btn btn-primary" id="uploadSalesBtn">Загрузить продажи</button>
        <span id="salesStatus" style="font-size:13px; color:var(--text-tertiary);"></span>
    </div>
    <div class="kpi-grid" id="leadsKPI"></div>
    <div class="widget-grid">
        <div class="widget-card" id="stageWidget"><div class="widget-title">По этапам</div><div id="stageContent"></div></div>
        <div class="widget-card" id="sourceWidget"><div class="widget-title">По источникам</div><div id="sourceContent"></div></div>
        <div class="widget-card" id="managerWidget"><div class="widget-title">Продажи по менеджерам</div><div id="managerContent"></div></div>
    </div>
    <div class="table-container">
        <table><thead><tr><th>Дата</th><th>Имя</th><th>Этап</th><th>Источник</th><th>Статус</th></tr></thead><tbody id="leadsTableBody"></tbody></table>
    </div>
</main>

<div class="modal-overlay" id="alertModal" style="display:none;">
    <div class="modal">
        <p id="alertMessage"></p>
        <button class="btn btn-primary" id="alertOkBtn">OK</button>
    </div>
</div>

<script>
(function() {
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let leadsData = [], salesData = [];
    let currentMode = 'new'; // new | all

    // Установка текущего месяца в фильтр
    const now = new Date();
    document.getElementById('monthFilter').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    function customAlert(msg) {
        document.getElementById('alertMessage').textContent = msg;
        document.getElementById('alertModal').style.display = 'flex';
        document.getElementById('alertOkBtn').onclick = () => document.getElementById('alertModal').style.display = 'none';
    }

    async function checkAccess(requiredSection) {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return false; }
        const userEmail = session.user.email;
        if (userEmail === 'arturgalkin.ru@mail.ru') return true;
        const { data: emp } = await _supabase.from('employees').select('id').eq('email', userEmail).single();
        if (!emp) { window.location.href = 'index.html'; return false; }
        const { data: perm } = await _supabase.from('employee_permissions').select('*').eq('employee_id', emp.id).eq('section', requiredSection).single();
        if (!perm) { window.location.href = 'index.html'; return false; }
        return true;
    }

    function applyGradientColors(tableElement, values) {
        if (!tableElement || !values || values.length === 0) return;
        const maxVal = Math.max(...values);
        const minVal = Math.min(...values);
        const rows = tableElement.querySelectorAll('tr');
        rows.forEach((row, index) => {
            const val = values[index] || 0;
            let ratio = maxVal === minVal ? 0.5 : (val - minVal) / (maxVal - minVal);
            const hue = ratio * 120;
            row.style.backgroundColor = `hsla(${hue}, 40%, 85%, 0.25)`;
        });
    }

    function getFilteredLeads() {
        const all = leadsData.filter(l => !l.is_duplicate && !l.is_bad_contact);
        if (currentMode === 'new') {
            const monthVal = document.getElementById('monthFilter').value; // YYYY-MM
            if (!monthVal) return all;
            const [year, month] = monthVal.split('-').map(Number);
            const start = new Date(year, month-1, 1).toISOString();
            const end = new Date(year, month, 0, 23, 59, 59).toISOString();
            return all.filter(l => l.date_added && l.date_added >= start && l.date_added <= end);
        }
        return all;
    }

    function renderAll() {
        const filtered = getFilteredLeads();
        const total = filtered.length;

        const stageMap = {};
        filtered.forEach(l => {
            const s = l.stage || '—';
            stageMap[s] = (stageMap[s] || 0) + 1;
        });

        const pu = stageMap['ПУ состоялся'] || 0;
        const booked = stageMap['Запись на ПУ'] || 0;
        const notProcessed = stageMap['Не разобрано'] || 0;
        const rejectBefore = Object.entries(stageMap).filter(([k]) => k.includes('Отказ до ПУ')).reduce((sum, [,v]) => sum+v, 0);

        const salesCount = salesData.length;
        const revenue = salesData.reduce((sum, s) => sum + parseFloat(s.amount || 0), 0);
        const avgCheck = salesCount > 0 ? (revenue / salesCount).toFixed(0) : 0;
        const conversionLeadToPU = total > 0 ? (pu / total * 100).toFixed(1) : 0;
        const conversionBookedToPU = booked > 0 ? (pu / booked * 100).toFixed(1) : 0;
        const conversionPUToSale = pu > 0 ? (salesCount / pu * 100).toFixed(1) : 0;

        document.getElementById('leadsKPI').innerHTML = `
            <div class="kpi-card"><span class="kpi-label">Всего лидов</span><span class="kpi-value">${total}</span></div>
            <div class="kpi-card"><span class="kpi-label">Не разобрано</span><span class="kpi-value">${notProcessed}</span><span class="kpi-change">${total ? (notProcessed/total*100).toFixed(1) : 0}%</span></div>
            <div class="kpi-card"><span class="kpi-label">Запись на ПУ</span><span class="kpi-value">${booked}</span><span class="kpi-change">${total ? (booked/total*100).toFixed(1) : 0}%</span></div>
            <div class="kpi-card"><span class="kpi-label">ПУ состоялся</span><span class="kpi-value">${pu}</span><span class="kpi-change">${conversionLeadToPU}% от лидов</span></div>
            <div class="kpi-card"><span class="kpi-label">Конв. Запись→ПУ</span><span class="kpi-value">${conversionBookedToPU}%</span></div>
            <div class="kpi-card"><span class="kpi-label">Продажи</span><span class="kpi-value">${salesCount}</span><span class="kpi-change">${conversionPUToSale}% от ПУ</span></div>
            <div class="kpi-card"><span class="kpi-label">Выручка</span><span class="kpi-value">${revenue.toLocaleString()} ₽</span></div>
            <div class="kpi-card"><span class="kpi-label">Средний чек</span><span class="kpi-value">${avgCheck} ₽</span></div>
            <div class="kpi-card"><span class="kpi-label">Отказы до ПУ</span><span class="kpi-value">${rejectBefore}</span></div>
        `;

        // По этапам – детально
        const stageOrder = [
            'Не разобрано','Чат wazzup','Ндз1','Ндз2','Ндз3','Требует дозвона','Запись на ПУ',
            'Отказ до ПУ','Подтвердили','Повторное назначение','ПУ состоялся','Ждём решения',
            'Ждём оплату','Отложенные после ПУ','Отказ после ПУ','Сертификат','Отказ банков','Самозапрет'
        ];
        const stageRows = stageOrder.map(s => {
            const count = stageMap[s] || 0;
            const pct = total > 0 ? (count / total * 100).toFixed(1) : 0;
            return `<tr><td>${s}</td><td>${count}</td><td>${pct}%</td></tr>`;
        }).join('');
        document.getElementById('stageContent').innerHTML = `<table><thead><tr><th>Этап</th><th>Кол-во</th><th>%</th></tr></thead><tbody>${stageRows}</tbody></table>`;

        // По источникам
        const sourceGroups = {};
        filtered.forEach(l => {
            const src = l.source || 'Не указан';
            if (!sourceGroups[src]) sourceGroups[src] = { total: 0, success: 0 };
            sourceGroups[src].total++;
            if (l.stage.includes('ПУ состоялся')) sourceGroups[src].success++;
        });
        const sourceSorted = Object.entries(sourceGroups).sort((a,b) => b[1].total - a[1].total);
        document.getElementById('sourceContent').innerHTML = `<table><thead><tr><th>Источник</th><th>Всего</th><th>Успешных</th><th>Конв.</th></tr></thead><tbody>
            ${sourceSorted.map(([src, data]) => `<tr><td>${src}</td><td>${data.total}</td><td>${data.success}</td><td>${data.total>0?(data.success/data.total*100).toFixed(1):0}%</td></tr>`).join('')}
        </tbody></table>`;

        // По менеджерам
        const managerGroups = {};
        salesData.forEach(s => {
            const m = s.manager || 'Не указан';
            if (!managerGroups[m]) managerGroups[m] = { count: 0, sum: 0 };
            managerGroups[m].count++;
            managerGroups[m].sum += parseFloat(s.amount || 0);
        });
        const managerSorted = Object.entries(managerGroups).sort((a,b) => b[1].sum - a[1].sum);
        document.getElementById('managerContent').innerHTML = managerSorted.length ? `<table><thead><tr><th>Менеджер</th><th>Продаж</th><th>Сумма</th></tr></thead><tbody>
            ${managerSorted.map(([m, data]) => `<tr><td>${m}</td><td>${data.count}</td><td>${data.sum.toLocaleString()} ₽</td></tr>`).join('')}
        </tbody></table>` : '<p style="color:var(--text-tertiary);">Нет данных. Загрузите файл продаж.</p>';

        document.getElementById('leadsTableBody').innerHTML = filtered.map(l=>`<tr><td>${l.date_added?new Date(l.date_added).toLocaleDateString('ru'):''}</td><td>${l.name}</td><td>${l.stage}</td><td>${l.source}</td><td>${l.is_duplicate?'<span class="badge">Дубль</span>':l.is_bad_contact?'<span class="badge red">Некорр.</span>':''}</td></tr>`).join('');

        updateSalesStatus();
    }

    function updateSalesStatus() {
        const statusEl = document.getElementById('salesStatus');
        if (salesData.length > 0) {
            statusEl.textContent = `Загружено продаж: ${salesData.length}`;
        } else {
            statusEl.textContent = 'Продажи не загружены';
        }
    }

    async function loadLeads() {
        const { data } = await _supabase.from('leads').select('*').order('date_added', { ascending: false });
        leadsData = data || [];
    }

    async function loadSales() {
        const { data } = await _supabase.from('sales_report').select('*');
        salesData = data || [];
    }

    async function uploadLeads() {
        const input = document.createElement('input'); input.type='file'; input.accept='.xlsx';
        input.onchange = async (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                const parsed = [];
                const firstRow = rows[0] ? rows[0].join(' ') : '';
                if (firstRow.toLowerCase().includes('новые лиды')) {
                    let dataStartIdx = 0;
                    for (let i = 0; i < rows.length; i++) {
                        const rowStr = rows[i] ? rows[i].join(' ') : '';
                        if (rowStr.toLowerCase().includes('новые лиды')) continue;
                        if (rowStr.toLowerCase().includes('за период')) { dataStartIdx = i + 1; break; }
                    }
                    for (let i = dataStartIdx; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length < 4) continue;
                        const dateStr = String(row[1] || '').trim();
                        const name = String(row[2] || '').trim();
                        const stage = String(row[3] || '').trim();
                        const source = String(row[4] || '').trim();
                        if (!dateStr) continue;
                        const parts = dateStr.split(' ');
                        const datePart = parts[0];
                        const timePart = parts[1] || '00:00';
                        const [day, month, year] = datePart.split('.').map(Number);
                        const [hours, minutes] = timePart.split(':').map(Number);
                        const validDate = new Date(year, month - 1, day, hours || 0, minutes || 0);
                        const isDuplicate = /8\.\s*Дубль/.test(name);
                        const isBadContact = /13\.\s*Некорректные\s*контакты/.test(name);
                        parsed.push({ date_added: validDate.toISOString(), name, stage, source, is_duplicate: isDuplicate, is_bad_contact: isBadContact });
                    }
                } else {
                    const headerIdx = rows.findIndex(r => r && r.some(cell => String(cell).toLowerCase().includes('дата добавления')));
                    if (headerIdx === -1) { customAlert('Не удалось определить формат файла.'); return; }
                    const headers = rows[headerIdx].map(h => String(h).trim().toLowerCase());
                    const dateIdx = headers.findIndex(h => h.includes('дата добавления'));
                    const nameIdx = headers.findIndex(h => h.includes('наименование'));
                    const stageIdx = headers.findIndex(h => h.includes('этап'));
                    const sourceIdx = headers.findIndex(h => h.includes('источник'));
                    for (let i = headerIdx + 1; i < rows.length; i++) {
                        const row = rows[i]; if (!row || row.length < 2) continue;
                        const name = String(row[nameIdx] || '').trim();
                        const isDuplicate = /8\.\s*Дубль/.test(name);
                        const isBadContact = /13\.\s*Некорректные\s*контакты/.test(name);
                        parsed.push({
                            date_added: row[dateIdx] ? new Date(row[dateIdx]).toISOString() : null,
                            name,
                            stage: String(row[stageIdx] || '').trim(),
                            source: String(row[sourceIdx] || '').trim(),
                            is_duplicate: isDuplicate,
                            is_bad_contact: isBadContact
                        });
                    }
                }
                if (parsed.length === 0) { customAlert('Не найдено записей в файле.'); return; }
                const { error: delErr } = await _supabase.from('leads').delete().neq('id', 0);
                if (delErr) { customAlert('Ошибка удаления старых лидов: ' + delErr.message); return; }
                const { error } = await _supabase.from('leads').insert(parsed);
                if (error) { customAlert('ОШИБКА ЗАГРУЗКИ: ' + error.message); await loadLeads(); renderAll(); return; }
                await loadLeads();
                renderAll();
                customAlert('Лиды загружены (' + parsed.length + ' записей)');
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }

    async function uploadSales() {
        const input = document.createElement('input'); input.type='file'; input.accept='.xlsx';
        input.onchange = async (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                let headerRow = -1;
                for (let i = 0; i < Math.min(rows.length, 5); i++) {
                    const rowStr = rows[i] ? rows[i].join(' ').toLowerCase() : '';
                    if (rowStr.includes('дата') && (rowStr.includes('клиент') || rowStr.includes('плательщик'))) {
                        headerRow = i;
                        break;
                    }
                }
                if (headerRow === -1) { customAlert('Не найдена строка заголовка со столбцами "Дата" и "Клиент"/"Плательщик".'); return; }
                const headers = rows[headerRow].map(h => String(h).trim().toLowerCase());
                const dateIdx = headers.findIndex(h => h === 'дата');
                const amountIdx = headers.findIndex(h => h === 'сумма');
                let clientIdx = headers.findIndex(h => h === 'клиент');
                if (clientIdx === -1) clientIdx = headers.findIndex(h => h === 'плательщик');
                // Ищем менеджера (игнорируем "Ответственный менеджер")
                let managerIdx = -1;
                headers.forEach((h, idx) => {
                    const clean = h.replace(/\s/g, '');
                    if (clean === 'менеджер(фамилияимя)' || clean === 'менеджер' || clean === 'менеджерфамилияимя') {
                        managerIdx = idx;
                    }
                });
                if (managerIdx === -1) managerIdx = headers.findIndex(h => h.includes('менеджер') && !h.includes('ответственный'));

                if (dateIdx === -1 || amountIdx === -1 || clientIdx === -1) {
                    customAlert('Не найдены обязательные столбцы: Дата, Сумма, Клиент/Плательщик.');
                    return;
                }

                const parsed = [];
                for (let i = headerRow + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < Math.max(dateIdx, amountIdx, clientIdx) + 1) continue;
                    const dateStr = String(row[dateIdx] || '').trim();
                    const amountStr = String(row[amountIdx] || '0').replace(/\s/g, '').replace(',', '.');
                    const client = String(row[clientIdx] || '').trim();
                    let manager = '';
                    if (managerIdx !== -1) {
                        manager = String(row[managerIdx] || '').trim();
                        if (manager === 'Кто менеджер?' || manager === 'Ресепшен Орёл') manager = 'Не указан';
                    }
                    if (!dateStr || !client) continue;
                    const amount = parseFloat(amountStr);
                    if (isNaN(amount) || amount === 0) continue;
                    let isoDate = dateStr;
                    if (dateStr.includes('.')) {
                        const parts = dateStr.split('.');
                        if (parts.length === 3) {
                            isoDate = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                        }
                    }
                    parsed.push({ operation_date: isoDate, amount, client, manager });
                }

                if (parsed.length === 0) { customAlert('Не найдено ни одной продажи в файле.'); return; }
                const { error: delErr } = await _supabase.from('sales_report').delete().neq('id', 0);
                if (delErr) { customAlert('Ошибка очистки таблицы продаж: ' + delErr.message); return; }
                const { error: insErr } = await _supabase.from('sales_report').insert(parsed);
                if (insErr) { customAlert('Ошибка загрузки продаж: ' + insErr.message); return; }
                await loadSales();
                renderAll();
                customAlert('Продажи загружены (' + parsed.length + ' записей)');
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }

    async function init() {
        if (!await checkAccess('leads')) return;
        await Promise.all([loadLeads(), loadSales()]);
        renderAll();
    }

    // Переключение режима
    document.getElementById('leadModeGroup').addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
            document.querySelectorAll('#leadModeGroup .btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentMode = e.target.dataset.mode;
            renderAll();
        }
    });
    document.getElementById('monthFilter').addEventListener('change', renderAll);

    document.getElementById('uploadLeadsBtn').addEventListener('click', uploadLeads);
    document.getElementById('uploadSalesBtn').addEventListener('click', uploadSales);

    document.getElementById('homeSidebarBtn').addEventListener('click', ()=>{ window.location.href='index.html'; });
    document.getElementById('logoutSidebarBtn').addEventListener('click', async ()=>{ await _supabase.auth.signOut(); window.location.href='login.html'; });

    init();
})();
</script>
