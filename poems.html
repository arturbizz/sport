<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Стихи · Личная студия</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff9f4;
    --panel:rgba(255,255,255,.88);
    --line:rgba(42,26,61,.08);
    --line-soft:rgba(42,26,61,.055);
    --text:#2d1b3d;
    --text-2:#4a3a5c;
    --muted:#8a7a9a;
    --rose:#ff5c8a;
    --coral:#ff8c5c;
    --amber:#ffc93c;
    --violet:#6c5ce7;
    --mint:#06d6a0;
    --danger:#ef476f;
    --serif:'Cormorant Garamond',Georgia,serif;
    --body:'Lora',Georgia,serif;
    --ui:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--ui); color:var(--text); overflow:hidden;
    cursor:default; caret-color:transparent;
    background:
      radial-gradient(circle at 8% 8%, #ffc2d4 0%, transparent 38%),
      radial-gradient(circle at 92% 6%, #a5d8ff 0%, transparent 38%),
      radial-gradient(circle at 90% 96%, #ffe0a5 0%, transparent 42%),
      radial-gradient(circle at 6% 94%, #b5ead7 0%, transparent 42%),
      #fff9f4;
    -webkit-font-smoothing:antialiased;
  }
  input, textarea { cursor:text; caret-color:auto; }
  button, a, .poem-item, .icon-btn, .status-pill, .btn-primary, .foot-link, .btn-ghost { cursor:pointer; }

  ::selection{background:rgba(255,92,138,.22); color:var(--text)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,92,138,.18); border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,92,138,.3)}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:grid; grid-template-columns:340px 1fr; height:100vh; position:relative; z-index:2;
    transition:grid-template-column .35s cubic-bezier(.4,0,.2,1)}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    display:flex; flex-direction:column; min-height:0;
    border-right:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,248,242,.9));
    backdrop-filter:blur(24px) saturate(1.15);
    box-shadow:8px 0 30px -20px rgba(42,26,61,.15);
  }
  .brand{display:flex; align-items:center; gap:14px; padding:26px 24px 20px}
  .brand-mark{flex:none; filter:drop-shadow(0 6px 16px rgba(255,92,138,.35)); animation:spinSlow 26s linear infinite}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  .brand-text h1{
    font-family:var(--serif); font-size:1.75rem; font-weight:700; letter-spacing:.01em; line-height:1;
    background:linear-gradient(135deg,#ff5c8a 0%,#ff9a5c 55%,#ffc93c 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .brand-text span{display:block; font-size:.62rem; letter-spacing:.3em; text-transform:uppercase;
    color:var(--muted); margin-top:6px; font-weight:500}

  .btn-primary{
    margin:0 20px 16px; padding:13px 18px; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:9px;
    font-family:var(--ui); font-size:.83rem; font-weight:700; letter-spacing:.02em;
    color:var(--text); border:none;
    background:linear-gradient(135deg,#ff8fab 0%,#ffb36b 55%,#ffc93c 100%);
    box-shadow:0 10px 26px rgba(255,92,138,.28), inset 0 1px 0 rgba(255,255,255,.6);
    transition:.22s;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 14px 34px rgba(255,92,138,.38), inset 0 1px 0 rgba(255,255,255,.7)}
  .btn-primary:active{transform:translateY(0)}

  .search{margin:0 20px 14px; position:relative; display:flex; align-items:center}
  .search svg{position:absolute; left:13px; color:var(--muted); pointer-events:none}
  .search input{
    width:100%; padding:10px 12px 10px 36px; border-radius:12px; outline:none;
    background:#fff; border:1px solid var(--line);
    color:var(--text); font-family:var(--ui); font-size:.8rem; transition:.2s;
  }
  .search input::placeholder{color:#b0a4bd}
  .search input:focus{border-color:rgba(255,92,138,.45); box-shadow:0 0 0 4px rgba(255,92,138,.1)}

  .list{flex:1; overflow-y:auto; padding:0 14px 14px; min-height:0}
  .poem-item{
    display:block; width:100%; text-align:left; cursor:pointer; position:relative;
    padding:13px 15px; margin-bottom:5px; border-radius:13px;
    background:transparent; border:1px solid transparent; color:inherit;
    font-family:var(--ui); transition:.2s;
  }
  .poem-item:hover{background:rgba(255,92,138,.055)}
  .poem-item.active{
    background:linear-gradient(135deg, rgba(255,92,138,.11), rgba(255,201,60,.07));
    border-color:rgba(255,92,138,.26);
    box-shadow:0 6px 20px -10px rgba(255,92,138,.35);
  }
  .poem-item.active::before{
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:26px; border-radius:0 3px 3px 0;
    background:linear-gradient(180deg,#ff5c8a,#ffc93c);
  }
  .pi-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .pi-title{font-family:var(--serif); font-size:1.12rem; font-weight:600; letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text)}
  .pi-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);flex:none}
  .pi-preview{font-size:.74rem; color:var(--muted); margin-top:4px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .pi-date{font-size:.62rem; color:#b0a4bd; margin-top:6px; letter-spacing:.1em; text-transform:uppercase}
  .list-empty{padding:34px 18px; text-align:center; font-size:.78rem; color:#b0a4bd; line-height:1.6}

  .side-foot{
    border-top:1px solid var(--line-soft); padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:.68rem; color:#b0a4bd;
  }
  .side-foot span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .foot-link{color:var(--muted); text-decoration:none; transition:.2s; white-space:nowrap; font-weight:500}
  .foot-link:hover{color:var(--rose)}

  /* ---------- MAIN ---------- */
  .main{display:flex; flex-direction:column; min-height:0; padding:26px 44px 24px}
  .editor{display:flex; flex-direction:column; height:100%; min-height:0}
  .editor.hidden{display:none}

  .main-top{display:flex; align-items:center; gap:12px}
  .title-input{
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    font-family:var(--serif); font-size:2.2rem; font-weight:700; letter-spacing:.005em;
    color:var(--text); padding:4px 0;
  }
  .title-input::placeholder{color:rgba(138,122,154,.5); font-style:italic; font-weight:500}

  .actions{display:flex; gap:8px; flex:none}
  .icon-btn{
    width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
    background:#fff; border:1px solid var(--line);
    color:var(--text-2); cursor:pointer; transition:.2s;
    box-shadow:0 2px 6px rgba(42,26,61,.04);
  }
  .icon-btn:hover{
    color:var(--rose); border-color:rgba(255,92,138,.35);
    background:linear-gradient(135deg,#fff,#fff5f7);
    transform:translateY(-1px); box-shadow:0 8px 20px -8px rgba(255,92,138,.35);
  }
  .icon-btn.danger:hover{color:var(--danger); border-color:rgba(239,71,111,.4); background:#fff5f8}
  .icon-btn.armed{color:#fff; border-color:var(--danger); background:var(--danger);
    box-shadow:0 0 22px rgba(239,71,111,.4)}
  .icon-btn.active{
    color:#fff;
    background:linear-gradient(135deg,#ff5c8a,#ff9a5c);
    border-color:transparent;
    box-shadow:0 8px 22px -8px rgba(255,92,138,.55);
  }
  .menu-btn{display:none}

  .staff{
    height:26px; margin:6px 0 2px;
    background-image:repeating-linear-gradient(to bottom, transparent 0 5px, rgba(255,92,138,.14) 5px 6px);
    -webkit-mask-image:linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
    mask-image:linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
  }

  .meta{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:2px 0 4px}
  .status-pill{
    font-family:var(--ui); font-size:.66rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    padding:6px 15px; border-radius:999px; cursor:pointer; transition:.22s;
    border:1px solid rgba(255,92,138,.35); background:rgba(255,92,138,.08); color:var(--rose);
  }
  .status-pill:hover{background:rgba(255,92,138,.14)}
  .status-pill[data-status="ready"]{
    border-color:rgba(6,214,160,.4); background:rgba(6,214,160,.1); color:#059b76;
    box-shadow:0 0 20px rgba(6,214,160,.14);
  }
  .stats{font-size:.72rem; color:var(--muted); letter-spacing:.02em}
  .stats b{color:var(--text-2); font-weight:600}
  .save-state{
    font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--mint); font-weight:600;
    opacity:0; transform:translateY(4px); transition:.3s; margin-left:auto;
  }
  .save-state.show{opacity:1; transform:translateY(0)}

  .body-input{
    flex:1; min-height:0; width:100%; resize:none; outline:none; border:none;
    background:transparent; color:var(--text); overflow-y:auto;
    font-family:var(--body); font-size:18.5px; line-height:1.95; letter-spacing:.005em;
    padding:18px 8px 40px 0;
  }
  .body-input::placeholder{color:rgba(138,122,154,.45); font-style:italic}

  /* ---------- EMPTY ---------- */
  .empty{display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center}
  .empty.show{display:flex}
  .empty svg line{transform-box:fill-box; transform-origin:center; animation:breathe 3.4s ease-in-out infinite}
  .empty svg line:nth-child(1){animation-delay:0s}
  .empty svg line:nth-child(2){animation-delay:.18s}
  .empty svg line:nth-child(3){animation-delay:.36s}
  .empty svg line:nth-child(4){animation-delay:.54s}
  .empty svg line:nth-child(5){animation-delay:.72s}
  .empty svg line:nth-child(6){animation-delay:.9s}
  .empty svg line:nth-child(7){animation-delay:.36s}
  .empty svg line:nth-child(8){animation-delay:.18s}
  .empty svg line:nth-child(9){animation-delay:0s}
  @keyframes breathe{0%,100%{transform:scaleY(.55); opacity:.55} 50%{transform:scaleY(1); opacity:1}}
  .empty h2{font-family:var(--serif); font-size:2rem; font-weight:600; color:var(--text-2); margin-top:14px}
  .empty p{font-size:.83rem; color:var(--muted)}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; left:50%; bottom:34px; transform:translate(-50%,18px); z-index:100;
    background:#fff; border:1px solid rgba(255,92,138,.3);
    color:var(--text); padding:12px 24px; border-radius:14px;
    font-size:.82rem; letter-spacing:.01em; pointer-events:none; opacity:0;
    transition:.32s cubic-bezier(.4,0,.2,1);
    box-shadow:0 20px 50px rgba(255,92,138,.22), 0 4px 14px rgba(42,26,61,.08);
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* ---------- FOCUS MODE ---------- */
  .app.focus{grid-template-columns:0px 1fr}
  .app.focus .sidebar{opacity:0; pointer-events:none; border:none}
  .app.focus .main{padding-left:14vw; padding-right:14vw}

  /* ---------- MOBILE ---------- */
  .backdrop{display:none; position:fixed; inset:0; background:rgba(42,26,61,.35); backdrop-filter:blur(4px); z-index:30}
  .backdrop.show{display:block}
  @media(max-width:920px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed; inset:0 auto 0 0; width:308px; z-index:40; transform:translateX(-102%);
      transition:transform .32s cubic-bezier(.4,0,.2,1)}
    .sidebar.open{transform:translateX(0)}
    .menu-btn{display:grid}
    .main{padding:18px 18px 14px}
    .title-input{font-size:1.55rem}
    .body-input{font-size:17px; line-height:1.85}
    .app.focus{grid-template-columns:1fr}
    .app.focus .main{padding-left:18px; padding-right:18px}
  }
</style>
</head>
<body>

<div class="backdrop" id="backdrop"></div>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" width="42" height="42" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="vinylGrad" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0%" stop-color="#ff5c8a"/>
            <stop offset="50%" stop-color="#ff9a5c"/>
            <stop offset="100%" stop-color="#ffc93c"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22" fill="url(#vinylGrad)"/>
        <circle cx="24" cy="24" r="16" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1"/>
        <circle cx="24" cy="24" r="11" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
        <circle cx="24" cy="24" r="6" fill="#2d1b3d"/>
        <circle cx="24" cy="24" r="1.8" fill="#fff"/>
      </svg>
      <div class="brand-text">
        <h1>Стихи</h1>
        <span>личная студия</span>
      </div>
    </div>

    <button class="btn-primary" id="newBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Новый стих
    </button>

    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="Поиск по строкам…" autocomplete="off">
    </div>

    <div class="list" id="poemList"></div>

    <div class="side-foot">
      <span id="userFoot"></span>
      <a href="index.html" class="foot-link">← На главную</a>
    </div>
  </aside>

  <main class="main">
    <div class="editor" id="editor">
      <div class="main-top">
        <button class="icon-btn menu-btn" id="menuBtn" title="Список">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <input id="titleInput" class="title-input" placeholder="Без названия" autocomplete="off" spellcheck="false">
        <div class="actions">
          <button class="icon-btn" id="focusBtn" title="Режим фокуса">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
          <button class="icon-btn" id="copyBtn" title="Скопировать текст">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>
          </button>
          <button class="icon-btn danger" id="deleteBtn" title="Удалить">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.8A1.8 1.8 0 0 1 10.8 3h2.4A1.8 1.8 0 0 1 15 4.8V7"/><path d="M6.5 7l.8 12.2A2 2 0 0 0 9.3 21h5.4a2 2 0 0 0 2-1.8L17.5 7"/></svg>
          </button>
        </div>
      </div>

      <div class="staff"></div>

      <div class="meta">
        <button class="status-pill" id="statusPill" data-status="draft">черновик</button>
        <span class="stats" id="stats"></span>
        <span class="save-state" id="saveState">сохранено</span>
      </div>

      <textarea id="bodyInput" class="body-input" placeholder="Здесь рождаются строки…" spellcheck="false"></textarea>
    </div>

    <div class="empty" id="emptyState">
      <svg width="150" height="64" viewBox="0 0 150 64" fill="none" stroke-width="2.5" stroke-linecap="round">
        <defs>
          <linearGradient id="waveGrad" x1="0" y1="0" x2="150" y2="0">
            <stop offset="0%" stop-color="#ff5c8a"/>
            <stop offset="50%" stop-color="#ff9a5c"/>
            <stop offset="100%" stop-color="#ffc93c"/>
          </linearGradient>
        </defs>
        <line x1="12" y1="26" x2="12" y2="38" stroke="url(#waveGrad)"/>
        <line x1="27" y1="18" x2="27" y2="46" stroke="url(#waveGrad)"/>
        <line x1="42" y1="10" x2="42" y2="54" stroke="url(#waveGrad)"/>
        <line x1="57" y1="22" x2="57" y2="42" stroke="url(#waveGrad)"/>
        <line x1="72" y1="14" x2="72" y2="50" stroke="url(#waveGrad)"/>
        <line x1="87" y1="24" x2="87" y2="40" stroke="url(#waveGrad)"/>
        <line x1="102" y1="8" x2="102" y2="56" stroke="url(#waveGrad)"/>
        <line x1="117" y1="20" x2="117" y2="44" stroke="url(#waveGrad)"/>
        <line x1="132" y1="26" x2="132" y2="38" stroke="url(#waveGrad)"/>
      </svg>
      <h2>Тишина</h2>
      <p>Выберите стих слева или начните новый</p>
    </div>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const titleInput = $('titleInput'), bodyInput = $('bodyInput'), listEl = $('poemList'),
        searchInput = $('searchInput'), statsEl = $('stats'), saveStateEl = $('saveState'),
        statusPill = $('statusPill'), editorEl = $('editor'), emptyEl = $('emptyState'),
        appEl = $('app'), sidebarEl = $('sidebar'), backdropEl = $('backdrop');

  let poems = [];
  let currentId = null;
  let currentStatus = 'draft';
  let dirty = false;
  let saveTimer = null, savedTimer = null, armTimer = null, deleteArmed = false;

  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function flashSaved() {
    saveStateEl.classList.add('show');
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => saveStateEl.classList.remove('show'), 1600);
  }

  function showEditor() { editorEl.classList.remove('hidden'); emptyEl.classList.remove('show'); }
  function showEmpty() { editorEl.classList.add('hidden'); emptyEl.classList.add('show'); }

  function displayTitle(p) { return (p.title && p.title.trim()) ? p.title : 'Без названия'; }

  function renderList() {
    const q = searchInput.value.trim().toLowerCase();
    const items = poems.filter(p => {
      if (!q) return true;
      return (p.title || '').toLowerCase().includes(q) || (p.body || '').toLowerCase().includes(q);
    });
    listEl.innerHTML = '';
    if (!items.length) {
      const d = document.createElement('div');
      d.className = 'list-empty';
      d.textContent = q ? 'Ничего не найдено' : 'Пока пусто — начните первый стих';
      listEl.appendChild(d);
      return;
    }
    items.forEach(p => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'poem-item' + (p.id === currentId ? ' active' : '');
      const preview = (p.body || '').trim().replace(/\s+/g, ' ').slice(0, 70) || 'Пустой стих';
      const date = new Date(p.updated_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      el.innerHTML =
        '<div class="pi-top"><span class="pi-title">' + esc(displayTitle(p)) + '</span>' +
        (p.status === 'ready' ? '<span class="pi-dot"></span>' : '') + '</div>' +
        '<div class="pi-preview">' + esc(preview) + '</div>' +
        '<div class="pi-date">' + date + '</div>';
      el.onclick = () => { selectPoem(p.id); closeSidebar(); };
      listEl.appendChild(el);
    });
  }

  function updateStats() {
    const t = bodyInput.value;
    const lines = t.split('\n').filter(l => l.trim()).length;
    const words = t.trim() ? t.trim().split(/\s+/).length : 0;
    const syll = (t.toLowerCase().match(/[аеёиоуыэюя]/g) || []).length;
    statsEl.innerHTML = 'строк: <b>' + lines + '</b> · слов: <b>' + words + '</b> · слогов: <b>' + syll + '</b> · знаков: <b>' + t.length + '</b>';
  }

  function setStatus(s) {
    currentStatus = s;
    statusPill.dataset.status = s;
    statusPill.textContent = s === 'ready' ? 'готово' : 'черновик';
  }

  async function loadPoems() {
    const { data, error } = await sb.from('poems').select('*').order('updated_at', { ascending: false });
    if (error) { console.error(error); toast('Не удалось загрузить стихи'); poems = []; return; }
    poems = data || [];
    renderList();
  }

  async function selectPoem(id) {
    if (id === currentId) return;
    await flushSave();
    const p = poems.find(x => x.id === id);
    if (!p) return;
    currentId = id;
    titleInput.value = (p.title === 'Без названия') ? '' : (p.title || '');
    bodyInput.value = p.body || '';
    setStatus(p.status || 'draft');
    dirty = false;
    updateStats();
    renderList();
    showEditor();
  }

  function newPoem() {
    flushSave().then(() => {
      currentId = null;
      titleInput.value = '';
      bodyInput.value = '';
      setStatus('draft');
      dirty = false;
      updateStats();
      renderList();
      showEditor();
      closeSidebar();
      titleInput.focus();
    });
  }

  function scheduleSave() {
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 1100);
  }

  async function saveNow() {
    clearTimeout(saveTimer);
    const title = titleInput.value.trim();
    const body = bodyInput.value;
    if (!currentId && !title && !body.trim()) { dirty = false; return; }
    const payload = {
      title: title || 'Без названия',
      body: body,
      status: currentStatus,
      updated_at: new Date().toISOString()
    };
    if (currentId) {
      const { error } = await sb.from('poems').update(payload).eq('id', currentId);
      if (error) { console.error(error); toast('Ошибка сохранения'); return; }
      const p = poems.find(x => x.id === currentId);
      if (p) Object.assign(p, payload);
    } else {
      const { data, error } = await sb.from('poems').insert(payload).select().single();
      if (error) { console.error(error); toast('Ошибка сохранения'); return; }
      poems.unshift(data);
      currentId = data.id;
    }
    dirty = false;
    poems.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
    renderList();
    flashSaved();
  }

  async function flushSave() {
    if (!dirty) return;
    await saveNow();
  }

  async function doDelete() {
    if (!currentId) { showEmpty(); return; }
    const { error } = await sb.from('poems').delete().eq('id', currentId);
    if (error) { console.error(error); toast('Не удалось удалить'); return; }
    poems = poems.filter(p => p.id !== currentId);
    currentId = null;
    dirty = false;
    toast('Стих удалён');
    if (poems.length) { await selectPoem(poems[0].id); }
    else { titleInput.value = ''; bodyInput.value = ''; showEmpty(); renderList(); }
  }

  async function copyPoem() {
    const text = bodyInput.value;
    if (!text.trim()) { toast('Пока пусто'); return; }
    try {
      await navigator.clipboard.writeText(text);
      toast('Текст скопирован');
    } catch (e) {
      bodyInput.select(); document.execCommand('copy'); bodyInput.setSelectionRange(0, 0);
      toast('Текст скопирован');
    }
  }

  function openSidebar() { sidebarEl.classList.add('open'); backdropEl.classList.add('show'); }
  function closeSidebar() { sidebarEl.classList.remove('open'); backdropEl.classList.remove('show'); }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    $('userFoot').textContent = session.user.email;

    await loadPoems();
    if (poems.length) await selectPoem(poems[0].id);
    else showEmpty();

    $('newBtn').onclick = newPoem;
    searchInput.oninput = renderList;
    $('copyBtn').onclick = copyPoem;

    $('deleteBtn').onclick = () => {
      if (!currentId) { toast('Нечего удалять'); return; }
      if (!deleteArmed) {
        deleteArmed = true;
        $('deleteBtn').classList.add('armed');
        toast('Нажмите ещё раз, чтобы удалить');
        clearTimeout(armTimer);
        armTimer = setTimeout(() => { deleteArmed = false; $('deleteBtn').classList.remove('armed'); }, 3000);
        return;
      }
      clearTimeout(armTimer);
      deleteArmed = false;
      $('deleteBtn').classList.remove('armed');
      doDelete();
    };

    $('focusBtn').onclick = () => {
      appEl.classList.toggle('focus');
      $('focusBtn').classList.toggle('active');
    };

    $('menuBtn').onclick = openSidebar;
    backdropEl.onclick = closeSidebar;

    statusPill.onclick = () => {
      setStatus(currentStatus === 'ready' ? 'draft' : 'ready');
      scheduleSave();
    };

    titleInput.addEventListener('input', scheduleSave);
    bodyInput.addEventListener('input', () => { updateStats(); scheduleSave(); });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); }
      if (e.key === 'Escape') { closeSidebar(); appEl.classList.remove('focus'); $('focusBtn').classList.remove('active'); }
    });

    window.addEventListener('beforeunload', (e) => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
