<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест API AlfaCRM (v2 подбор)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; max-width: 1000px; margin: 2rem auto; padding: 1rem; }
    input, button, select { padding: 0.5rem; margin: 0.3rem; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.4rem; text-align: left; font-size: 0.85rem; }
    th { background: #f8f8f8; }
    .status { margin: 0.5rem 0; font-weight: 600; white-space: pre-wrap; background: #fef3c7; padding: 0.5rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Тест API AlfaCRM (подбор эндпоинта)</h1>
  <div>
    <label>Прокси: <input type="text" id="proxyUrl" size="60" value="https://ujsakubqnirmpdwmmtju.supabase.co/functions/v1/alfa-proxy"></label><br>
    <label>Домен CRM: 
      <select id="baseDomain">
        <option value="https://api.alfa-crm.ru">api.alfa-crm.ru</option>
        <option value="https://demo.alfa-crm.ru">demo.alfa-crm.ru</option>
        <option value="https://musicclub.alfa-crm.ru">musicclub.alfa-crm.ru</option>
      </select>
    </label><br>
    <label>Путь: 
      <select id="apiPath">
        <option value="/v2/operation">/v2/operation</option>
        <option value="/v2/operations">/v2/operations</option>
        <option value="/v2/finance/transactions">/v2/finance/transactions</option>
        <option value="/v2/finance/list">/v2/finance/list</option>
        <option value="/v2/finance/index">/v2/finance/index</option>
        <option value="/v2/crm/finance">/v2/crm/finance</option>
        <option value="/v2/crm/operation">/v2/crm/operation</option>
      </select>
    </label><br>
    <label>Параметры (необязательно): <input type="text" id="queryParams" size="40" placeholder="page=1&date_from=2026-07-01"></label><br>
    <button id="fetchBtn">Загрузить через прокси</button>
    <button id="saveBtn" disabled>Сохранить в Supabase</button>
  </div>
  <div class="status" id="status"></div>
  <table id="dataTable">
    <thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Категория</th><th>Счёт</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let fetchedData = [];

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const proxyUrl = document.getElementById('proxyUrl').value.trim();
      const base = document.getElementById('baseDomain').value;
      const path = document.getElementById('apiPath').value;
      let query = document.getElementById('queryParams').value.trim();
      if (query && !query.startsWith('?')) query = '?' + query;
      const endpoint = base + path + query;
      if (!proxyUrl || !endpoint) return;
      document.getElementById('status').textContent = 'Пробую: ' + endpoint + ' ...';
      try {
        const resp = await fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint })
        });
        const json = await resp.json();
        if (json.error) {
          let msg = `Ошибка: ${json.error}`;
          if (json.status) msg += `\nHTTP статус: ${json.status}`;
          if (json.raw) msg += `\nСырой ответ (первые 500 символов):\n${json.raw}`;
          document.getElementById('status').textContent = msg;
          return;
        }
        console.log('Ответ:', json);
        let raw = null;
        if (Array.isArray(json)) raw = json;
        else if (json.data && Array.isArray(json.data)) raw = json.data;
        else if (json.items && Array.isArray(json.items)) raw = json.items;
        else if (json.records && Array.isArray(json.records)) raw = json.records;
        else raw = Object.values(json).find(v => Array.isArray(v));

        if (!raw) throw new Error('Массив данных не найден. Смотрите консоль (F12).');
        fetchedData = raw.map(item => ({
          operation_date: item.date || item.operation_date || item.created_at || '',
          operation_type: item.type || item.operation_type || item.category || '',
          amount: parseFloat(item.amount || item.sum || item.price || 0),
          category: item.category || item.expense_item || item.description || '',
          account: item.account || item.cash_register || item.bank_account || ''
        }));
        renderTable(fetchedData);
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('status').textContent = `Успех! Загружено ${fetchedData.length} записей.`;
      } catch (err) {
        document.getElementById('status').textContent = 'Критическая ошибка: ' + err.message;
        console.error(err);
      }
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!fetchedData.length) return;
      document.getElementById('status').textContent = 'Сохранение в Supabase...';
      try {
        await _supabase.from('crm_finance').delete().neq('operation_type', 'settings');
        const { error } = await _supabase.from('crm_finance').insert(fetchedData);
        if (error) throw error;
        document.getElementById('status').textContent = `Сохранено ${fetchedData.length} записей.`;
      } catch (err) {
        document.getElementById('status').textContent = 'Ошибка сохранения: ' + err.message;
      }
    });

    function renderTable(data) {
      const tbody = document.querySelector('#dataTable tbody');
      tbody.innerHTML = data.map(r => `<tr>
        <td>${r.operation_date}</td>
        <td>${r.operation_type}</td>
        <td>${r.amount.toLocaleString()} ₽</td>
        <td>${r.category}</td>
        <td>${r.account}</td>
      </tr>`).join('');
    }
  </script>
</body>
</html>
