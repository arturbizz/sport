<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест API AlfaCRM v2 (коробка)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; max-width: 1000px; margin: 2rem auto; padding: 1rem; }
    input, button, select, textarea { padding: 0.5rem; margin: 0.3rem; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.4rem; text-align: left; font-size: 0.85rem; }
    th { background: #f8f8f8; }
    .status { margin: 0.5rem 0; font-weight: 600; white-space: pre-wrap; background: #fef3c7; padding: 0.5rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Тест API AlfaCRM v2 (коробка)</h1>
  <div>
    <label>Прокси: <input type="text" id="proxyUrl" size="60" value="https://ujsakubqnirmpdwmmtju.supabase.co/functions/v1/alfa-proxy"></label><br>
    <label>Филиал (branch ID): <input type="text" id="branch" size="10" value="20"></label><br>
    <label>Путь API:
      <select id="apiPath">
        <option value="pay/index">pay/index (финансы)</option>
        <option value="pay-item/index">pay-item/index (статьи)</option>
        <option value="pay-account/index">pay-account/index (счета)</option>
        <option value="customer/index">customer/index (клиенты)</option>
      </select>
    </label><br>
    <label>Тело запроса (JSON):<br>
      <textarea id="requestBody" rows="4" cols="60">{"page":0}</textarea>
    </label><br>
    <button id="fetchBtn">Загрузить через прокси</button>
    <button id="saveBtn" disabled>Сохранить в Supabase</button>
  </div>
  <div class="status" id="status"></div>
  <table id="dataTable">
    <thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Категория</th><th>Счёт</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let fetchedData = [];

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const proxyUrl = document.getElementById('proxyUrl').value.trim();
      const branch = document.getElementById('branch').value.trim();
      const path = document.getElementById('apiPath').value;
      let body;
      try {
        body = JSON.parse(document.getElementById('requestBody').value);
      } catch (e) {
        document.getElementById('status').textContent = 'Ошибка: тело запроса не является валидным JSON';
        return;
      }
      if (!proxyUrl || !branch || !path) {
        document.getElementById('status').textContent = 'Заполните все поля';
        return;
      }
      document.getElementById('status').textContent = 'Отправляю запрос...';
      try {
        const resp = await fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ branch, path, body })
        });
        const json = await resp.json();
        if (json.error) {
          document.getElementById('status').textContent = `Ошибка: ${json.error}`;
          return;
        }
        console.log('Ответ:', json);

        // Извлекаем массив items
        const raw = json.items || [];
        if (!raw.length) throw new Error('Массив items пуст');

        // Показываем первый элемент для отладки
        console.log('Первый элемент:', raw[0]);

        fetchedData = raw.map(item => ({
          operation_date: item.document_date || item.date || '',
          operation_type: item.income ? 'Доход' : 'Расход',
          amount: parseFloat(item.income || item.sum || item.amount || 0),
          category: item.pay_item_id || item.category_id || '',
          account: item.pay_account_id || item.account_id || ''
        }));
        renderTable(fetchedData);
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('status').textContent = `Загружено ${fetchedData.length} записей.`;
      } catch (err) {
        document.getElementById('status').textContent = 'Ошибка: ' + err.message;
        console.error(err);
      }
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!fetchedData.length) return;
      document.getElementById('status').textContent = 'Сохранение...';
      try {
        await _supabase.from('crm_finance').delete().neq('operation_type', 'settings');
        const { error } = await _supabase.from('crm_finance').insert(fetchedData);
        if (error) throw error;
        document.getElementById('status').textContent = `Сохранено ${fetchedData.length} записей.`;
      } catch (err) {
        document.getElementById('status').textContent = 'Ошибка сохранения: ' + err.message;
      }
    });

    function renderTable(data) {
      const tbody = document.querySelector('#dataTable tbody');
      tbody.innerHTML = data.map(r => `<tr>
        <td>${r.operation_date}</td>
        <td>${r.operation_type}</td>
        <td>${r.amount.toLocaleString()} ₽</td>
        <td>${r.category}</td>
        <td>${r.account}</td>
      </tr>`).join('');
    }
  </script>
</body>
</html>
