<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест API AlfaCRM — полная загрузка</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; max-width: 1100px; margin: 2rem auto; padding: 1rem; }
    button { padding: 0.6rem 1.4rem; font-size: 0.9rem; margin: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; font-size: 0.9rem; }
    th { background: #f3f4f6; }
    .status { background: #fef3c7; padding: 0.5rem; border-radius: 8px; margin: 0.5rem 0; white-space: pre-wrap; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .save-btn { background: #0d9488; color: white; border: none; }
    .save-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Загрузка данных из AlfaCRM</h1>
  <div>
    <label>Прокси: <input type="text" id="proxyUrl" size="60" value="https://ujsakubqnirmpdwmmtju.supabase.co/functions/v1/alfa-proxy"></label><br>
    <label>Филиал: <input type="text" id="branch" size="10" value="20"></label>
  </div>
  <div class="actions">
    <button id="loadJulyBtn">Загрузить июль 2026</button>
    <button id="loadAllBtn">Загрузить ВСЕ записи (5620)</button>
    <button id="saveBtn" class="save-btn" disabled>Сохранить в Supabase</button>
    <span id="status" class="status"></span>
  </div>

  <h2>Ключевые показатели (KPI)</h2>
  <table id="kpiTable">
    <thead><tr><th>Показатель</th><th>Значение</th></tr></thead>
    <tbody>
      <tr><td>Доходы</td><td id="kpiIncome">—</td></tr>
      <tr><td>Расходы</td><td id="kpiExpense">—</td></tr>
      <tr><td>Маркетинг</td><td id="kpiMarketing">—</td></tr>
      <tr><td>Роялти (8% от доходов)</td><td id="kpiRoyalty">—</td></tr>
      <tr><td>Операционная прибыль</td><td id="kpiOperProfit">—</td></tr>
      <tr><td>Чистая прибыль</td><td id="kpiNetProfit">—</td></tr>
      <tr><td>Всего операций</td><td id="kpiCount">—</td></tr>
      <tr><td>Доходных операций (продаж)</td><td id="kpiSalesCount">—</td></tr>
      <tr><td>Средний чек</td><td id="kpiAvgCheck">—</td></tr>
      <tr><td>ROI маркетинга</td><td id="kpiROI">—</td></tr>
      <tr><td>Доля маркетинга в расходах</td><td id="kpiMarketingShare">—</td></tr>
    </tbody>
  </table>

  <script>
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Кэш справочников (сохраняется между загрузками)
    let dicts = { payItems: {}, payAccounts: {}, payTypes: {} };
    let currentFetchedData = [];
    const statusDiv = document.getElementById('status');

    function updateStatus(msg) {
      statusDiv.textContent = msg;
      console.log(msg);
    }

    // Загрузка справочников с кешированием в localStorage
    async function loadDictionaries(proxyUrl, branch) {
      const cached = localStorage.getItem('alfa_dicts');
      if (cached) {
        dicts = JSON.parse(cached);
        updateStatus('Справочники загружены из кеша.');
        return;
      }
      updateStatus('Загрузка справочников...');
      try {
        const payItems = await fetchAllPages(proxyUrl, branch, 'pay-item/index', {}, 3);
        payItems.forEach(i => dicts.payItems[i.id] = i.name);
        const payAccounts = await fetchAllPages(proxyUrl, branch, 'pay-account/index', {}, 3);
        payAccounts.forEach(i => dicts.payAccounts[i.id] = i.name);
        const payTypes = await fetchAllPages(proxyUrl, branch, 'pay-type/index', {}, 1);
        payTypes.forEach(i => dicts.payTypes[i.id] = i.name);
        localStorage.setItem('alfa_dicts', JSON.stringify(dicts));
        updateStatus('Справочники загружены и сохранены в кеш.');
      } catch (e) {
        updateStatus('Ошибка загрузки справочников: ' + e.message);
      }
    }

    async function fetchPage(proxyUrl, branch, path, body) {
      const resp = await fetch(proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branch, path, body })
      });
      const json = await resp.json();
      if (json.error) throw new Error(json.error);
      return json;
    }

    // Загрузка всех страниц (до получения пустого ответа или до лимита)
    async function fetchAllPages(proxyUrl, branch, path, bodyTemplate, maxPages = 200) {
      let allItems = [];
      let page = 0;
      let total = null;
      while (page < maxPages) {
        const body = { ...bodyTemplate, page, branch_id: parseInt(branch) };
        const json = await fetchPage(proxyUrl, branch, path, body);
        if (total === null && json.total) total = json.total;
        const items = json.items || [];
        allItems = allItems.concat(items);
        updateStatus(`Загружено ${allItems.length}${total ? ' из ' + total : ''} (стр. ${page})`);
        if (items.length === 0) break;
        if (total && allItems.length >= total) break;
        page++;
        await new Promise(r => setTimeout(r, 50)); // лёгкая пауза
      }
      return allItems;
    }

    function formatDate(d) {
      if (!d) return '';
      const parts = d.split('.');
      if (parts.length === 3) return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
      return d;
    }

    function isDateInRange(dateStr, year, month) {
      if (!dateStr) return false;
      const parts = dateStr.split('.');
      if (parts.length !== 3) return false;
      return parseInt(parts[2]) === year && parseInt(parts[1]) === month;
    }

    function processItems(items) {
      currentFetchedData = items.map(item => {
        const amount = parseFloat(item.income || item.amount || 0);
        const typeName = dicts.payTypes[item.pay_type_id] || '';
        const isIncome = typeName.toLowerCase().includes('доход') || typeName.toLowerCase().includes('приход');
        return {
          operation_date: formatDate(item.document_date),
          operation_type: isIncome ? 'Доход' : 'Расход',
          amount,
          category: dicts.payItems[item.pay_item_id] || (item.pay_item_id ? `ID ${item.pay_item_id}` : ''),
          account: dicts.payAccounts[item.pay_account_id] || '',
          manager: '',
          payment_type: '',
          client: '',
          teacher_name: '',
          period: ''
        };
      });

      let totalIncome = 0, totalExpense = 0, totalMarketing = 0, salesCount = 0;
      currentFetchedData.forEach(r => {
        if (r.operation_type === 'Доход') { totalIncome += r.amount; salesCount++; }
        else {
          totalExpense += r.amount;
          if (r.category.toLowerCase().includes('маркетинг') || r.category.toLowerCase().includes('лидмаркет'))
            totalMarketing += r.amount;
        }
      });

      const opProfit = totalIncome - totalExpense;
      const royalty = new Date().toISOString().slice(0,7) >= '2026-07' ? Math.round(totalIncome * 0.08) : 0;
      const net = opProfit - royalty;
      const avgCheck = salesCount ? Math.round(totalIncome / salesCount) : 0;
      const roi = totalMarketing ? (totalIncome / totalMarketing).toFixed(1) : '—';
      const share = totalExpense ? ((totalMarketing / totalExpense) * 100).toFixed(1) : '0';

      document.getElementById('kpiIncome').textContent = totalIncome.toLocaleString() + ' ₽';
      document.getElementById('kpiExpense').textContent = totalExpense.toLocaleString() + ' ₽';
      document.getElementById('kpiMarketing').textContent = totalMarketing.toLocaleString() + ' ₽';
      document.getElementById('kpiRoyalty').textContent = royalty.toLocaleString() + ' ₽';
      document.getElementById('kpiOperProfit').textContent = opProfit.toLocaleString() + ' ₽';
      document.getElementById('kpiNetProfit').textContent = net.toLocaleString() + ' ₽';
      document.getElementById('kpiCount').textContent = currentFetchedData.length;
      document.getElementById('kpiSalesCount').textContent = salesCount;
      document.getElementById('kpiAvgCheck').textContent = avgCheck.toLocaleString() + ' ₽';
      document.getElementById('kpiROI').textContent = roi;
      document.getElementById('kpiMarketingShare').textContent = share + '%';
      document.getElementById('saveBtn').disabled = false;
    }

    async function loadJuly() {
      const proxyUrl = document.getElementById('proxyUrl').value.trim();
      const branch = document.getElementById('branch').value.trim();
      if (!proxyUrl || !branch) return;
      updateStatus('Загрузка операций за июль 2026...');
      try {
        await loadDictionaries(proxyUrl, branch);
        let raw = await fetchAllPages(proxyUrl, branch, 'pay/index', {
          document_date_from: '01.07.2026',
          document_date_to: '31.07.2026'
        }, 50);
        if (raw.length === 0) {
          raw = await fetchAllPages(proxyUrl, branch, 'pay/index', {}, 40);
          raw = raw.filter(item => isDateInRange(item.document_date, 2026, 7));
        } else {
          raw = raw.filter(item => isDateInRange(item.document_date, 2026, 7));
        }
        processItems(raw);
        updateStatus(`Загружено ${raw.length} записей за июль.`);
      } catch (e) { updateStatus('Ошибка: ' + e.message); }
    }

    async function loadAll() {
      const proxyUrl = document.getElementById('proxyUrl').value.trim();
      const branch = document.getElementById('branch').value.trim();
      if (!proxyUrl || !branch) return;
      updateStatus('Загрузка всех операций (может занять ~30 секунд)...');
      try {
        await loadDictionaries(proxyUrl, branch);
        const raw = await fetchAllPages(proxyUrl, branch, 'pay/index', {}, 200);
        processItems(raw);
        updateStatus(`Загружено всего ${raw.length} записей.`);
      } catch (e) { updateStatus('Ошибка: ' + e.message); }
    }

    document.getElementById('loadJulyBtn').addEventListener('click', loadJuly);
    document.getElementById('loadAllBtn').addEventListener('click', loadAll);

    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!currentFetchedData.length) return;
      if (!confirm(`Заменить ВСЕ данные в crm_finance (кроме настроек) на ${currentFetchedData.length} записей?`)) return;
      document.getElementById('saveBtn').disabled = true;
      updateStatus('Сохранение...');
      try {
        await _supabase.from('crm_finance').delete().neq('operation_type', 'settings');
        for (let i = 0; i < currentFetchedData.length; i += 500) {
          const chunk = currentFetchedData.slice(i, i + 500);
          const { error } = await _supabase.from('crm_finance').insert(chunk);
          if (error) throw error;
        }
        updateStatus(`✅ Сохранено ${currentFetchedData.length} записей. Дашборды обновлены.`);
      } catch (e) {
        updateStatus('Ошибка сохранения: ' + e.message);
        document.getElementById('saveBtn').disabled = false;
      }
    });

    // При открытии страницы сразу пробуем загрузить справочники из кеша
    (async () => {
      const cached = localStorage.getItem('alfa_dicts');
      if (cached) {
        dicts = JSON.parse(cached);
        updateStatus('Справочники восстановлены из кеша. Можно начинать загрузку.');
      }
    })();
  </script>
</body>
</html>
