<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест API AlfaCRM v2 (сохранение с датами)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; max-width: 1100px; margin: 2rem auto; padding: 1rem; }
    input, button, select, textarea { padding: 0.5rem; margin: 0.3rem; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.4rem; text-align: left; font-size: 0.85rem; }
    th { background: #f8f8f8; }
    .status { margin: 0.5rem 0; font-weight: 600; white-space: pre-wrap; background: #fef3c7; padding: 0.5rem; border-radius: 8px; }
    .success { background: #d1fae5; }
  </style>
</head>
<body>
  <h1>Тест API AlfaCRM v2 (сохранение в Supabase)</h1>
  <div>
    <label>Прокси: <input type="text" id="proxyUrl" size="60" value="https://ujsakubqnirmpdwmmtju.supabase.co/functions/v1/alfa-proxy"></label><br>
    <label>Филиал (branch ID): <input type="text" id="branch" size="10" value="20"></label><br>
    <button id="loadAllBtn">Загрузить все операции (pay/index)</button>
    <button id="saveBtn" disabled>Сохранить в Supabase</button>
  </div>
  <div class="status" id="status"></div>
  <table id="dataTable">
    <thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Статья (ID)</th><th>Счёт (ID)</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let fetchedData = [];

    // Преобразование даты из DD.MM.YYYY в YYYY-MM-DD
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('.');
      if (parts.length === 3) {
        return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
      }
      return dateStr; // если уже в нужном формате
    }

    async function fetchAllPages(proxyUrl, branch, path, initialBody) {
      let allItems = [];
      let page = 0;
      let total = null;
      while (true) {
        const body = { ...initialBody, page };
        const resp = await fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ branch, path, body })
        });
        const json = await resp.json();
        if (json.error) throw new Error(json.error);
        if (total === null) total = json.total;
        const items = json.items || [];
        allItems = allItems.concat(items);
        document.getElementById('status').textContent = `Загружено ${allItems.length} из ${total}...`;
        if (items.length === 0 || allItems.length >= total) break;
        page++;
      }
      return allItems;
    }

    document.getElementById('loadAllBtn').addEventListener('click', async () => {
      const proxyUrl = document.getElementById('proxyUrl').value.trim();
      const branch = document.getElementById('branch').value.trim();
      if (!proxyUrl || !branch) return;
      document.getElementById('status').textContent = 'Загрузка всех операций...';
      try {
        const items = await fetchAllPages(proxyUrl, branch, 'pay/index', {});
        console.log('Пример первого элемента:', items[0]); // для отладки
        fetchedData = items.map(item => {
          // Сумма: сначала income, потом amount, потом sum (если есть)
          const amount = parseFloat(item.income || item.amount || item.sum || 0);
          // Определяем тип: income > 0 => Доход, иначе Расход (или по полю income)
          const isIncome = item.income > 0 || (item.income === undefined && amount > 0); // если income нет, считаем по сумме
          const operationType = isIncome ? 'Доход' : 'Расход';
          return {
            operation_date: formatDate(item.document_date),
            operation_type: operationType,
            amount: amount,
            category: item.pay_item_id ? String(item.pay_item_id) : '',
            account: item.pay_account_id ? String(item.pay_account_id) : ''
          };
        });
        renderTable(fetchedData.slice(0, 100)); // показываем первые 100 для скорости
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('status').textContent = `Загружено ${fetchedData.length} операций. Проверьте таблицу.`;
        document.getElementById('status').classList.add('success');
      } catch (err) {
        document.getElementById('status').textContent = 'Ошибка: ' + err.message;
        console.error(err);
      }
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      if (!fetchedData.length) return;
      if (!confirm(`Будут удалены все старые данные crm_finance (кроме настроек) и сохранено ${fetchedData.length} записей. Продолжить?`)) return;
      document.getElementById('status').textContent = 'Сохранение...';
      try {
        await _supabase.from('crm_finance').delete().neq('operation_type', 'settings');
        // Вставка по частям
        for (let i = 0; i < fetchedData.length; i += 500) {
          const chunk = fetchedData.slice(i, i + 500);
          const { error } = await _supabase.from('crm_finance').insert(chunk);
          if (error) throw error;
        }
        document.getElementById('status').textContent = `Сохранено ${fetchedData.length} записей. Дашборд обновлён.`;
      } catch (err) {
        document.getElementById('status').textContent = 'Ошибка сохранения: ' + err.message;
      }
    });

    function renderTable(data) {
      const tbody = document.querySelector('#dataTable tbody');
      tbody.innerHTML = data.map(r => `<tr>
        <td>${r.operation_date}</td>
        <td>${r.operation_type}</td>
        <td>${r.amount.toLocaleString()} ₽</td>
        <td>${r.category}</td>
        <td>${r.account}</td>
      </tr>`).join('');
    }
  </script>
</body>
</html>
