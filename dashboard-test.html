<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест API AlfaCRM v2 – сводка за 2 месяца</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; max-width: 1100px; margin: 2rem auto; padding: 1rem; }
    input, button, select { padding: 0.5rem; margin: 0.3rem; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.4rem; text-align: left; font-size: 0.85rem; }
    th { background: #f8f8f8; }
    .status { margin: 0.5rem 0; font-weight: 600; white-space: pre-wrap; background: #fef3c7; padding: 0.5rem; border-radius: 8px; }
    .kpi { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .kpi-card { background: #f0fdfa; border: 1px solid #0d9488; border-radius: 12px; padding: 0.8rem 1.2rem; min-width: 160px; }
    .kpi-card .label { font-size: 0.75rem; color: #475569; }
    .kpi-card .value { font-size: 1.5rem; font-weight: 700; color: #0d9488; }
  </style>
</head>
<body>
  <h1>Сводка за 2 месяца (июль-август 2026)</h1>
  <div>
    <label>Прокси: <input type="text" id="proxyUrl" size="60" value="https://ujsakubqnirmpdwmmtju.supabase.co/functions/v1/alfa-proxy"></label>
    <label>Филиал: <input type="text" id="branch" size="10" value="20"></label>
    <button id="loadBtn">Загрузить данные</button>
    <span id="status" class="status"></span>
  </div>

  <div class="kpi" id="kpiContainer"></div>

  <h2>Расходы по категориям (топ-10)</h2>
  <table id="categoryTable">
    <thead><tr><th>Категория</th><th>Сумма</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Топ-10 крупнейших расходов</h2>
  <table id="topExpensesTable">
    <thead><tr><th>Дата</th><th>Категория</th><th>Сумма</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Справочники
    const dicts = { payItems: {}, payAccounts: {}, customers: {}, teachers: {} };

    async function fetchPage(proxyUrl, branch, path, body) {
      const resp = await fetch(proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branch, path, body })
      });
      const json = await resp.json();
      if (json.error) throw new Error(json.error);
      return json;
    }

    async function fetchAllPages(proxyUrl, branch, path, bodyTemplate, maxPages = 100) {
      let allItems = [];
      let page = 0;
      while (page < maxPages) {
        const json = await fetchPage(proxyUrl, branch, path, { ...bodyTemplate, page });
        const items = json.items || [];
        allItems = allItems.concat(items);
        if (items.length < 50) break;
        page++;
      }
      return allItems;
    }

    async function loadDictionaries(proxyUrl, branch) {
      const [payItems, payAccounts, customers, teachers] = await Promise.all([
        fetchAllPages(proxyUrl, branch, 'pay-item/index', {}),
        fetchAllPages(proxyUrl, branch, 'pay-account/index', {}),
        fetchAllPages(proxyUrl, branch, 'customer/index', {}),
        fetchAllPages(proxyUrl, branch, 'teacher/index', {})
      ]);
      payItems.forEach(i => dicts.payItems[i.id] = i.name);
      payAccounts.forEach(i => dicts.payAccounts[i.id] = i.name);
      customers.forEach(i => dicts.customers[i.id] = i.name || `${i.last_name||''} ${i.first_name||''}`);
      teachers.forEach(i => dicts.teachers[i.id] = i.name || `${i.last_name||''} ${i.first_name||''}`);
    }

    document.getElementById('loadBtn').addEventListener('click', async () => {
      const proxyUrl = document.getElementById('proxyUrl').value.trim();
      const branch = document.getElementById('branch').value.trim();
      if (!proxyUrl || !branch) return;

      document.getElementById('status').textContent = 'Загрузка справочников...';
      try {
        await loadDictionaries(proxyUrl, branch);
        document.getElementById('status').textContent = 'Загрузка операций...';

        // Фильтр за июль и август 2026
        const itemsJuly = await fetchAllPages(proxyUrl, branch, 'pay/index', {
          document_date_from: '01.07.2026',
          document_date_to: '31.07.2026'
        });
        const itemsAug = await fetchAllPages(proxyUrl, branch, 'pay/index', {
          document_date_from: '01.08.2026',
          document_date_to: '31.08.2026'
        });
        const allItems = [...itemsJuly, ...itemsAug];

        // Аналитика
        let totalIncome = 0, totalExpense = 0, totalMarketing = 0;
        const categoryExpenses = {};
        const oneTimeExpenses = [];

        allItems.forEach(item => {
          const amount = parseFloat(item.income || item.amount || 0);
          const catId = item.pay_item_id;
          const catName = dicts.payItems[catId] || `ID ${catId}`;
          if (amount > 0) totalIncome += amount;
          else {
            const absAmount = Math.abs(amount);
            totalExpense += absAmount;
            // Маркетинг
            if (catName.toLowerCase().includes('маркетинг') || catName.toLowerCase().includes('лидмаркет')) totalMarketing += absAmount;
            // Категории
            categoryExpenses[catName] = (categoryExpenses[catName] || 0) + absAmount;
            // Разовые крупные расходы (> 1000)
            if (absAmount > 1000) oneTimeExpenses.push({ date: item.document_date, category: catName, amount: absAmount });
          }
        });

        // KPI
        document.getElementById('kpiContainer').innerHTML = `
          <div class="kpi-card"><div class="label">Доходы</div><div class="value">${totalIncome.toLocaleString()} ₽</div></div>
          <div class="kpi-card"><div class="label">Расходы</div><div class="value">${totalExpense.toLocaleString()} ₽</div></div>
          <div class="kpi-card"><div class="label">Маркетинг</div><div class="value">${totalMarketing.toLocaleString()} ₽</div></div>
          <div class="kpi-card"><div class="label">Прибыль</div><div class="value">${(totalIncome - totalExpense).toLocaleString()} ₽</div></div>
          <div class="kpi-card"><div class="label">Операций</div><div class="value">${allItems.length}</div></div>
        `;

        // Расходы по категориям (топ-10)
        const sortedCategories = Object.entries(categoryExpenses).sort((a,b) => b[1] - a[1]).slice(0,10);
        document.querySelector('#categoryTable tbody').innerHTML = sortedCategories.map(([cat, sum]) => `<tr><td>${cat}</td><td>${sum.toLocaleString()} ₽</td></tr>`).join('');

        // Топ-10 крупнейших расходов
        const topExpenses = oneTimeExpenses.sort((a,b) => b.amount - a.amount).slice(0,10);
        document.querySelector('#topExpensesTable tbody').innerHTML = topExpenses.map(e => `<tr><td>${e.date}</td><td>${e.category}</td><td>${e.amount.toLocaleString()} ₽</td></tr>`).join('');

        document.getElementById('status').textContent = `Загружено ${allItems.length} операций.`;
      } catch (err) {
        document.getElementById('status').textContent = 'Ошибка: ' + err.message;
        console.error(err);
      }
    });
  </script>
</body>
</html>
