<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест API AlfaCRM v2 (без сохранения)</title>
  <style>
    body { font-family: 'Inter', sans-serif; max-width: 1100px; margin: 2rem auto; padding: 1rem; }
    input, button, select, textarea { padding: 0.5rem; margin: 0.3rem; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.4rem; text-align: left; font-size: 0.85rem; }
    th { background: #f8f8f8; }
    .status { margin: 0.5rem 0; font-weight: 600; white-space: pre-wrap; background: #fef3c7; padding: 0.5rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Тест API AlfaCRM v2 (только просмотр)</h1>
  <p style="color: #475569; font-size: 0.9rem;">Данные не сохраняются в Supabase. Можно безопасно тестировать.</p>
  <div>
    <label>Прокси: <input type="text" id="proxyUrl" size="60" value="https://ujsakubqnirmpdwmmtju.supabase.co/functions/v1/alfa-proxy"></label><br>
    <label>Филиал (branch ID): <input type="text" id="branch" size="10" value="20"></label><br>
    <label>Путь API:
      <select id="apiPath">
        <option value="pay/index">pay/index (финансы)</option>
        <option value="pay-item/index">pay-item/index (статьи)</option>
        <option value="pay-account/index">pay-account/index (счета)</option>
        <option value="customer/index">customer/index (клиенты)</option>
      </select>
    </label><br>
    <label>Фильтр (JSON, необязательно):<br>
      <textarea id="requestBody" rows="3" cols="60">{"page":0}</textarea>
    </label><br>
    <button id="loadBtn">Загрузить</button>
    <span id="pageInfo"></span>
  </div>
  <div class="status" id="status"></div>
  <table id="dataTable">
    <thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Статья (ID)</th><th>Счёт (ID)</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const proxyUrlInput = document.getElementById('proxyUrl');
    const branchInput = document.getElementById('branch');
    const apiPathSelect = document.getElementById('apiPath');
    const requestBodyTextarea = document.getElementById('requestBody');
    const loadBtn = document.getElementById('loadBtn');
    const statusDiv = document.getElementById('status');
    const pageInfoSpan = document.getElementById('pageInfo');
    const dataTableBody = document.querySelector('#dataTable tbody');

    let allFetchedItems = [];
    let currentPage = 0;
    let totalItems = 0;

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('.');
      if (parts.length === 3) {
        return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
      }
      return dateStr;
    }

    async function loadPage(page) {
      const proxyUrl = proxyUrlInput.value.trim();
      const branch = branchInput.value.trim();
      const path = apiPathSelect.value;
      let body;
      try {
        body = JSON.parse(requestBodyTextarea.value || '{}');
      } catch (e) {
        statusDiv.textContent = 'Ошибка: невалидный JSON';
        return;
      }
      body.page = page;
      if (!proxyUrl || !branch || !path) {
        statusDiv.textContent = 'Заполните все поля';
        return;
      }
      statusDiv.textContent = `Загрузка страницы ${page}...`;
      try {
        const resp = await fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ branch, path, body })
        });
        const json = await resp.json();
        if (json.error) throw new Error(json.error);
        totalItems = json.total || 0;
        const items = json.items || [];
        if (page === 0) allFetchedItems = [];
        allFetchedItems = allFetchedItems.concat(items);
        renderTable(allFetchedItems);
        pageInfoSpan.textContent = `Показано ${allFetchedItems.length} из ${totalItems}`;
        statusDiv.textContent = `Загружено ${allFetchedItems.length} записей.`;
        currentPage = page;
      } catch (err) {
        statusDiv.textContent = 'Ошибка: ' + err.message;
        console.error(err);
      }
    }

    function renderTable(items) {
      dataTableBody.innerHTML = items.map(item => {
        const date = formatDate(item.document_date);
        const amount = parseFloat(item.income || item.amount || 0);
        const type = amount > 0 ? 'Доход' : 'Расход';
        const category = item.pay_item_id || '';
        const account = item.pay_account_id || '';
        return `<tr>
          <td>${date}</td>
          <td>${type}</td>
          <td>${amount.toLocaleString()} ₽</td>
          <td>${category}</td>
          <td>${account}</td>
        </tr>`;
      }).join('');
    }

    loadBtn.addEventListener('click', () => loadPage(0));
    // Загружаем первую страницу сразу
    loadPage(0);
  </script>
</body>
</html>
