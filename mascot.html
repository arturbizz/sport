<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Маскотик – AI помощник</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --surface: rgba(255,255,255,0.8);
      --accent: #0d9488;
      --text-secondary: #475569;
      --radius-xl: 32px; --radius-lg: 20px; --radius-sm: 14px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; padding: 20px;
      cursor: default; caret-color: transparent;
    }
    input, textarea { cursor: text; caret-color: auto; }

    .copilot {
      width: 100%; height: 100%;
      max-width: 520px; max-height: 780px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 25px 60px rgba(0,0,0,0.12), 0 0 0 1px rgba(255,255,255,0.2) inset;
      display: flex; flex-direction: column; overflow: hidden;
    }

    .chat-header {
      display: flex; align-items: center; gap: 14px; padding: 20px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .mascot-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: #ccfbf1; object-fit: cover;
    }
    .header-info h3 { font-size: 18px; font-weight: 600; }
    .header-info span { font-size: 12px; color: var(--text-secondary); }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
      background: rgba(248,250,252,0.6);
    }
    .msg {
      max-width: 80%; padding: 12px 18px; border-radius: var(--radius-sm);
      font-size: 14px; line-height: 1.5;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } }
    .msg.user { align-self: flex-end; background: #ccfbf1; color: #134e4a; }
    .msg.bot {
      align-self: flex-start; background: white; color: #0f172a;
      border: 1px solid rgba(0,0,0,0.05); border-left: 3px solid var(--accent);
    }

    .quick-actions {
      display: flex; gap: 8px; padding: 12px 24px; overflow-x: auto;
      border-top: 1px solid rgba(0,0,0,0.04);
    }
    .quick-btn {
      padding: 8px 16px; border-radius: 24px; border: 1px solid #e2e8f0;
      background: white; font-size: 13px; font-weight: 500; white-space: nowrap;
      cursor: pointer; transition: 0.2s; color: var(--text-secondary);
    }
    .quick-btn:hover { background: #f0fdfa; border-color: var(--accent); color: var(--accent); }

    .input-area {
      display: flex; padding: 16px 24px; gap: 10px;
      border-top: 1px solid rgba(0,0,0,0.04);
    }
    .input-area input {
      flex:1; border: 1px solid #e2e8f0; border-radius: 28px;
      padding: 12px 20px; font-size: 14px; outline: none;
      background: rgba(255,255,255,0.7);
    }
    .input-area button {
      background: var(--accent); color: white; border: none;
      border-radius: 50%; width: 48px; height: 48px;
      font-size: 20px; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .input-area button:hover { background: #0f766e; }
  </style>
</head>
<body>
  <div class="copilot">
    <div class="chat-header">
      <img src="mascot.png" class="mascot-avatar" alt="Маскотик" onerror="this.style.display='none'">
      <div class="header-info">
        <h3>Маскотик</h3>
        <span>Всегда на связи</span>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="quick-actions" id="quickActions"></div>
    <div class="input-area">
      <input id="chatInput" placeholder="Спросите что угодно..." />
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/super-handler`;

    // Получаем email и токен из URL
    const urlParams = new URLSearchParams(window.location.search);
    const userEmail = urlParams.get('email') || '';
    const userToken = urlParams.get('token') || '';
    let effectiveRole = '';

    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const quickActions = document.getElementById('quickActions');

    (async () => {
      if (userEmail && userToken) {
        // Определяем роль
        if (userEmail === 'arturgalkin.ru@mail.ru') {
          const impRole = localStorage.getItem('impersonated_role');
          effectiveRole = impRole || 'Управляющий';
        } else {
          const { data: emp } = await _supabase.from('employees').select('role').eq('email', userEmail).single();
          effectiveRole = emp?.role || 'Менеджер';
        }
      } else {
        effectiveRole = 'Менеджер';
      }
      loadHistory();
      updateQuickActions();
    })();

    function loadHistory() {
      const key = `mascot_chat_${userEmail || 'anon'}`;
      const history = JSON.parse(localStorage.getItem(key) || '[]');
      history.forEach(msg => addMessage(msg.text, msg.sender, false));
    }
    function saveHistory() {
      const key = `mascot_chat_${userEmail || 'anon'}`;
      const messages = [];
      chatMessages.querySelectorAll('.msg').forEach(msg => {
        messages.push({ text: msg.textContent, sender: msg.classList.contains('user') ? 'user' : 'bot' });
      });
      localStorage.setItem(key, JSON.stringify(messages));
    }

    function addMessage(text, sender, save = true) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (save) saveHistory();
    }

    async function askBot(question) {
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (userToken) headers['Authorization'] = `Bearer ${userToken}`;
        const resp = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers,
          body: JSON.stringify({ question, email: userEmail, impersonatedRole: localStorage.getItem('impersonated_role') || '' })
        });
        const data = await resp.json();
        addMessage(data.reply || 'Я не понял.', 'bot');
      } catch(e) {
        addMessage('Ошибка соединения.', 'bot');
      }
    }

    function updateQuickActions() {
      const buttonsMap = {
        'Менеджер': ['Моя зарплата', 'Мои продажи', 'Моя конверсия'],
        'Преподаватель': ['Моя зарплата', 'Моё расписание'],
        'Бухгалтер': ['Ближайшие платежи', 'Зарплаты сотрудников', 'Скачать ведомость'],
        'ИП': ['Продажи сегодня', 'Ближайшие расходы'],
        'Управляющий': ['Продажи сегодня', 'Прибыль', 'Конверсия лидов']
      };
      const buttons = buttonsMap[effectiveRole] || ['Моя зарплата', 'Ближайшие платежи', 'Продажи сегодня'];
      quickActions.innerHTML = buttons.map(text => `<button class="quick-btn">${text}</button>`).join('');
      quickActions.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          addMessage(btn.textContent, 'user');
          askBot(btn.textContent);
        });
      });
    }

    sendBtn.addEventListener('click', () => {
      const q = chatInput.value.trim();
      if (!q) return;
      addMessage(q, 'user');
      chatInput.value = '';
      askBot(q);
    });
    chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendBtn.click(); });
  </script>
</body>
</html>
