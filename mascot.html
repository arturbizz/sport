<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <title>Маскотик — Music Club</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: rgba(15,23,42,0.05);
      --text: #0f172a;
      --text-secondary: #475569;
      --accent: #0d9488;
      --accent-soft: #e6f7f5;
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-sm: 14px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.02);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 8px 20px rgba(0,0,0,0.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }
    /* Главный контейнер — эффект стекла */
    .copilot {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: var(--shadow-md), 0 0 0 1px rgba(255,255,255,0.5) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 90vh;
      position: relative;
    }
    /* Аватар и приветствие */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.8rem 1.5rem 1.2rem;
      background: linear-gradient(180deg, rgba(204,251,241,0.6) 0%, rgba(255,255,255,0) 100%);
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 0.8rem;
      object-fit: cover;
      border: 2px solid white;
    }
    .greeting {
      font-size: 1.3rem;
      font-weight: 650;
      color: var(--text);
      text-align: center;
    }
    .role-badge {
      display: inline-block;
      margin-top: 0.3rem;
      padding: 0.25rem 1rem;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    /* Секция с кнопками-действиями */
    .actions {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem 1.2rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .action-group-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-left: 0.3rem;
      margin-bottom: 0.1rem;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.9rem 1rem;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs);
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      user-select: none;
    }
    .action-btn:active {
      background: #f8fafc;
      transform: scale(0.98);
    }
    .action-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .action-icon svg {
      width: 24px;
      height: 24px;
    }
    .action-text {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
    }
    /* Метка роли (маленькая буква в уголке) */
    .role-tag {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }
    /* Цвета ролей (для различения) */
    .role-tag.manager { background: #3b82f6; }
    .role-tag.booker { background: #8b5cf6; }
    .role-tag.admin { background: #f59e0b; }
    .role-tag.ip { background: #64748b; }
    .role-tag.teacher { background: #ec4899; }
    .role-tag.owner { background: #0d9488; }
    /* Сообщения (история) */
    .messages {
      padding: 0 1.2rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      margin: 0 1.2rem;
    }
    .msg {
      padding: 0.6rem 0.8rem;
      background: #f8fafc;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .msg.error { background: #fee2e2; color: var(--text); }
    /* Кнопка выхода внизу */
    .logout-area {
      padding: 0.8rem 1.2rem 1.2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }
    .logout-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      transition: 0.2s;
    }
    .logout-btn:active { background: #f1f5f9; }
  </style>
</head>

      teachersalary: `<svg viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>`,
      teacherschedule: `<svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
      ipincome: `<svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,

    };

    // Структура кнопок по ролям (с метками и группировкой)
    const roleActions = {
      'Управляющий': [
        { group: 'Финансы',
          items: [
            { action:'kpi', label:'Сводка KPI', icon: icons.kpi, tag:'У' },

        },

      'Бухгалтер': [

            { action:'salaries', label:'Зарплаты', icon: icons.salaries, tag:'Б' },
            { action:'tax', label:'Налоги/роялти', icon: icons.tax, tag:'Б' },
            { action:'receipts', label:'Чеки за 30 дн.', icon: icons.receipts, tag:'Б' },
          ]
        }
      ],
      'Менеджер': [
        { group: 'Личные показатели',
          items: [
            { action:'mysales', label:'Мои продажи', icon: icons.mysales, tag:'М' },
            { action:'mysalary', label:'Моя зарплата', icon: icons.mysalary, tag:'М' },
            { action:'myconversion', label:'Моя конверсия', icon: icons.myconversion, tag:'М' },

          ]
        }
      ],
      'Администратор': [

    function addMessage(text, isError=false) {
      messagesEl.style.display = 'flex';
      const div = document.createElement('div');
      div.className = `msg${isError?' error':''}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderActions(buttons) {
      actionsEl.innerHTML = '';
      buttons.forEach(group => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'action-group';
        if (group.group) {
          const title = document.createElement('div');
          title.className = 'action-group-title';
          title.textContent = group.group;
          groupDiv.appendChild(title);
        }
        group.items.forEach(item => {
          const btn = document.createElement('div');
          btn.className = 'action-btn';
          btn.innerHTML = `
            <div class="action-icon">${item.icon}</div>
            <span class="action-text">${item.label}</span>
            <span class="role-tag ${getTagClass(item.tag)}">${item.tag}</span>
          `;
          btn.addEventListener('click', () => handleAction(item.action));
          groupDiv.appendChild(btn);
        });
        actionsEl.appendChild(groupDiv);
      });
    }

    function getTagClass(tag) {
      if (tag==='У') return 'owner';
      if (tag==='Б') return 'booker';
      if (tag==='М') return 'manager';
      if (tag==='А') return 'admin';
      if (tag==='П') return 'teacher';
      if (tag==='ИП') return 'ip';
      return '';
    }

    async function handleAction(action) {
      addMessage(`Загружаю "${action}"...`);
      try {
        let result = '';
        const monthStr = new Date().toISOString().slice(0,7);
        const start = monthStr + '-01';
        const end = monthStr + '-31';
        switch (action) {
          case 'kpi': {
            const [inc, exp] = await Promise.all([
              _supabase.from('crm_finance').select('amount').gte('operation_date', start).or('operation_type.ilike.%доход%,operation_type.ilike.%продажа%'),
              _supabase.from('crm_finance').select('amount').gte('operation_date', start).or('operation_type.ilike.%расход%,operation_type.ilike.%выплата%')
            ]);
            const income = (inc.data||[]).reduce((s,r)=>s+parseFloat(r.amount),0);
            const expense = (exp.data||[]).reduce((s,r)=>s+parseFloat(r.amount),0);
            result = `Доходы: ${income.toLocaleString()} ₽\nРасходы: ${expense.toLocaleString()} ₽\nЧистая прибыль: ${(income-expense).toLocaleString()} ₽`;
            break;
          }
          case 'cashflow': {
            const { data } = await _supabase.from('expenses').select('name,amount,next_payment_date').eq('paid',false).lte('next_payment_date', new Date(Date.now()+7*86400000).toISOString().slice(0,10)).order('next_payment_date');
            result = data?.length ? data.map(e=>`• ${e.next_payment_date}: ${e.name} — ${e.amount} ₽`).join('\n') : 'На 7 дней платежей нет.';
            break;
          }
          case 'leads': {
            const { data } = await _supabase.from('leads').select('stage').gte('date_added', new Date(Date.now()-30*86400000).toISOString());
            const clean = (data||[]).filter(l=>!l.stage?.includes('Дубль')&&!l.stage?.includes('Некорректные'));
            const conv = clean.filter(l=>l.stage?.includes('ПУ состоялся'));
            result = `Лидов: ${clean.length}\nКонверсия: ${clean.length?(conv.length/clean.length*100).toFixed(1):0}%`;
            break;
          }
          case 'breakeven': {
            const { data } = await _supabase.from('expenses').select('amount,periodicity').eq('paid',false);
            const eq = {weekly:52/12,biweekly:26/12,monthly:1,quarterly:1/3,yearly:1/12};
            const total = Math.round((data||[]).reduce((s,e)=>s+parseFloat(e.amount)*(eq[e.periodicity]??1),0));
            const breakeven = Math.round(total/0.92);
            result = `Покрыть расходы: ${total.toLocaleString()} ₽\nС учётом роялти: ${breakeven.toLocaleString()} ₽`;
            break;
          }
          case 'unpaid': {
            const { data } = await _supabase.from('expenses').select('name,amount,next_payment_date').eq('paid',false).order('next_payment_date');
            result = data?.length ? data.map(e=>`• ${e.next_payment_date||'—'}: ${e.name} — ${e.amount} ₽`).join('\n') : 'Всё оплачено.';
            break;
          }
          case 'regular': {
            const { data } = await _supabase.from('expenses').select('name,amount,periodicity').eq('paid',false);
            result = data?.length ? data.map(e=>`• ${e.name} — ${e.amount} ₽ (${e.periodicity})`).join('\n') + `\n\nОбщая сумма: ${data.reduce((s,e)=>s+parseFloat(e.amount),0).toLocaleString()} ₽` : 'Нет платежей.';
            break;
          }
          case 'salaries': {
            const { data:emps } = await _supabase.from('employees').select('id,name,role');
            const { data:params } = await _supabase.from('salary_params').select('*').eq('month',monthStr);
            const { data:logs } = await _supabase.from('worklog').select('*').gte('date',start).lte('date',end);
            const lines = [];
            for (const emp of (emps||[])) {
              const p = (params||[]).find(x=>x.emp_id===emp.id)||{};
              const w = (logs||[]).filter(l=>l.emp_id===emp.id && l.status==='working');
              const worked = w.length;
              const rates = {'Менеджер':20000,'Администратор':25000,'Управляющий':50000};
              const base = rates[emp.role] ? (rates[emp.role]/(p.norm_days||22))*worked : 0;
              let bonus = 0;
              if (emp.role==='Менеджер') {
                const sales = w.reduce((s,l)=>s+(l.daily_sales||0),0);
                bonus = sales * ((p.plan_fulfilled?7:5)/100);
              }
              lines.push(`${emp.name}: ${Math.round(base+bonus).toLocaleString()} ₽`);
            }
            result = lines.join('\n') || 'Нет данных.';
            break;
          }
          case 'tax': {
            const { data:inc } = await _supabase.from('crm_finance').select('amount').gte('operation_date',start).or('operation_type.ilike.%доход%,operation_type.ilike.%продажа%');
            const income = (inc?.data||[]).reduce((s,r)=>s+parseFloat(r.amount),0);
            result = `Роялти 8%: ${Math.round(income*0.08).toLocaleString()} ₽`;
            break;
          }
          case 'receipts': {
            const { data } = await _supabase.from('expenses').select('name,receipt_url,paid_at').not('receipt_url','is',null).gte('paid_at', new Date(Date.now()-30*86400000).toISOString()).order('paid_at',{ascending:false});
            result = data?.length ? data.map(e=>`• ${new Date(e.paid_at).toLocaleDateString('ru')}: ${e.name} — чек`).join('\n') : 'Чеков нет.';
            break;
          }
          case 'mysales': {
            const { data:emp } = await _supabase.from('employees').select('id').eq('email',currentUser.email).single();
            if (!emp) { result = 'Сотрудник не найден.'; break; }
            const { data:logs } = await _supabase.from('worklog').select('daily_sales').eq('emp_id',emp.id).gte('date',start).lte('date',end).eq('status','working');
            const sales = (logs||[]).reduce((s,l)=>s+(l.daily_sales||0),0);
            const { data:plan } = await _supabase.from('salary_params').select('plan_amount').eq('emp_id',emp.id).eq('month',monthStr).single();
            const planAmount = plan?.plan_amount||0;
            result = `Продажи: ${sales.toLocaleString()} ₽\nПлан: ${planAmount.toLocaleString()} ₽\nОсталось: ${Math.max(0,planAmount-sales).toLocaleString()} ₽`;
            break;
          }
          case 'mysalary': {
            const { data:emp } = await _supabase.from('employees').select('id,role').eq('email',currentUser.email).single();
            if (!emp) { result = 'Сотрудник не найден.'; break; }
            const { data:logs } = await _supabase.from('worklog').select('daily_sales,status').eq('emp_id',emp.id).gte('date',start).lte('date',end);
            const worked = (logs||[]).filter(l=>l.status==='working').length;
            const rates = {'Менеджер':20000,'Администратор':25000,'Управляющий':50000};
            const base = rates[emp.role] ? (rates[emp.role]/22)*worked : 0;
            const sales = (logs||[]).filter(l=>l.status==='working').reduce((s,l)=>s+(l.daily_sales||0),0);
            const { data:param } = await _supabase.from('salary_params').select('plan_fulfilled').eq('emp_id',emp.id).eq('month',monthStr).single();
            const bonus = sales * (param?.plan_fulfilled?0.07:0.05);
            result = `Смен: ${worked}\nБазовая: ${Math.round(base).toLocaleString()} ₽\nБонус: ${Math.round(bonus).toLocaleString()} ₽\nИтого: ${Math.round(base+bonus).toLocaleString()} ₽`;
            break;
          }
          case 'myconversion': {
            const { data:leads } = await _supabase.from('leads').select('stage').gte('date_added',new Date(Date.now()-30*86400000).toISOString());
            const clean = (leads||[]).filter(l=>!l.stage?.includes('Дубль')&&!l.stage?.includes('Некорректные'));
            const conv = clean.filter(l=>l.stage?.includes('ПУ состоялся'));
            result = `Конверсия: ${clean.length?(conv.length/clean.length*100).toFixed(1):0}% (${conv.length}/${clean.length})`;
            break;
          }
          default: result = 'Скоро появится';
        }
        messagesEl.lastChild.textContent = result;
      } catch (err) {
        messagesEl.lastChild.textContent = 'Ошибка получения данных';
        console.error(err);
      }
    }

    async function init() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      currentUser = session.user;
      const email = currentUser.email;
      document.getElementById('greeting').textContent = `Привет, ${email.split('@')[0]}!`;
      if (email === ADMIN_EMAIL) {
        effectiveRole = 'Управляющий';
      } else {
        const { data: emp } = await _supabase.from('employees').select('role').eq('email', email).single();
        effectiveRole = emp?.role || '';
      }
      document.getElementById('roleBadge').textContent = effectiveRole || 'гость';
      const structure = roleActions[effectiveRole] || [];
      if (!structure.length) {
        actionsEl.innerHTML = '<p style="text-align:center;color:var(--text-secondary);">Нет доступных действий</p>';
        return;
      }
      renderActions(structure);
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await _supabase.auth.signOut();
        window.location.href = 'login.html';
      });
    }
    init();
  </script>
</body>
</html>
