<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База знаний — Колл-центр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kb-styles.css">
</head>
<body>

  <button class="sidebar-open-fab" id="sidebar-open-fab" title="Открыть меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div class="layout" id="kb-layout">
    <aside class="sidebar">
      <div class="brand" style="cursor:default;">
        <span class="brand-mark"></span>
        <span class="brand-name">База знаний</span>
        <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Свернуть меню">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="must-know-wrap" id="must-know-wrap" style="display:none;">
        <button class="must-know-btn" id="must-know-btn">
          <svg class="must-know-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Важное</span>
          <span class="count" id="must-know-count">0</span>
        </button>
      </div>

      <div class="section-label">Разделы</div>
      <nav class="categories" id="categories"></nav>
      <div class="sidebar-footer">База знаний колл-центра</div>
    </aside>

    <main class="main">
      <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="8" cy="8" r="5"/>
          <path d="M12 12l4 4"/>
        </svg>
        <input type="search" class="search-input" id="search-input"
               placeholder="Найти процедуру, скрипт или проблему" autocomplete="off">
      </div>
      <div class="results" id="results"><div class="loading-text">Загрузка…</div></div>
    </main>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Закрыть">×</button>
    <img id="lightbox-img" alt="">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://ujsakubqnirmpdwmmtju.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc2FrdWJxbmlybXBkd21tdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNDUwOTEsImV4cCI6MjA5ODgyMTA5MX0.8YZCsCpjroirJvKuQie76qXtpOvpmpE7dQoz2G502p4';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allArticles = [];
    let activeCategory = '';
    let activePinned = false;
    let expandedId = null;
    const wizardState = {};

    const els = {
      results: document.getElementById('results'),
      categories: document.getElementById('categories'),
      search: document.getElementById('search-input'),
      mustKnowWrap: document.getElementById('must-know-wrap'),
      mustKnowBtn: document.getElementById('must-know-btn'),
      mustKnowCount: document.getElementById('must-know-count'),
      layout: document.getElementById('kb-layout'),
      collapseBtn: document.getElementById('sidebar-collapse-btn'),
      openFab: document.getElementById('sidebar-open-fab'),
    };

    const SIDEBAR_KEY = 'kb_public_sidebar_hidden';

    function updateSidebarState() {
      const hidden = localStorage.getItem(SIDEBAR_KEY) === '1';
      els.layout.classList.toggle('sidebar-hidden', hidden);
      els.openFab.classList.toggle('show', hidden);
    }
    els.collapseBtn.addEventListener('click', () => {
      localStorage.setItem(SIDEBAR_KEY, '1');
      updateSidebarState();
    });
    els.openFab.addEventListener('click', () => {
      localStorage.setItem(SIDEBAR_KEY, '0');
      updateSidebarState();
    });
    updateSidebarState();

    const PURIFY_CONFIG = {
      ADD_TAGS: ['figure', 'figcaption', 'img', 'mark', 'u', 'del', 'div', 'span'],
      ADD_ATTR: ['src', 'alt', 'title', 'width', 'height', 'loading', 'target', 'rel', 'class'],
      ALLOW_DATA_ATTR: false,
    };

    const CALLOUT_TITLES = {
      note: 'Заметка',
      tip: 'Совет',
      warning: 'Внимание',
      danger: 'Запрещено',
      success: 'Готово',
      important: 'Важно'
    };
    const CALLOUT_TYPES = 'note|tip|warning|danger|success|important';

    function preprocessMarkdown(md) {
      // Нормализуем переносы строк
      md = md.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      
      // Универсальная регулярка для :::type ... :::
      const regex = new RegExp(`(^|\\n):::(${CALLOUT_TYPES})([\\s\\S]*?):::[ \\t]*(?=\\n|$)`, 'g');
      
      md = md.replace(regex, (m, prefix, type, body) => {
        const title = CALLOUT_TITLES[type] || type;
        const inner = marked.parse(body.trim());
        return `${prefix}\n<div class="callout callout-${type}"><div class="callout-title">${title}</div>${inner}</div>\n`;
      });
      
      md = md.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
      return md;
    }

    function renderMarkdown(text) {
      if (!text) return '';
      const preprocessed = preprocessMarkdown(text);
      const rawHtml = marked.parse(preprocessed);
      const clean = DOMPurify.sanitize(rawHtml, PURIFY_CONFIG);
      const tmp = document.createElement('div');
      tmp.innerHTML = clean;
      tmp.querySelectorAll('img').forEach(img => {
        img.setAttribute('loading', 'lazy');
        img.setAttribute('decoding', 'async');
        const alt = img.getAttribute('alt') || '';
        if (alt && alt.length > 2) {
          const fig = document.createElement('figure');
          img.replaceWith(fig);
          fig.appendChild(img);
          const cap = document.createElement('figcaption');
          cap.textContent = alt;
          fig.appendChild(cap);
        }
      });
      return tmp.innerHTML;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function excerpt(text, len = 180) {
      const plain = (text || '')
        .replace(/<[^>]*>/g, '')
        .replace(/:::\w+/g, '')
        .replace(/:::+/g, '')
        .replace(/[#*`>\-!\[\]\(\)=:]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      return plain.length > len ? plain.slice(0, len).trim() + '…' : plain;
    }

    function findArticleByKey(key) {
      const k = decodeURIComponent(key).toLowerCase().trim();
      return allArticles.find(a => a.title.toLowerCase().includes(k));
    }

    function bindArticleLinks(container) {
      container.querySelectorAll('a[href^="#article:"]').forEach(a => {
        a.classList.add('article-link');
        a.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const key = a.getAttribute('href').slice('#article:'.length);
          const target = findArticleByKey(key);
          if (target) {
            openArticle(target.id);
          } else {
            console.warn('[KB] Статья не найдена по ключу:', key);
          }
        });
      });
    }

    async function loadArticles() {
      const { data, error } = await supabaseClient
        .from('knowledge_articles').select('*')
        .order('category', { ascending: true }).order('title', { ascending: true });
      if (error) {
        els.results.innerHTML = `<div class="empty-state"><strong>Не удалось загрузить</strong>${escapeHtml(error.message)}</div>`;
        return;
      }
      allArticles = data || [];
      renderCategories();
      renderList(filterArticles());
    }

    function renderCategories() {
      const counts = {};
      allArticles.forEach(a => { counts[a.category] = (counts[a.category] || 0) + 1; });
      const pinnedCount = allArticles.filter(a => a.pinned).length;

      els.mustKnowWrap.style.display = pinnedCount > 0 ? 'block' : 'none';
      els.mustKnowCount.textContent = pinnedCount;
      els.mustKnowBtn.classList.toggle('active', activePinned);
      els.mustKnowBtn.onclick = () => {
        activePinned = !activePinned;
        if (activePinned) activeCategory = '';
        expandedId = null;
        document.body.classList.remove('article-open');
        renderCategories();
        renderList(filterArticles());
      };

      let html = `<button class="category-btn ${!activePinned && activeCategory === '' ? 'active' : ''}" data-cat="">
        <span>Все разделы</span><span class="category-count">${allArticles.length}</span>
      </button>`;
      Object.keys(counts).sort().forEach(cat => {
        html += `<button class="category-btn ${!activePinned && activeCategory === cat ? 'active' : ''}" data-cat="${escapeHtml(cat)}">
          <span>${escapeHtml(cat)}</span>
          <span class="category-count">${counts[cat]}</span>
        </button>`;
      });
      els.categories.innerHTML = html;
      els.categories.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activePinned = false;
          activeCategory = btn.dataset.cat;
          expandedId = null;
          document.body.classList.remove('article-open');
          renderCategories();
          renderList(filterArticles());
        });
      });
    }

    function filterArticles() {
      const q = els.search.value.trim().toLowerCase();
      return allArticles.filter(a => {
        if (activePinned && !a.pinned) return false;
        if (!activePinned && activeCategory && a.category !== activeCategory) return false;
        if (!q) return true;
        return a.title.toLowerCase().includes(q)
          || (a.content || '').toLowerCase().includes(q)
          || (a.tags || []).some(t => t.toLowerCase().includes(q));
      });
    }

    function renderList(articles) {
      if (expandedId) {
        const article = allArticles.find(a => a.id === expandedId);
        if (article) {
          renderArticleView(article);
          return;
        }
        expandedId = null;
        document.body.classList.remove('article-open');
      }
      renderArticleList(articles);
    }

    function renderArticleList(articles) {
      if (!articles.length) {
        els.results.innerHTML = `<div class="empty-state">
          <strong>Ничего не найдено</strong>
          Попробуйте изменить запрос или выбрать другой раздел.
        </div>`;
        return;
      }
      els.results.innerHTML = articles.map(a => {
        const isWizard = a.steps && a.steps.steps && a.steps.steps.length;
        const badges = (isWizard ? '<span class="badge-scenario">Сценарий</span>' : '')
          + (a.pinned ? '<span class="badge-pinned">Важное</span>' : '');
        return `
          <article class="article" data-id="${a.id}">
            <div class="article-head">
              <div class="article-meta">
                <span>${escapeHtml(a.category)}</span>
                <span class="dot"></span>
                <span>${new Date(a.updated_at).toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' })}</span>
              </div>
              <h2 class="article-title">${escapeHtml(a.title)}${badges}</h2>
              <p class="article-excerpt">${escapeHtml(excerpt(a.content || (isWizard ? 'Пошаговый сценарий диагностики' : '')))}</p>
            </div>
          </article>
        `;
      }).join('');

      els.results.querySelectorAll('.article-head').forEach(head => {
        head.addEventListener('click', () => openArticle(head.parentElement.dataset.id));
      });
    }

    function renderArticleView(article) {
      const isWizard = article.steps && article.steps.steps && article.steps.steps.length;
      const badges = (isWizard ? '<span class="badge-scenario">Сценарий</span>' : '')
        + (article.pinned ? '<span class="badge-pinned">Важное</span>' : '');

      const bodyHtml = isWizard
        ? `<div class="wizard" data-wizard-article="${article.id}">${renderWizardStep(article)}</div>`
        : `<div class="prose">${renderMarkdown(article.content)}</div>`;

      els.results.innerHTML = `
        <div class="article-view">
          <button class="article-back-btn" data-back>← Назад к списку</button>
          <div class="article-view-meta">
            <span>${escapeHtml(article.category)}</span>
            <span class="dot"></span>
            <span>${new Date(article.updated_at).toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' })}</span>
          </div>
          <h1 class="article-view-title">${escapeHtml(article.title)}${badges}</h1>
          <div class="article-view-body">${bodyHtml}</div>
        </div>
      `;

      els.results.querySelector('[data-back]').addEventListener('click', closeArticle);

      els.results.querySelectorAll('.prose img').forEach(img => {
        img.addEventListener('click', () => openLightbox(img.src, img.alt));
      });

      bindArticleLinks(els.results);

      if (isWizard) bindWizard(article);
    }

    function ensureWizardState(a) {
      if (!wizardState[a.id]) wizardState[a.id] = { stepId: a.steps.start, history: [] };
      return wizardState[a.id];
    }

    function renderWizardStep(a) {
      const st = ensureWizardState(a);
      const step = a.steps.steps.find(s => s.id === st.stepId);
      if (!step) {
        return `<div class="wizard-step-title">Шаг не найден</div>
          <button class="btn btn-ghost" data-wizard-reset>Начать сначала</button>`;
      }
      
      const tone = step.tone ? `wizard-step-tone-${step.tone}` : '';
      const contentHtml = step.content ? `<div class="wizard-step-content prose">${renderMarkdown(step.content)}</div>` : '';
      
      let optionsHtml = '';
      if (step.kind === 'question' && step.options && step.options.length) {
        optionsHtml = `<div class="wizard-options">${step.options.map(o => {
          const optTone = o.tone ? ` opt-${o.tone}` : '';
          return `<button class="wizard-option${optTone}" data-wizard-next="${o.next || ''}" ${!o.next ? 'disabled' : ''}>
            ${escapeHtml(o.label || '(без названия)')}
          </button>`;
        }).join('')}</div>`;
      } else if (step.kind === 'info' && step.next) {
        optionsHtml = `<div class="wizard-options">
          <button class="wizard-option" data-wizard-next="${step.next}">Далее</button>
        </div>`;
      } else if (step.kind === 'end') {
        optionsHtml = `<div class="wizard-options" style="margin-bottom:0;">
          <div style="padding:16px 18px;border:1px dashed var(--hairline-2);border-radius:10px;text-align:center;color:var(--ink-3);font-size:13.5px;">
            Сценарий завершён
          </div>
        </div>`;
      }
      const canBack = st.history.length > 0;
      const progress = st.history.length + 1;
      return `
        <div class="wizard-step ${tone}">
          <div class="wizard-step-title">${escapeHtml(step.title || 'Шаг')}</div>
          ${contentHtml}
          ${optionsHtml}
          <div class="wizard-nav">
            ${canBack ? '<button class="btn btn-ghost btn-sm" data-wizard-back>← Назад</button>' : ''}
            <button class="btn btn-ghost btn-sm" data-wizard-reset>Начать сначала</button>
            <span class="wizard-progress">Шаг ${progress}</span>
          </div>
        </div>
      `;
    }

    function bindWizard(article) {
      const wizardEl = document.querySelector(`.wizard[data-wizard-article="${article.id}"]`);
      if (!wizardEl) return;

      function rerender() {
        wizardEl.innerHTML = renderWizardStep(article);
        bindWizard(article);
        wizardEl.querySelectorAll('.prose img').forEach(img => {
          img.addEventListener('click', () => openLightbox(img.src, img.alt));
        });
        bindArticleLinks(wizardEl);
      }

      wizardEl.querySelectorAll('[data-wizard-next]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.wizardNext;
          if (!target) return;
          const st = ensureWizardState(article);
          st.history.push(st.stepId);
          st.stepId = target;
          rerender();
        });
      });
      const b = wizardEl.querySelector('[data-wizard-back]');
      if (b) b.addEventListener('click', () => {
        const st = ensureWizardState(article);
        if (!st.history.length) return;
        st.stepId = st.history.pop();
        rerender();
      });
      const r = wizardEl.querySelector('[data-wizard-reset]');
      if (r) r.addEventListener('click', () => {
        const st = ensureWizardState(article);
        st.stepId = article.steps.start;
        st.history = [];
        rerender();
      });

      bindArticleLinks(wizardEl);
    }

    function openArticle(id) {
      expandedId = id;
      const article = allArticles.find(a => a.id === id);
      if (article && article.steps) wizardState[id] = null;
      document.body.classList.add('article-open');
      renderList(filterArticles());
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeArticle() {
      expandedId = null;
      document.body.classList.remove('article-open');
      renderList(filterArticles());
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt || '';
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (lightbox.classList.contains('open')) closeLightbox();
        else if (expandedId) closeArticle();
      }
    });

    els.search.addEventListener('input', () => {
      if (expandedId) {
        expandedId = null;
        document.body.classList.remove('article-open');
      }
      renderList(filterArticles());
    });

    loadArticles();
  </script>
</body>
</html>
