<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Руководство — Колл-центр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kb-styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="index.html">
        <span class="brand-mark"></span>
        <span class="brand-name">Руководство</span>
      </a>
      <div class="section-label">Разделы</div>
      <nav class="categories" id="categories"></nav>
      <div class="sidebar-footer">
        <a href="kb-admin.html">Администрирование →</a>
      </div>
    </aside>

    <main class="main">
      <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="8" cy="8" r="5"/>
          <path d="M12 12l4 4"/>
        </svg>
        <input type="search" class="search-input" id="search-input"
               placeholder="Найти процедуру, скрипт или проблему" autocomplete="off">
      </div>

      <div class="results" id="results">
        <div class="loading-text">Загрузка…</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    // ==== КОНФИГ ====
    const SUPABASE_URL = 'https://wzcysenonxyjlksnaezi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6Y3lzZW5vbnh5amxrc25hZXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MzkwMzIsImV4cCI6MjA5ODMxNTAzMn0.z9yitIF0-gYrEqS_5ZRYop0xGm4OeCbJ3SEZH1kcOhk';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allArticles = [];
    let activeCategory = '';

    const els = {
      results: document.getElementById('results'),
      categories: document.getElementById('categories'),
      search: document.getElementById('search-input'),
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function renderMarkdown(text) {
      if (!text) return '';
      return DOMPurify.sanitize(marked.parse(text));
    }

    function excerpt(text, len = 180) {
      const plain = (text || '').replace(/[#*`>\-]/g, '').replace(/\n+/g, ' ').trim();
      return plain.length > len ? plain.slice(0, len).trim() + '…' : plain;
    }

    async function loadArticles() {
      const { data, error } = await supabase
        .from('knowledge_articles')
        .select('*')
        .order('category', { ascending: true })
        .order('title', { ascending: true });

      if (error) {
        els.results.innerHTML = `<div class="empty-state"><strong>Не удалось загрузить</strong>${escapeHtml(error.message)}</div>`;
        return;
      }
      allArticles = data || [];
      renderCategories();
      renderList(filterArticles());
    }

    function renderCategories() {
      const counts = {};
      allArticles.forEach(a => { counts[a.category] = (counts[a.category] || 0) + 1; });

      let html = `<button class="category-btn ${activeCategory === '' ? 'active' : ''}" data-cat="">
        <span>Все разделы</span><span class="category-count">${allArticles.length}</span>
      </button>`;

      Object.keys(counts).sort().forEach(cat => {
        html += `<button class="category-btn ${activeCategory === cat ? 'active' : ''}" data-cat="${escapeHtml(cat)}">
          <span>${escapeHtml(cat)}</span>
          <span class="category-count">${counts[cat]}</span>
        </button>`;
      });
      els.categories.innerHTML = html;

      els.categories.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderCategories();
          renderList(filterArticles());
        });
      });
    }

    function filterArticles() {
      const q = els.search.value.trim().toLowerCase();
      return allArticles.filter(a => {
        if (activeCategory && a.category !== activeCategory) return false;
        if (!q) return true;
        return a.title.toLowerCase().includes(q)
          || (a.content || '').toLowerCase().includes(q)
          || (a.tags || []).some(t => t.toLowerCase().includes(q));
      });
    }

    function renderList(articles) {
      if (!articles.length) {
        els.results.innerHTML = `<div class="empty-state">
          <strong>Ничего не найдено</strong>
          Попробуйте изменить запрос или выбрать другой раздел.
        </div>`;
        return;
      }

      els.results.innerHTML = articles.map(a => `
        <article class="article" data-id="${a.id}">
          <div class="article-head">
            <div class="article-meta">
              <span>${escapeHtml(a.category)}</span>
              <span class="dot"></span>
              <span>${new Date(a.updated_at).toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' })}</span>
            </div>
            <h2 class="article-title">${escapeHtml(a.title)}</h2>
            <p class="article-excerpt">${escapeHtml(excerpt(a.content))}</p>
          </div>
          <div class="article-expanded">
            <div class="inner prose">${renderMarkdown(a.content)}</div>
          </div>
        </article>
      `).join('');

      els.results.querySelectorAll('.article-head').forEach(head => {
        head.addEventListener('click', () => toggleArticle(head.parentElement));
      });
    }

    function toggleArticle(el) {
      const expanded = el.querySelector('.article-expanded');
      const isOpen = el.classList.contains('expanded');
      if (isOpen) {
        expanded.style.maxHeight = '0px';
        el.classList.remove('expanded');
      } else {
        el.classList.add('expanded');
        expanded.style.maxHeight = expanded.scrollHeight + 40 + 'px';
      }
    }

    els.search.addEventListener('input', () => renderList(filterArticles()));

    loadArticles();
  </script>
</body>
</html>
